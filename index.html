<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>DAA Exam Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap">
<style>/* Layout: fixed left rail (topics + tools) beside a single reading column; rail becomes a top drawer on phones.
   Concept: an exam answer-sheet — ink blue on ruled graph paper, with the examiner's red pen for marks and answers. */
:root{
  --paper:#f7f8fb; --sheet:#ffffff; --ink:#1a2340; --ink-2:#4a5577; --rule:#dfe3ee; --grid:rgba(58,84,170,.06);
  --blue:#2846b8; --blue-soft:#e8edfc; --red:#c8322b; --red-soft:#fdecea; --green:#1f7a4d; --green-soft:#e3f4ea;
  --amber:#a86b00; --on-accent:#ffffff; --amber-soft:#fdf3dc; --code-bg:#f1f3f9; --shadow:0 1px 2px rgba(20,30,70,.06),0 4px 16px rgba(20,30,70,.05);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1424; --sheet:#161c30; --ink:#e6e9f5; --ink-2:#a3abc7; --rule:#2a3350; --grid:rgba(120,150,255,.05);
  --blue:#8aa4ff; --blue-soft:#1f2a52; --red:#ff7d73; --red-soft:#3a1f22; --green:#5fd39a; --green-soft:#16352a;
  --amber:#f2c063; --amber-soft:#3a2e14; --on-accent:#0f1424; --code-bg:#1c2340; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1424; --sheet:#161c30; --ink:#e6e9f5; --ink-2:#a3abc7; --rule:#2a3350; --grid:rgba(120,150,255,.05);
  --blue:#8aa4ff; --blue-soft:#1f2a52; --red:#ff7d73; --red-soft:#3a1f22; --green:#5fd39a; --green-soft:#16352a;
  --amber:#f2c063; --amber-soft:#3a2e14; --on-accent:#0f1424; --code-bg:#1c2340; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--blue)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--sheet);border-right:1px solid var(--rule);padding:18px 14px 30px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px}
.brand b{font-family:var(--f-display);font-size:21px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--ink-2)}
.countdown-mini{margin:0 6px;padding:8px 10px;border:1.5px dashed var(--red);border-radius:8px;color:var(--red);font-size:13px;font-weight:600}
.nav-group{display:flex;flex-direction:column;gap:1px}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2);padding:8px 8px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.nav-item:hover{background:var(--blue-soft)}
.nav-item.active{background:var(--blue);color:var(--on-accent)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;flex:none;border:1.5px solid var(--ink-2)}
.nav-item .dot.reading{background:var(--amber);border-color:var(--amber)}
.nav-item .dot.done{background:var(--green);border-color:var(--green)}
.nav-item.active .dot{border-color:var(--on-accent)}
.menu-btn{display:none}

.main{min-width:0;padding-block:28px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--red);font-weight:600}
.page-title{font-size:clamp(26px,4vw,36px);letter-spacing:-.015em}
.muted{color:var(--ink-2)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spacer{flex:1}

.btn{border:1px solid var(--rule);background:var(--sheet);padding:7px 14px;border-radius:7px;cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=number]{border:1px solid var(--rule);background:var(--sheet);border-radius:7px;padding:6px 10px;font-size:14px;max-width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap;font-weight:500}
.chip.high{color:var(--red);border-color:var(--red)}
.chip.marks{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.chip.num{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.th{background:var(--green-soft);border-color:transparent;color:var(--green)}
.chip-toggle{cursor:pointer;user-select:none}
.chip-toggle.on{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--rule);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;cursor:pointer;font-weight:500;color:var(--ink-2);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}

/* rich content (notes & solutions) */
.rich{min-width:0;overflow-wrap:break-word}
.rich h3{font-size:21px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.rich h3:first-child{margin-top:0}
.rich h4{font-size:17px;margin:16px 0 6px}
.rich p{margin:8px 0}
.rich ul,.rich ol{margin:6px 0;padding-left:22px}
.rich li{margin:3px 0}
.rich .def{background:var(--blue-soft);border-left:3px solid var(--blue);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.rich .tip{background:var(--red-soft);border-left:3px solid var(--red);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.rich .note{background:var(--amber-soft);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0}
.rich .step{margin:8px 0;padding-left:12px;border-left:2px solid var(--rule)}
.rich .ans{border:2px solid var(--red);color:var(--ink);padding:8px 14px;border-radius:6px;margin:12px 0 4px;font-weight:600;background:var(--sheet)}
.rich pre,pre.code,pre.tree{font-family:var(--f-mono);font-size:13px;line-height:1.45;background:var(--code-bg);padding:12px 14px;border-radius:8px;overflow-x:auto;margin:10px 0;white-space:pre}
.rich pre.tree{background:transparent;border:1px dashed var(--rule)}
.tablewrap{overflow-x:auto;margin:10px 0;max-width:100%}
table.t{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:max-content}
table.t th,table.t td{border:1px solid var(--rule);padding:5px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--blue-soft);font-weight:600}
.hl{background:var(--amber-soft);font-weight:600}
.hlr{color:var(--red);font-weight:700}

/* question cards */
.qcard{display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.qnum{font-family:var(--f-display);font-weight:700;color:var(--red);font-size:15px}
.qtext{font-weight:500}
.sol{border-top:1px dashed var(--rule);padding-top:12px}
.sol-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--red);font-weight:700;margin-bottom:4px}

/* flashcards */
.flash{perspective:1200px;cursor:pointer;min-height:280px}
.flash-inner{position:relative;width:100%;min-height:280px;transition:transform .5s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;box-shadow:var(--shadow);overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--blue)}
.face .big{font-size:20px;font-family:var(--f-display);font-weight:600}
.face .rich{text-align:left;max-width:640px}
@media (prefers-reduced-motion:reduce){.flash-inner{transition:none}}

/* mcq */
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;cursor:pointer;background:var(--sheet);text-align:left;width:100%}
.opt:hover{border-color:var(--blue)}
.opt .key{font-weight:700;color:var(--ink-2);min-width:18px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.pal{width:34px;height:34px;border-radius:6px;border:1px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.pal.ans{background:var(--blue);color:var(--on-accent);border-color:var(--blue)}
.pal.flag{box-shadow:inset 0 -3px 0 var(--amber)}
.pal.cur{outline:2px solid var(--red)}
.pal.right{background:var(--green);color:var(--on-accent);border-color:var(--green)}
.pal.wrong{background:var(--red);color:var(--on-accent);border-color:var(--red)}
.timer{font-family:var(--f-mono);font-size:20px;font-weight:700;color:var(--red);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar.green > i{background:var(--green)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.big-count{font-family:var(--f-display);font-size:64px;font-weight:700;line-height:1;color:var(--red);font-variant-numeric:tabular-nums}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.plan-day{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--rule)}
.plan-day:first-child{border-top:0}
.plan-day.today{background:var(--blue-soft);margin:0 -12px;padding:10px 12px;border-radius:8px;border-top-color:transparent}
.plan-date{font-weight:700;font-size:14px}
.plan-date small{display:block;font-weight:400;color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.check input{margin-top:5px;accent-color:var(--green)}
.topic-tile{display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:10px;padding:14px;transition:border-color .15s}
.topic-tile:hover{border-color:var(--blue)}
.topic-tile h4{font-size:16px}
.unit-head{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.unit-head h2{font-size:20px}

/* tree svg */
.svgwrap{overflow-x:auto;max-width:100%;background:var(--sheet);border:1px dashed var(--rule);border-radius:8px;padding:6px}
.svgwrap svg{display:block;margin:0 auto}
.svgwrap text{font-family:var(--f-mono);font-size:13px;fill:var(--ink)}
.svgwrap .nd{fill:var(--sheet);stroke:var(--blue);stroke-width:1.6}
.svgwrap .nd.leaf{fill:var(--blue-soft)}
.svgwrap .ed{stroke:var(--ink-2);stroke-width:1.3}
.svgwrap .el{fill:var(--red);font-weight:700;font-size:12px}

.matrix{display:inline-grid;grid-template-columns:repeat(2,auto);gap:2px 14px;border-left:2px solid var(--ink);border-right:2px solid var(--ink);padding:2px 8px;font-family:var(--f-mono);vertical-align:middle;border-radius:4px}
.formula-row{display:grid;grid-template-columns:minmax(140px,240px) minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.formula-row:first-child{border-top:0}
.formula-row .f{font-family:var(--f-mono);font-size:14px;overflow-x:auto}
.formula-row .n{font-size:13px;color:var(--ink-2)}
.empty{padding:30px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:8px;font-size:14px;z-index:50}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:40;transform:translateX(-102%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .menu-btn{display:inline-flex}
  .topbar{display:flex!important}
  .hero{grid-template-columns:minmax(0,1fr)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px}
  .formula-row{grid-template-columns:minmax(0,1fr)}
  .plan-day{grid-template-columns:minmax(0,1fr)}
  .big-count{font-size:48px}
}
.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--sheet);border-bottom:1px solid var(--rule);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));align-items:center;gap:10px}
.topbar b{font-family:var(--f-display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--sheet)}
</style>

<script>window.DAA={topics:[]};
window.DAA = window.DAA || { topics: [] };
DAA.topics.push({
  id: 'intro',
  unit: 1,
  title: 'Design of Algorithms & Pseudocode',
  lectures: 'L1–L3',
  weight: 'Medium',
  summary: 'What an algorithm is, its characteristics, how to express it in pseudocode, and the main design paradigms.',
  notes: `
<h3>1. What is an Algorithm?</h3>
<div class="def"><b>Definition:</b> An <b>algorithm</b> is a finite set of well-defined, unambiguous instructions that, when followed, accomplish a particular task — it takes zero or more inputs, processes them in a finite number of steps and produces at least one output.</div>
<p>Informally (slides): <i>"A set of rules to obtain the expected output from the given input."</i></p>
<pre class="tree">   Input  ──►  [  ALGORITHM  ]  ──►  Output
              (finite, clear steps)</pre>
<p><b>Design and Analysis of Algorithms (DAA)</b> studies two things: (i) <b>design</b> — how to devise a correct algorithm using a strategy (paradigm); (ii) <b>analysis</b> — how much time and memory the algorithm needs, so algorithms can be compared independent of machine and language.</p>

<h3>2. Characteristics (Properties) of an Algorithm</h3>
<p>Classical (Knuth / Horowitz–Sahni) properties:</p>
<table class="t">
<tr><th>Property</th><th>Meaning</th></tr>
<tr><td><b>Input</b></td><td>Zero or more quantities are externally supplied.</td></tr>
<tr><td><b>Output</b></td><td>At least one quantity is produced.</td></tr>
<tr><td><b>Definiteness</b></td><td>Each instruction is clear and unambiguous (e.g., "add 6 or 7 to x" is not allowed).</td></tr>
<tr><td><b>Finiteness</b></td><td>The algorithm terminates after a finite number of steps for all cases.</td></tr>
<tr><td><b>Effectiveness</b></td><td>Every instruction is basic enough to be carried out, in principle, by a person using pencil and paper.</td></tr>
</table>
<p>The lecture slides list them as: <b>Clear and Unambiguous, Well-defined Inputs, Well-defined Outputs, Finite-ness, Feasible, Language Independent.</b></p>
<ul>
<li><b>Feasible</b> – simple, generic, practical; executable with available resources (no "future technology").</li>
<li><b>Language independent</b> – plain instructions that can be implemented in any language with the same output.</li>
</ul>
<div class="note">A <b>program</b> need not satisfy finiteness (e.g., an operating system runs forever). An <b>algorithm</b> must terminate.</div>

<h3>3. Need for Algorithms</h3>
<ul>
<li>Solve complex problems efficiently and correctly.</li>
<li>Automate processes; make them reliable, faster and repeatable.</li>
<li>Allow comparison of solutions before coding (saves cost).</li>
<li>Scalability – predict behaviour for very large inputs.</li>
<li>Used in AI/ML, Big Data, cryptography, networking, OS scheduling, compilers, etc.</li>
</ul>

<h3>4. Steps in Designing an Algorithm (Algorithm Life-cycle)</h3>
<ol>
<li><b>Understand the problem</b> – inputs, outputs, constraints.</li>
<li><b>Decide on computational means</b> – exact vs approximate, data structures.</li>
<li><b>Choose a design technique</b> (paradigm) – D&amp;C, greedy, DP, …</li>
<li><b>Design / specify</b> the algorithm – natural language, flowchart or pseudocode.</li>
<li><b>Prove correctness</b> – show it gives the right output for every legal input (e.g., induction, loop invariant).</li>
<li><b>Analyse</b> – time and space complexity (best/worst/average).</li>
<li><b>Code</b> the algorithm (implementation) and <b>test</b> it.</li>
</ol>

<h3>5. Ways to Express an Algorithm</h3>
<ul>
<li><b>Natural language</b> – step-wise English (Step 1, Step 2, …). Easy but can be ambiguous.</li>
<li><b>Flowchart</b> – graphical (oval = start/stop, parallelogram = input/output, rectangle = process, diamond = decision).</li>
<li><b>Pseudocode</b> – structured, code-like English. Most used in DAA.</li>
</ul>

<h3>6. Pseudocode</h3>
<div class="def"><b>Definition:</b> <b>Pseudocode</b> is a step-by-step description of an algorithm written in plain English with a code-like structure (IF, FOR, WHILE …). It is meant for human understanding, not machine execution, and does not follow the syntax of any programming language. It is the intermediate state between an idea and its implementation.</div>
<pre class="tree">  Algorithm (idea)  ──►  Pseudocode  ──►  Program (code)</pre>
<h4>Rules for writing pseudocode (slides)</h4>
<ul>
<li>Define the goal first; organise tasks logically and in sequence.</li>
<li>Use standard constructs: IF–ELSE, FOR, WHILE, REPEAT–UNTIL.</li>
<li>Indent blocks properly; write keywords in CAPITALS.</li>
<li>Use meaningful variable names.</li>
<li>Keep it complete, finite and easy to understand; avoid real language syntax.</li>
</ul>
<h4>Horowitz–Sahni pseudocode conventions</h4>
<ol>
<li>Comments begin with <b>//</b>.</li>
<li>Blocks are enclosed in <b>{ }</b>; statements separated by <b>;</b>.</li>
<li>Assignment uses <b>:=</b> (or ←); e.g., <code>x := x + 1</code>.</li>
<li>Boolean values <b>true / false</b>; logical operators <b>and, or, not</b>; relational &lt;, ≤, =, ≠, ≥, &gt;.</li>
<li>Arrays: <b>A[i, j]</b>; index usually starts at 1.</li>
<li>Loops: <b>for</b> i := 1 to n step 1 do {…}; <b>while</b> (cond) do {…}; <b>repeat</b> … <b>until</b> (cond).</li>
<li>Conditional: <b>if</b> (cond) <b>then</b> s1 <b>else</b> s2; and <b>case</b> statement.</li>
<li>Input/output: <b>read</b> and <b>write</b>.</li>
<li>Heading: <b>Algorithm</b> Name(parameter list) — e.g., <code>Algorithm Max(A, n)</code>; <b>return</b> to exit.</li>
</ol>
<h4>Example – Largest element in an array</h4>
<pre class="code">Algorithm Max(A, n)
// A is an array of size n; returns the largest element
{
    Result := A[1];
    for i := 2 to n do
        if (A[i] &gt; Result) then Result := A[i];
    return Result;
}</pre>
<h4>Example – Area of a circle (slide activity)</h4>
<pre class="code">Algorithm: 1. Start  2. Read r  3. Area = 3.14*r*r  4. Display Area  5. End

Pseudocode:
AreaOfCircle()
BEGIN
    READ r
    Area = 3.14 * r * r
    WRITE Area
END</pre>
<h4>Advantages of pseudocode</h4>
<ul>
<li>Improves readability; works as rough documentation.</li>
<li>Bridge between algorithm and program; easy to convert to any language.</li>
<li>Logic errors are caught early, before coding.</li>
<li>Lets the programmer concentrate on logic rather than syntax.</li>
</ul>
<h4>Disadvantages</h4>
<ul><li>No standard syntax; not executable; not visual like a flowchart; can be lengthy for complex problems.</li></ul>

<h3>7. Algorithm vs Pseudocode vs Program</h3>
<table class="t">
<tr><th>Algorithm</th><th>Pseudocode</th><th>Program</th></tr>
<tr><td>Well-defined step-wise solution to a problem.</td><td>Step-by-step description of an algorithm in code-like plain English.</td><td>Implementation of an algorithm in a programming language.</td></tr>
<tr><td>Uses simple English words.</td><td>Uses reserved keywords (IF, FOR, WHILE).</td><td>Uses exact syntax of a language (C, Java …).</td></tr>
<tr><td>No strict rules.</td><td>Has certain conventions.</td><td>Strict syntax rules; compiled/interpreted.</td></tr>
<tr><td>Must terminate (finite).</td><td>Must terminate.</td><td>May run forever (e.g., OS).</td></tr>
<tr><td>Language independent.</td><td>Language independent.</td><td>Language dependent.</td></tr>
<tr><td>Written at design time.</td><td>Written at design time.</td><td>Written at implementation time.</td></tr>
</table>
<p>Slide note: <i>"Algorithms can be considered pseudocode, but pseudocode cannot be considered an algorithm."</i> Pseudocode is easier to understand and interpret.</p>

<h3>8. Algorithm Design Paradigms (Types of Algorithms)</h3>
<table class="t">
<tr><th>Paradigm</th><th>Idea</th><th>Examples</th></tr>
<tr><td><b>Brute Force</b></td><td>Try all possible solutions directly.</td><td>Linear search, selection sort, naive string matching</td></tr>
<tr><td><b>Divide &amp; Conquer</b></td><td>Divide into sub-problems, solve recursively, combine.</td><td>Binary search, merge sort, quick sort, Strassen</td></tr>
<tr><td><b>Greedy</b></td><td>Take the locally best choice at each step; never reconsider.</td><td>Job sequencing, fractional knapsack, Huffman, Prim, Kruskal</td></tr>
<tr><td><b>Dynamic Programming</b></td><td>Solve overlapping sub-problems once, store results (table).</td><td>0/1 knapsack, LCS, matrix chain, TSP</td></tr>
<tr><td><b>Backtracking</b></td><td>Build solution incrementally, abandon partial solutions that fail constraints.</td><td>N-Queens, sum of subsets, graph colouring</td></tr>
<tr><td><b>Branch &amp; Bound</b></td><td>Explore state-space tree using bounds to prune.</td><td>0/1 knapsack, TSP</td></tr>
<tr><td><b>Randomized</b></td><td>Use random choices.</td><td>Randomized quick sort</td></tr>
</table>

<h3>9. Tracing Pseudocode (output questions)</h3>
<p>Exams often give a short pseudocode and ask the output. Method: write a table of variables, update line by line, expand recursive calls one level at a time.</p>

  summary: 'Measuring algorithm efficiency: space complexity S(P)=c+Sp, time complexity by step/frequency count, and best/worst/average cases.',
  notes: `
<h3>1. Performance Analysis</h3>
<div class="def"><b>Performance analysis</b> (a priori analysis) estimates the computing resources (time and memory) an algorithm needs, as a function of the input size n, before running it. <b>Performance measurement</b> (a posteriori testing) actually runs the program and measures time/space.</div>
<p>Efficiency is measured in two resources:</p>
<ul>
<li><b>Time complexity</b> – how fast the algorithm runs (number of basic operations as a function of n).</li>
<li><b>Space complexity</b> – memory needed by the algorithm in addition to/including its input.</li>
</ul>
<p><b>Why analyse?</b> To predict behaviour for large inputs (scalability), to compare algorithms independent of hardware/language/compiler, and to choose the best one without implementing all.</p>
<table class="t"><tr><th>A priori analysis</th><th>A posteriori testing</th></tr>
<tr><td>Before implementation (theoretical)</td><td>After implementation (experimental)</td></tr>
<tr><td>Independent of machine &amp; language</td><td>Depends on machine, compiler, language</td></tr>
<tr><td>Gives approximate (asymptotic) answer</td><td>Gives exact time for that machine</td></tr>
<tr><td>Uses step count / asymptotic notation</td><td>Uses timers / profilers</td></tr></table>

<h3>2. Space Complexity</h3>
<div class="def"><b>Space complexity</b> S(P) of an algorithm P is the total amount of memory it needs to run to completion. <br><b>S(P) = c + S<sub>P</sub>(instance characteristics)</b></div>
<ul>
<li><b>Fixed part c</b> – independent of input size: space for instructions (code), simple variables, constants, fixed-size structures.</li>
<li><b>Variable part S<sub>P</sub></b> – depends on instance characteristics (n): arrays of size n, dynamically allocated memory, and the <b>recursion stack</b>.</li>
</ul>
<h4>Examples (Horowitz)</h4>
<pre class="code">Algorithm abc(a, b, c)
{ return a + b + b*c + (a + b - c)/(a + b) + 4.0; }</pre>
<p>Only fixed variables a, b, c ⇒ S<sub>P</sub> = 0 ⇒ S = constant ⇒ <b>Θ(1)</b>.</p>
<pre class="code">Algorithm Sum(a, n)
{ s := 0.0;
  for i := 1 to n do s := s + a[i];
  return s; }</pre>
<p>Space: a[] needs n words, n, i, s one word each ⇒ S(n) ≥ n + 3 ⇒ <b>Θ(n)</b> (counting input); extra (auxiliary) space Θ(1).</p>
<pre class="code">Algorithm RSum(a, n)
{ if (n ≤ 0) then return 0.0;
  else return RSum(a, n-1) + a[n]; }</pre>
<p>Each recursive call stores: return address, pointer to a, n ⇒ ≥ 3 words; recursion depth = n + 1 ⇒ S<sub>RSum</sub>(n) ≥ 3(n + 1) ⇒ <b>Θ(n)</b> stack space.</p>
<div class="note"><b>Auxiliary space</b> = extra space excluding input. E.g., merge sort Θ(n) auxiliary, quick sort Θ(log n) stack (average), heap sort Θ(1).</div>

<h3>3. Time Complexity</h3>
<div class="def"><b>Time complexity</b> T(P) = compile time + run time. Since compile time does not depend on instance characteristics, we consider only the <b>run time t<sub>P</sub>(n)</b>, measured as the number of program steps (or basic operations) as a function of input size n.</div>
<p>A <b>program step</b> is a syntactically or semantically meaningful segment whose execution time is independent of n (e.g., an assignment, a comparison, a return). Comments and declarations count 0 steps.</p>

<h4>Method 1 – Step count using a global variable <i>count</i></h4>
<p>Insert <code>count := count + 1</code> after every executable statement and compute the final value.</p>

<h4>Method 2 – Step-count (frequency) table</h4>
<p>For each statement: <b>s/e</b> (steps per execution) × <b>frequency</b> (how many times it executes) = total steps.</p>

<h4>Example A – Sum of n numbers</h4>
<table class="t"><tr><th>Statement</th><th>s/e</th><th>Frequency</th><th>Total</th></tr>
<tr><td>Algorithm Sum(a, n) {</td><td>0</td><td>–</td><td>0</td></tr>
<tr><td>s := 0.0;</td><td>1</td><td>1</td><td>1</td></tr>
<tr><td>for i := 1 to n do</td><td>1</td><td>n + 1</td><td>n + 1</td></tr>
<tr><td>s := s + a[i];</td><td>1</td><td>n</td><td>n</td></tr>
<tr><td>return s;</td><td>1</td><td>1</td><td>1</td></tr>
<tr><td>}</td><td>0</td><td>–</td><td>0</td></tr>
<tr><th colspan="3">Total</th><th>2n + 3</th></tr></table>
<p><b>Why n + 1 for the loop header?</b> The condition is tested n times true and once more (false) to exit.</p>

<h4>Example B – Recursive sum RSum</h4>
<p>t(0) = 2 (test + return); t(n) = 2 + t(n−1) for n &gt; 0.</p>
<p>t(n) = 2 + t(n−1) = 2·2 + t(n−2) = … = 2n + t(0) = <b>2n + 2 = Θ(n)</b>.</p>

<h4>Example C – Matrix addition (m × n)</h4>
<table class="t"><tr><th>Statement</th><th>s/e</th><th>Frequency</th><th>Total</th></tr>
<tr><td>for i := 1 to m do</td><td>1</td><td>m + 1</td><td>m + 1</td></tr>
<tr><td>&nbsp;&nbsp;for j := 1 to n do</td><td>1</td><td>m(n + 1)</td><td>mn + m</td></tr>
<tr><td>&nbsp;&nbsp;&nbsp;&nbsp;c[i,j] := a[i,j] + b[i,j];</td><td>1</td><td>mn</td><td>mn</td></tr>
<tr><th colspan="3">Total</th><th>2mn + 2m + 1</th></tr></table>
<p>For square matrices (m = n): 2n² + 2n + 1 = <b>Θ(n²)</b>.</p>

<h4>Example D – Matrix multiplication (n × n)</h4>
<pre class="code">for i := 1 to n do
    for j := 1 to n do
    {   c[i,j] := 0;
        for k := 1 to n do
            c[i,j] := c[i,j] + a[i,k] * b[k,j];
    }</pre>
<table class="t"><tr><th>Statement</th><th>Frequency</th></tr>
<tr><td>for i</td><td>n + 1</td></tr>
<tr><td>for j</td><td>n(n + 1)</td></tr>
<tr><td>c[i,j] := 0</td><td>n²</td></tr>
<tr><td>for k</td><td>n²(n + 1)</td></tr>
<tr><td>c[i,j] := c[i,j] + a[i,k]*b[k,j]</td><td>n³</td></tr>
<tr><th>Total</th><th>2n³ + 3n² + 2n + 1 = Θ(n³)</th></tr></table>

<h3>4. Best, Worst and Average Case</h3>
<ul>
<li><b>Worst case</b> (mostly used) – input of size n that causes the <i>maximum</i> number of operations. Gives a guarantee (upper bound).</li>
<li><b>Best case</b> (rarely used) – input causing the <i>minimum</i> number of operations.</li>
<li><b>Average case</b> – expected operations over all inputs of size n (sum of costs × probability). Needs a probability distribution.</li>
</ul>
<h4>Linear search on n elements</h4>
<table class="t"><tr><th>Case</th><th>When</th><th>Comparisons</th><th>Complexity</th></tr>
<tr><td>Best</td><td>key at first position</td><td>1</td><td>Θ(1)</td></tr>
<tr><td>Worst</td><td>key at last position / absent</td><td>n</td><td>Θ(n)</td></tr>
<tr><td>Average (key present, equally likely)</td><td>–</td><td>(1+2+…+n)/n = (n+1)/2</td><td>Θ(n)</td></tr></table>

<h3>5. Analysing Loops – Rules</h3>
<table class="t"><tr><th>Code pattern</th><th>Iterations</th><th>Complexity</th></tr>
<tr><td>for i = 1 to n</td><td>n</td><td>Θ(n)</td></tr>
<tr><td>for i = 1 to n; for j = 1 to n</td><td>n²</td><td>Θ(n²)</td></tr>
<tr><td>for i = 1 to n; for j = 1 to i</td><td>n(n+1)/2</td><td>Θ(n²)</td></tr>
<tr><td>i = 1; while i &lt; n: i = i*2</td><td>⌈log₂ n⌉</td><td>Θ(log n)</td></tr>
<tr><td>i = n; while i &gt; 1: i = i/2</td><td>⌊log₂ n⌋</td><td>Θ(log n)</td></tr>
<tr><td>for i = 1 to n; j = 1; while j &lt; n: j = 2j</td><td>n·log₂ n</td><td>Θ(n log n)</td></tr>
<tr><td>i = 1; while i·i ≤ n: i++</td><td>⌊√n⌋</td><td>Θ(√n)</td></tr>
<tr><td>for (i = n; i &gt; 0; i = i/2) for j = 1 to i</td><td>n + n/2 + n/4 + … &lt; 2n</td><td>Θ(n)</td></tr>
<tr><td>for i = 1 to n; for j = 1 to n; for k = 1 to n</td><td>n³</td><td>Θ(n³)</td></tr></table>
<p><b>Rules:</b> consecutive statements → add (keep the max); nested loops → multiply; if–else → max of the branches; loop variable multiplied/divided by a constant → logarithmic.</p>

<div class="tip"><b>Exam tips / common mistakes:</b>
<ul>
<li>Loop header frequency is <b>n + 1</b>, body is <b>n</b>. Inner loop header inside an outer loop of n iterations: n(m + 1).</li>
<li>Always state S(P) = c + S<sub>P</sub> and identify fixed and variable parts separately.</li>
<li>For recursion, space = (words per call) × (depth of recursion).</li>
<li>Worst-case is not the same as Big-O; best case is not the same as Ω. Cases describe <i>inputs</i>, notations describe <i>bounds</i>.</li>
<li>Write the final answer in Θ/O notation after the exact step count.</li>
</ul></div>

    { type: 'theory', marks: 10, q: 'What is performance analysis of an algorithm? Explain space complexity and time complexity in detail with examples (step-count method).', s: `<div class="def"><b>Performance analysis</b> is the a priori estimation of the computing time and storage an algorithm needs, as functions of input size n, so that algorithms can be compared independent of machine.</div>
<h4>1. Space complexity</h4>
<p>S(P) = c + S<sub>P</sub>(n).</p>

<p><b>Example 3:</b> RSum(a,n): 3 words per call × (n+1) calls ⇒ Θ(n).</p>
<h4>2. Time complexity</h4>

<p><b>Matrix addition:</b> 2mn + 2m + 1. <b>Matrix multiplication:</b> 2n³ + 3n² + 2n + 1.</p>
<h4>3. Cases</h4>
<p>Best / worst / average case — e.g., linear search Θ(1) / Θ(n) / Θ(n).</p>
<h4>4. Why asymptotic notation?</h4>
<p>Exact step counts are tedious and constants depend on what we call a "step"; so we keep only the dominant term: 2n+3 = Θ(n), 2n³+3n²+2n+1 = Θ(n³).</p>

DAA.topics.push({
  id: 'asym',
  unit: 1,
  title: 'Asymptotic Notations (O, Ω, Θ, o, ω)',
  lectures: 'L5–L8',
  weight: 'High',
  summary: 'Mathematical notations describing growth rate of running time: upper bound O, lower bound Ω, tight bound Θ, strict bounds o and ω.',
  notes: `
<h3>1. Why Asymptotic Notation?</h3>
<p>Exact running time depends on hardware, compiler and language. Asymptotic notation describes how running time <b>grows</b> as input size n → ∞, ignoring constant factors and lower-order terms. E.g., T(n) = 3n² + 5n + 7 grows like n².</p>
<div class="def"><b>Asymptotic notations</b> are mathematical notations used to describe the limiting behaviour (rate of growth) of the running time of an algorithm for large n. They are defined as <i>sets of functions</i>; f(n) = O(g(n)) really means f(n) ∈ O(g(n)).</div>

<h3>2. Big-O Notation (Upper bound)</h3>
<div class="def"><b>O(g(n))</b> = { f(n) : there exist positive constants c and n₀ such that <b>0 ≤ f(n) ≤ c·g(n)</b> for all n ≥ n₀ }.<br>g(n) is an <b>asymptotic upper bound</b> for f(n): f grows no faster than g.</div>
<pre class="tree">  time│              c·g(n)
      │            ／
      │          ／   ___ f(n)
      │        ／ ___/
      │      ／__/
      │   __/／
      │__/ ／
      └────┼──────────────── n
           n₀   (for n ≥ n₀, f(n) stays BELOW c·g(n))</pre>
<p><b>Example:</b> f(n) = 6n + 3. 6n + 3 ≤ 6n + 3n = 9n for n ≥ 1 ⇒ c = 9, n₀ = 1 ⇒ f(n) = O(n).</p>

<h3>3. Big-Omega Notation Ω (Lower bound)</h3>
<div class="def"><b>Ω(g(n))</b> = { f(n) : there exist positive constants c and n₀ such that <b>0 ≤ c·g(n) ≤ f(n)</b> for all n ≥ n₀ }.<br>g(n) is an <b>asymptotic lower bound</b>: f grows at least as fast as g.</div>
<pre class="tree">  time│                 ___ f(n)
      │             ___/
      │         ___/     ／ c·g(n)
      │     ___/      ／
      │ ___/       ／
      │/        ／
      └────┼──────────────── n
           n₀   (for n ≥ n₀, f(n) stays ABOVE c·g(n))</pre>
<p><b>Example:</b> 3n² + 5n ≥ 3n² for all n ≥ 1 ⇒ c = 3, n₀ = 1 ⇒ 3n² + 5n = Ω(n²).</p>

<h3>4. Theta Notation Θ (Tight bound)</h3>
<div class="def"><b>Θ(g(n))</b> = { f(n) : there exist positive constants c₁, c₂ and n₀ such that <b>0 ≤ c₁·g(n) ≤ f(n) ≤ c₂·g(n)</b> for all n ≥ n₀ }.<br>g(n) is an <b>asymptotically tight bound</b>: f grows at the same rate as g.</div>
<pre class="tree">  time│              ／ c₂·g(n)
      │           ／  ___ f(n)
      │        ／ ___/   ／ c₁·g(n)
      │     ／___/    ／
      │   _／/     ／
      │  /    ／
      └────┼──────────────── n
           n₀   (f(n) sandwiched between c₁g(n) and c₂g(n))</pre>
<p><b>Theorem:</b> f(n) = Θ(g(n)) ⇔ f(n) = O(g(n)) and f(n) = Ω(g(n)).</p>
<p><b>Example:</b> 3n² + 5n + 7: lower 3n² ≤ T(n); upper 5n ≤ 5n², 7 ≤ 7n² for n ≥ 1 ⇒ T(n) ≤ 15n². So c₁ = 3, c₂ = 15, n₀ = 1 ⇒ Θ(n²).</p>

<h3>5. Little-o Notation (strict upper bound)</h3>
<div class="def"><b>o(g(n))</b> = { f(n) : for <b>every</b> positive constant c &gt; 0 there exists n₀ &gt; 0 such that <b>0 ≤ f(n) &lt; c·g(n)</b> for all n ≥ n₀ }.<br>Equivalently <b>lim<sub>n→∞</sub> f(n)/g(n) = 0</b>. f becomes insignificant relative to g; the upper bound is <b>not tight</b>.</div>
<p>Examples: 2n = o(n²) ✔; 2n² ≠ o(n²) ✘ (limit is 2, not 0); log n = o(n).</p>

<h3>6. Little-omega Notation ω (strict lower bound)</h3>
<div class="def"><b>ω(g(n))</b> = { f(n) : for <b>every</b> positive constant c &gt; 0 there exists n₀ &gt; 0 such that <b>0 ≤ c·g(n) &lt; f(n)</b> for all n ≥ n₀ }.<br>Equivalently <b>lim<sub>n→∞</sub> f(n)/g(n) = ∞</b>. f becomes arbitrarily large relative to g; the lower bound is <b>not tight</b>.</div>
<p>Examples: n²/2 = ω(n) ✔; n²/2 ≠ ω(n²) ✘; 5n² = ω(n) ✔ (slide).</p>
<div class="note"><b>Big vs little:</b> In O/Ω the inequality must hold for <i>some</i> c; in o/ω it must hold for <i>every</i> c. o ⊂ O and ω ⊂ Ω. A function cannot be both O(g) and ω(g), nor both Θ(g) and o(g).</div>

<h3>7. Summary Table</h3>
<table class="t"><tr><th>Notation</th><th>Bound</th><th>Condition</th><th>Limit f/g</th><th>Analogy</th></tr>
<tr><td>f = O(g)</td><td>Upper (may be tight)</td><td>f ≤ c·g, some c</td><td>&lt; ∞</td><td>a ≤ b</td></tr>
<tr><td>f = Ω(g)</td><td>Lower (may be tight)</td><td>f ≥ c·g, some c</td><td>&gt; 0</td><td>a ≥ b</td></tr>
<tr><td>f = Θ(g)</td><td>Tight</td><td>c₁g ≤ f ≤ c₂g</td><td>0 &lt; c &lt; ∞</td><td>a = b</td></tr>
<tr><td>f = o(g)</td><td>Strict upper</td><td>f &lt; c·g, every c</td><td>= 0</td><td>a &lt; b</td></tr>
<tr><td>f = ω(g)</td><td>Strict lower</td><td>f &gt; c·g, every c</td><td>= ∞</td><td>a &gt; b</td></tr></table>

<h3>8. Limit Rule (quick test)</h3>
<p>Let L = lim<sub>n→∞</sub> f(n)/g(n):</p>
<ul>
<li>L = 0 ⇒ f = o(g) (hence also O(g)).</li>
<li>0 &lt; L &lt; ∞ ⇒ f = Θ(g).</li>
<li>L = ∞ ⇒ f = ω(g) (hence also Ω(g)).</li>
</ul>
<p>Use L'Hôpital's rule when both tend to ∞: e.g., lim (log n)/n = lim (1/(n ln 2))/1 = 0 ⇒ log n = o(n).</p>

<h3>9. Properties</h3>
<table class="t"><tr><th>Property</th><th>Statement</th><th>Holds for</th></tr>
<tr><td>Transitivity</td><td>f = X(g) and g = X(h) ⇒ f = X(h)</td><td>O, Ω, Θ, o, ω</td></tr>
<tr><td>Reflexivity</td><td>f = X(f)</td><td>O, Ω, Θ (NOT o, ω)</td></tr>
<tr><td>Symmetry</td><td>f = Θ(g) ⇔ g = Θ(f)</td><td>Θ only</td></tr>
<tr><td>Transpose symmetry</td><td>f = O(g) ⇔ g = Ω(f); f = o(g) ⇔ g = ω(f)</td><td>O/Ω, o/ω</td></tr>
<tr><td>Max rule</td><td>O(f + g) = O(max(f, g))</td><td>sum of terms</td></tr>
<tr><td>Additive / multiplicative</td><td>e = O(g), f = O(h) ⇒ e + f = O(g + h), e·f = O(g·h)</td><td></td></tr>
<tr><td>Dichotomy</td><td>f = O(g) and g = O(f) ⇒ f = Θ(g)</td><td></td></tr>
<tr><td>Constants</td><td>c·f(n) = Θ(f(n)) for any constant c &gt; 0</td><td></td></tr>
<tr><td>Polynomial</td><td>a<sub>k</sub>n<sup>k</sup> + … + a₀ = Θ(n<sup>k</sup>), a<sub>k</sub> &gt; 0</td><td></td></tr></table>
<p><b>Simple rule:</b> drop lower-order terms and constant factors: 7n − 3 = O(n); 8n² log n + 5n² + n = O(n² log n). Make the bound as tight as possible (7n − 3 is O(n³) but O(n) is better).</p>

<h3>10. Order of Growth (memorise)</h3>
<div class="ans">1 &lt; log log n &lt; log n &lt; (log n)² &lt; √n &lt; n &lt; n log n &lt; n² &lt; n² log n &lt; n³ &lt; 2ⁿ &lt; 3ⁿ &lt; n! &lt; nⁿ</div>
<table class="t"><tr><th>n</th><th>log₂n</th><th>n log₂n</th><th>n²</th><th>n³</th><th>2ⁿ</th></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td><td>1</td><td>2</td></tr>
<tr><td>2</td><td>1</td><td>2</td><td>4</td><td>8</td><td>4</td></tr>
<tr><td>4</td><td>2</td><td>8</td><td>16</td><td>64</td><td>16</td></tr>
<tr><td>8</td><td>3</td><td>24</td><td>64</td><td>512</td><td>256</td></tr>
<tr><td>16</td><td>4</td><td>64</td><td>256</td><td>4096</td><td>65536</td></tr>
<tr><td>32</td><td>5</td><td>160</td><td>1024</td><td>32768</td><td>4294967296</td></tr></table>
<p>Useful identities: 2<sup>log₂ n</sup> = n; a<sup>log b</sup> = b<sup>log a</sup>; log(n!) = Θ(n log n); log<sub>a</sub>n = Θ(log<sub>b</sub>n) (base doesn't matter); log nᵏ = k log n.</p>

<h3>11. How to Prove (template)</h3>
<ol>
<li>Write the definition with f(n) and g(n).</li>
<li>Bound each lower-order term by the dominant term (e.g., 4n ≤ 4n² for n ≥ 1) or find where an inequality starts to hold.</li>
<li>State c (or c₁, c₂) and n₀ explicitly.</li>
<li>For "≠" proofs: assume it holds, derive n ≤ constant — contradiction since n can be arbitrarily large.</li>
</ol>

<h3>12. Big-O Does Not Tell the Whole Story (slides)</h3>
<p>T<sub>A</sub>(n) = 50 + 33n and T<sub>B</sub>(n) = 200 + 18n are both O(n). 50 + 33n = 200 + 18n ⇒ n = 10. A is better for n &lt; 10; B is better for n &gt; 10. Constants matter for small n.</p>
<div class="note"><b>Misconception:</b> Worst case ≠ Big-O and best case ≠ Big-Ω. Cases describe which <i>input</i>; notations describe <i>bounds on a function</i>. You can give O, Ω, Θ for the worst-case function itself (e.g., worst case of insertion sort is Θ(n²)).</div>

<div class="tip"><b>Exam tips / common mistakes:</b>
<ul>
<li>Always write the full set definition with "∃ positive constants c, n₀ … ∀ n ≥ n₀".</li>
<li>For Θ you need TWO constants c₁, c₂ — show both inequalities.</li>
<li>For little-o / ω the statement is "for EVERY c &gt; 0 there is an n₀" — use limits to prove.</li>
<li>Remember 2<sup>n+1</sup> = O(2ⁿ) (c = 2) but 2<sup>2n</sup> ≠ O(2ⁿ) (ratio 2ⁿ → ∞).</li>
<li>Reflexivity fails for o and ω: f ≠ o(f).</li>
</ul></div>

DAA.topics.push({
  id: 'amort',
  unit: 1,
  title: 'Amortized Analysis',
  lectures: 'L9',
  weight: 'Medium',
  summary: 'Average cost per operation over a worst-case sequence: aggregate, accounting and potential methods (stack MULTIPOP, binary counter, dynamic table).',
  notes: `
<h3>1. What is Amortized Analysis?</h3>
<div class="def"><b>Amortized analysis</b> is a technique for finding the average cost of each operation in a <b>sequence of n operations</b>, in the <b>worst case</b>. It shows that even though a single operation may be expensive, the total cost of the sequence (and hence the average per operation) is small. <b>No probability is involved.</b></div>
<p>Amortized cost per operation = (worst-case total cost of n operations) / n.</p>
<p><b>Why needed?</b> A naive worst-case analysis multiplies the worst cost of one operation by n, which is often far too pessimistic. E.g., one MULTIPOP can cost O(n), so a naive bound for n stack operations is O(n²), but the true total is O(n).</p>

<h4>Amortized vs Average-case analysis</h4>
<table class="t"><tr><th>Amortized analysis</th><th>Average-case analysis</th></tr>
<tr><td>Averages over a <b>sequence</b> of operations</td><td>Averages over all possible <b>inputs</b></td></tr>
<tr><td>Guaranteed worst-case bound for the whole sequence</td><td>Expected value; a bad input can still be slow</td></tr>
<tr><td>No probability / no assumptions about input distribution</td><td>Requires a probability distribution of inputs</td></tr>
<tr><td>Ex: dynamic array insert = O(1) amortized</td><td>Ex: quick sort = O(n log n) average</td></tr></table>

<h3>2. Three Methods</h3>
<table class="t"><tr><th>Method</th><th>Idea</th></tr>
<tr><td><b>Aggregate method</b></td><td>Find the total worst-case cost T(n) of n operations; amortized cost of each = T(n)/n (same for all operation types).</td></tr>
<tr><td><b>Accounting (banker's) method</b></td><td>Assign each operation an <b>amortized charge</b> ĉ<sub>i</sub>. If ĉ<sub>i</sub> &gt; actual cost c<sub>i</sub>, the extra is stored as <b>credit</b> on specific objects; credit pays for later expensive operations. Credit must never be negative: Σĉ<sub>i</sub> ≥ Σc<sub>i</sub>.</td></tr>
<tr><td><b>Potential (physicist's) method</b></td><td>Define a potential function Φ(D<sub>i</sub>) on the whole data structure, Φ(D₀) = 0, Φ(D<sub>i</sub>) ≥ 0. Amortized cost ĉ<sub>i</sub> = c<sub>i</sub> + Φ(D<sub>i</sub>) − Φ(D<sub>i−1</sub>). Then Σĉ<sub>i</sub> = Σc<sub>i</sub> + Φ(D<sub>n</sub>) − Φ(D₀) ≥ Σc<sub>i</sub>.</td></tr></table>
<div class="note">Accounting stores credit on <i>individual objects</i>; potential stores "energy" in the <i>whole structure</i>.</div>

<h3>3. Example 1 – Stack with MULTIPOP</h3>
<p>Operations: PUSH(S, x) cost 1; POP(S) cost 1; MULTIPOP(S, k) pops min(s, k) objects, cost min(s, k).</p>
<pre class="code">MULTIPOP(S, k)
    while not STACK-EMPTY(S) and k &gt; 0
        POP(S)
        k = k - 1</pre>
<ul>
<li><b>Naive:</b> one MULTIPOP can cost O(n) ⇒ n operations O(n²) — not tight.</li>
<li><b>Aggregate:</b> each object can be popped at most once for each time it is pushed. Number of pops (including inside MULTIPOP) ≤ number of pushes ≤ n. Total ≤ 2n = O(n) ⇒ <b>amortized O(1)</b> per operation.</li>
<li><b>Accounting:</b> charge PUSH = 2, POP = 0, MULTIPOP = 0. PUSH pays 1 for itself and stores 1 credit on the pushed plate; that credit pays for its later pop. Credit = number of items on stack ≥ 0. Total ≤ 2n.</li>
<li><b>Potential:</b> Φ = number of objects on stack (≥ 0, Φ₀ = 0). PUSH: 1 + 1 = 2. POP: 1 − 1 = 0. MULTIPOP(k'): k' − k' = 0. All O(1).</li>
</ul>

<h3>4. Example 2 – Incrementing a k-bit Binary Counter</h3>
<pre class="code">INCREMENT(A)
    i = 0
    while i &lt; k and A[i] == 1
        A[i] = 0          // reset 1 → 0
        i = i + 1
    if i &lt; k
        A[i] = 1          // set 0 → 1</pre>
<p>Cost = number of bits flipped. Worst single increment flips k bits (e.g., 0111 → 1000), so naive bound is O(nk).</p>
<p><b>Aggregate:</b> A[0] flips every time (n times), A[1] every 2nd time (⌊n/2⌋), A[2] every 4th time (⌊n/4⌋), … A[i] flips ⌊n/2<sup>i</sup>⌋ times.</p>
<div class="ans">Total flips = Σ ⌊n/2<sup>i</sup>⌋ &lt; n Σ 1/2<sup>i</sup> = 2n ⇒ O(n) total ⇒ amortized O(1) per increment</div>
<table class="t"><tr><th>Count</th><th>A[3..0]</th><th>Flips</th><th>Total cost</th></tr>
<tr><td>0</td><td>0000</td><td>–</td><td>0</td></tr>
<tr><td>1</td><td>0001</td><td>1</td><td>1</td></tr>
<tr><td>2</td><td>0010</td><td>2</td><td>3</td></tr>
<tr><td>3</td><td>0011</td><td>1</td><td>4</td></tr>
<tr><td>4</td><td>0100</td><td>3</td><td>7</td></tr>
<tr><td>5</td><td>0101</td><td>1</td><td>8</td></tr>
<tr><td>6</td><td>0110</td><td>2</td><td>10</td></tr>
<tr><td>7</td><td>0111</td><td>1</td><td>11</td></tr>
<tr><td>8</td><td>1000</td><td>4</td><td>15</td></tr></table>
<p>For n = 8: 8 + 4 + 2 + 1 = 15 &lt; 16 = 2n ✔.</p>
<p><b>Accounting:</b> charge 2 to set a bit 0 → 1 (1 pays for setting, 1 stored on that bit to pay for resetting it later). Resets cost 0 amortized. Each increment sets at most one bit ⇒ amortized cost ≤ 2.</p>
<p><b>Potential:</b> Φ = b<sub>i</sub> = number of 1s in counter. If increment i resets t<sub>i</sub> bits: c<sub>i</sub> ≤ t<sub>i</sub> + 1, ΔΦ ≤ 1 − t<sub>i</sub> ⇒ ĉ<sub>i</sub> ≤ (t<sub>i</sub> + 1) + (1 − t<sub>i</sub>) = 2.</p>

<h3>5. Example 3 – Dynamic Table (Table Doubling)</h3>
<p>Insert into an array; when full, allocate a new table of <b>double</b> size, copy all items, then insert. Starting from size 0 → 1 → 2 → 4 → 8 …</p>
<p>Cost of i-th insertion: c<sub>i</sub> = i if (i − 1) is an exact power of 2 (expansion: copy i − 1 items + insert 1); otherwise c<sub>i</sub> = 1.</p>
<table class="t"><tr><th>i</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th></tr>
<tr><td>size<sub>i</sub></td><td>1</td><td>2</td><td>4</td><td>4</td><td>8</td><td>8</td><td>8</td><td>8</td><td>16</td><td>16</td></tr>
<tr><td>c<sub>i</sub></td><td>1</td><td>2</td><td>3</td><td>1</td><td>5</td><td>1</td><td>1</td><td>1</td><td>9</td><td>1</td></tr></table>
<p><b>Aggregate:</b> Σc<sub>i</sub> ≤ n + Σ<sub>j=0</sub><sup>⌊log n⌋</sup> 2<sup>j</sup> &lt; n + 2n = 3n ⇒ <b>amortized cost 3</b> per insertion.</p>
<p><b>Accounting:</b> charge 3 per insert: 1 to insert itself, 1 stored to move itself at next expansion, 1 stored to move an older item that has already used its credit.</p>
<p><b>Potential:</b> Φ(T) = 2·num[T] − size[T]. Just after expansion num = size/2 ⇒ Φ = 0; just before, num = size ⇒ Φ = num.</p>
<ul><li>No expansion: ĉ = 1 + 2 = 3.</li><li>Expansion (num<sub>i−1</sub> = size<sub>i−1</sub> = k): c = k + 1, Φ<sub>i−1</sub> = k, Φ<sub>i</sub> = 2(k+1) − 2k = 2 ⇒ ĉ = (k + 1) + 2 − k = 3.</li></ul>

<h3>6. Applications</h3>
<ul><li>Dynamic arrays (C++ vector, Java ArrayList, Python list) – O(1) amortized append.</li><li>Hash tables with rehashing.</li><li>Splay trees, Fibonacci heaps, disjoint-set union–find.</li><li>Stacks/queues implemented with two stacks.</li></ul>

<div class="tip"><b>Exam tips / common mistakes:</b>
<ul>
<li>Never say amortized analysis uses probability — that is average-case analysis.</li>
<li>In accounting, show the credit never becomes negative (make a balance table).</li>
<li>In potential method, check Φ(D₀) = 0 and Φ(D<sub>i</sub>) ≥ 0.</li>
<li>Binary counter: total flips &lt; 2n; dynamic table: total &lt; 3n; stack: total ≤ 2n.</li>
<li>Count bit flips column-wise (bit i flips ⌊n/2<sup>i</sup>⌋ times) — fastest way in numericals.</li>
</ul></div>

    { type: 'theory', marks: 10, q: 'What is amortized analysis? Explain the aggregate, accounting and potential methods using the binary counter example. Compare the three methods.', s: `<div class="def"><b>Amortized analysis</b> bounds the average cost per operation over a worst-case sequence of n operations; it uses no probability.</div>
<h4>Binary counter</h4>
<pre class="code">INCREMENT(A)
  i = 0
  while i &lt; k and A[i] = 1
      A[i] = 0; i = i + 1
  if i &lt; k then A[i] = 1</pre>
<p>Naive: one increment may flip k bits ⇒ O(nk).</p>
<h4>1. Aggregate method</h4>
<p>A[i] flips ⌊n/2<sup>i</sup>⌋ times ⇒ total = Σ ⌊n/2<sup>i</sup>⌋ &lt; 2n ⇒ amortized 2n/n = O(1). (n = 8: 8+4+2+1 = 15.)</p>
<h4>2. Accounting method</h4>
<p>Charge 2 to set a bit 0→1: 1 pays the flip, 1 stays on that bit as credit. Resetting a bit 1→0 is paid by its credit (charge 0). Each increment sets at most one bit ⇒ ĉ ≤ 2. Credit = number of 1s ≥ 0.</p>
<h4>3. Potential method</h4>
<p>Φ = number of 1s; if t<sub>i</sub> bits reset: c<sub>i</sub> = t<sub>i</sub> + 1, ΔΦ = 1 − t<sub>i</sub> ⇒ ĉ<sub>i</sub> = 2.</p>
<h4>Comparison</h4>
<table class="t"><tr><th></th><th>Aggregate</th><th>Accounting</th><th>Potential</th></tr>
<tr><td>Idea</td><td>Total / n</td><td>Credits on objects</td><td>Potential of whole structure</td></tr>
<tr><td>Different costs per op type?</td><td>No (same for all)</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Requirement</td><td>Bound total</td><td>Credit ≥ 0</td><td>Φ₀ = 0, Φ ≥ 0</td></tr>
<tr><td>Counter result</td><td>&lt; 2n total</td><td>2 per increment</td><td>2 per increment</td></tr></table>
<div class="ans">All three methods give O(1) amortized cost per INCREMENT; O(n) for n increments.</div>` },
    { type: 'theory', marks: 10, q: 'Explain dynamic tables (table expansion by doubling) and prove that the amortized cost of insertion is O(1) using all three methods.', s: `<p>A <b>dynamic table</b> grows when full: allocate a table twice as large, copy all existing items, then insert. Load factor stays ≥ 1/2.</p>
<pre class="code">TABLE-INSERT(T, x)
  if T.size = 0
      allocate T.table with 1 slot; T.size = 1
  if T.num = T.size                 // full
      allocate new-table with 2·T.size slots
      copy all items of T.table into new-table
      free T.table; T.table = new-table; T.size = 2·T.size
  insert x into T.table
  T.num = T.num + 1</pre>
<h4>1. Aggregate</h4>
<p>c<sub>i</sub> = i if i − 1 is a power of 2, else 1. Σc<sub>i</sub> ≤ n + Σ<sub>j=0</sub><sup>⌊lg n⌋</sup> 2<sup>j</sup> &lt; n + 2n = 3n ⇒ amortized 3.</p>
<p>Example n = 9: 1,2,3,1,5,1,1,1,9 ⇒ 24 &lt; 27.</p>
<h4>2. Accounting</h4>
<p>Charge 3 per insert: 1 to insert, 1 to move itself later, 1 to move an item already moved once. After expansion to size 2m, the m new items each carry 2 credits — exactly enough to copy all 2m items at the next expansion. Credit never negative.</p>
<h4>3. Potential</h4>
<p>Φ = 2·num − size (0 right after expansion, num just before).</p>
<ul><li>No expansion: ĉ = 1 + [2(num+1) − size] − [2num − size] = 3.</li>
<li>Expansion with num = size = k: ĉ = (k + 1) + [2(k+1) − 2k] − [2k − k] = k + 1 + 2 − k = 3.</li></ul>
<div class="ans">Amortized cost of TABLE-INSERT = 3 = O(1); n insertions cost O(n) in total.</div>` },
    { type: 'theory', marks: 5, q: 'Explain the aggregate method using stack operations PUSH, POP and MULTIPOP.', s: `<div class="def"><b>Aggregate method:</b> find an upper bound T(n) on the total cost of any sequence of n operations; then each operation's amortized cost is T(n)/n.</div>
<div class="step"><b>Operations:</b> PUSH O(1), POP O(1), MULTIPOP(S, k) O(min(s, k)).</div>
<div class="step"><b>Naive bound:</b> stack can hold n items, so MULTIPOP is O(n); n operations ⇒ O(n²) — loose.</div>
<div class="step"><b>Tight bound:</b> an object can be popped (by POP or within MULTIPOP) at most once for each time it is pushed. So total number of pops ≤ total pushes ≤ n.</div>
<div class="step">Total cost ≤ (pushes) + (pops) ≤ n + n = 2n = O(n).</div>
<div class="ans">Amortized cost per operation = O(n)/n = O(1)</div>` },

 "title": "Recurrences & Master Method",

 "weight": "High",
 "summary": "Writing recurrences for recursive algorithms and solving them by substitution, recursion tree and the Master theorem.",
 "notes": "\n<h3>1. What is a recurrence?</h3>\n<div class=\"def\"><b>Definition:</b> A <b>recurrence relation</b> is an equation (or inequality) that describes a function in terms of its value on smaller inputs. When an algorithm calls itself, its running time T(n) can usually be written as a recurrence.</div>\n<p>Every recurrence has two parts:</p>\n<ul>\n<li><b>Base case (initial condition)</b> – the value for the smallest input, e.g. T(1) = 1.</li>\n<li><b>Recursive case</b> – how T(n) depends on smaller values, e.g. T(n) = 2T(n/2) + n.</li>\n</ul>\n<h4>Common types</h4>\n<table class=\"t\">\n<tr><th>Type</th><th>General form</th><th>Example</th></tr>\n<tr><td>Linear (subtract-and-conquer)</td><td>T(n) = T(n−1) + f(n)</td><td>Factorial, linear search (recursive)</td></tr>\n<tr><td>Divide-and-conquer</td><td>T(n) = aT(n/b) + f(n)</td><td>Binary search, merge sort</td></tr>\n<tr><td>Multiple-term</td><td>T(n) = T(n−1) + T(n−2) + c</td><td>Fibonacci</td></tr>\n</table>\n\n<h3>2. Forming recurrences from algorithms</h3>\n<table class=\"t\">\n<tr><th>Algorithm</th><th>Recurrence</th><th>Solution</th></tr>\n<tr><td>Factorial fact(n) = n·fact(n−1)</td><td>T(n) = T(n−1) + c, T(0) = c</td><td>Θ(n)</td></tr>\n<tr><td>Fibonacci fib(n) = fib(n−1)+fib(n−2)</td><td>T(n) = T(n−1) + T(n−2) + c</td><td>O(2ⁿ) (tight Θ(φⁿ), φ ≈ 1.618)</td></tr>\n<tr><td>Binary search</td><td>T(n) = T(n/2) + c</td><td>Θ(log n)</td></tr>\n<tr><td>Merge sort</td><td>T(n) = 2T(n/2) + cn</td><td>Θ(n log n)</td></tr>\n<tr><td>Quick sort (worst)</td><td>T(n) = T(n−1) + cn</td><td>Θ(n²)</td></tr>\n<tr><td>Tower of Hanoi</td><td>T(n) = 2T(n−1) + 1, T(1) = 1</td><td>2ⁿ − 1 moves = Θ(2ⁿ)</td></tr>\n<tr><td>Strassen</td><td>T(n) = 7T(n/2) + cn²</td><td>Θ(n<sup>2.81</sup>)</td></tr>\n</table>\n<pre class=\"code\">FACT(n)\n  IF n = 0 THEN RETURN 1          // 1 comparison  -> c\n  RETURN n * FACT(n − 1)          // 1 multiplication + T(n−1)\n=&gt; T(n) = T(n − 1) + c ,  T(0) = c</pre>\n<pre class=\"code\">HANOI(n, A, B, C)                // move n disks from A to C using B\n  IF n = 1 THEN move disk A → C; RETURN\n  HANOI(n − 1, A, C, B)\n  move disk A → C\n  HANOI(n − 1, B, A, C)\n=&gt; T(n) = 2T(n − 1) + 1 ,  T(1) = 1</pre>\n\n<h3>3. Methods of solving recurrences</h3>\n<ol>\n<li><b>Substitution method</b> (a) <i>iteration / back-substitution</i>: keep expanding until the base case appears; (b) <i>guess and prove by induction</i>.</li>\n<li><b>Recursion tree method</b>: draw the tree of recursive calls, find the cost of each level, the height, and add all levels.</li>\n<li><b>Master method</b>: a ready-made formula for T(n) = aT(n/b) + f(n).</li>\n</ol>\n\n<h3>4. Substitution (iteration) method – worked examples</h3>\n<h4>Example 1: T(n) = T(n−1) + n, T(1) = 1</h4>\n<div class=\"step\">T(n) = T(n−1) + n = T(n−2) + (n−1) + n = T(n−3) + (n−2) + (n−1) + n</div>\n<div class=\"step\">After k steps: T(n) = T(n−k) + (n−k+1) + … + (n−1) + n</div>\n<div class=\"step\">Put n − k = 1 ⇒ k = n − 1: T(n) = T(1) + 2 + 3 + … + n = 1 + 2 + … + n = n(n+1)/2</div>\n<div class=\"ans\">T(n) = n(n+1)/2 = Θ(n²)</div>\n<h4>Example 2: T(n) = 2T(n−1) + 1, T(1) = 1 (Tower of Hanoi)</h4>\n<div class=\"step\">T(n) = 2[2T(n−2) + 1] + 1 = 2²T(n−2) + 2 + 1 = 2³T(n−3) + 2² + 2 + 1</div>\n<div class=\"step\">After k steps: T(n) = 2ᵏT(n−k) + 2ᵏ⁻¹ + … + 2 + 1</div>\n<div class=\"step\">Put k = n − 1: T(n) = 2ⁿ⁻¹·1 + (2ⁿ⁻¹ − 1) = 2ⁿ − 1</div>\n<div class=\"ans\">T(n) = 2ⁿ − 1 = Θ(2ⁿ)</div>\n<h4>Example 3: T(n) = T(n/2) + 1, T(1) = 1 (Binary search)</h4>\n<div class=\"step\">T(n) = T(n/2) + 1 = T(n/4) + 2 = T(n/8) + 3 = … = T(n/2ᵏ) + k</div>\n<div class=\"step\">Put n/2ᵏ = 1 ⇒ k = log₂n: T(n) = T(1) + log₂n = 1 + log₂n</div>\n<div class=\"ans\">T(n) = log₂n + 1 = Θ(log n)</div>\n<h4>Example 4: T(n) = 2T(n/2) + n, T(1) = 1 (Merge sort)</h4>\n<div class=\"step\">T(n) = 2[2T(n/4) + n/2] + n = 4T(n/4) + 2n = 8T(n/8) + 3n = … = 2ᵏT(n/2ᵏ) + kn</div>\n<div class=\"step\">Put 2ᵏ = n ⇒ k = log₂n: T(n) = n·T(1) + n log₂n = n log₂n + n</div>\n<div class=\"ans\">T(n) = n log₂n + n = Θ(n log n)</div>\n\n<h3>5. Recursion tree method</h3>\n<p>Steps: (1) draw root with cost f(n); (2) draw children with their sub-costs; (3) find cost per level; (4) find height (when subproblem size reaches 1); (5) count leaves × T(1); (6) add all levels.</p>\n<h4>Example: T(n) = 2T(n/2) + n</h4>\n<pre class=\"tree\">Level 0:               n                         cost = n\n                    /     Level 1:         n/2       n/2                    cost = n\n                /        /   Level 2:     n/4   n/4  n/4   n/4                 cost = n\n              ...   ...  ...   ...\nLevel k:   T(1) T(1) ...... T(1)   (n leaves)     cost = n\nHeight = log₂n  ⇒ total = n · (log₂n + 1) = Θ(n log n)</pre>\n<h4>Example: T(n) = 3T(n/4) + cn²</h4>\n<pre class=\"tree\">Level 0:              cn²                               cost = cn²\n                   /   |   Level 1:   c(n/4)²  c(n/4)²  c(n/4)²                     cost = (3/16)cn²\nLevel 2:   9 nodes of c(n/16)²                           cost = (3/16)²cn²\n  ...\nLevel i:   3ⁱ nodes of c(n/4ⁱ)²                          cost = (3/16)ⁱcn²\nLeaves:    3^(log₄n) = n^(log₄3) ≈ n^0.79 leaves        cost = Θ(n^0.79)</pre>\n<p>Total ≤ cn² (1 + 3/16 + (3/16)² + …) + Θ(n<sup>0.79</sup>) = cn² · 1/(1 − 3/16) + Θ(n<sup>0.79</sup>) = (16/13)cn² + Θ(n<sup>0.79</sup>)</p>\n<div class=\"ans\">T(n) = Θ(n²) (root dominates – decreasing geometric series)</div>\n<h4>Example: T(n) = T(n/3) + T(2n/3) + cn (unbalanced tree)</h4>\n<pre class=\"tree\">                 cn                                 cost = cn\n              /                 c(n/3)     c(2n/3)                          cost = cn\n          /          /         c(n/9) c(2n/9) c(2n/9) c(4n/9)                   cost = cn\n  ...\nShortest path (always n/3):  log₃n levels\nLongest path (always 2n/3): log_{3/2}n levels</pre>\n<p>Every full level costs cn, and there are at most log<sub>3/2</sub>n levels ⇒ T(n) = O(n log n). At least log₃n full levels ⇒ T(n) = Ω(n log n).</p>\n<div class=\"ans\">T(n) = Θ(n log n)</div>\n\n<h3>6. Master Theorem (as in lecture)</h3>\n<div class=\"def\"><b>Master Theorem:</b> Let T(n) = aT(n/b) + f(n), where a ≥ 1, b &gt; 1 are constants and f(n) is asymptotically positive. Compare f(n) with n<sup>log<sub>b</sub>a</sup> (the \"watershed\" function = number of leaves):\n<ul>\n<li><b>Case 1:</b> if f(n) = O(n<sup>log<sub>b</sub>a − ε</sup>) for some ε &gt; 0 ⇒ <b>T(n) = Θ(n<sup>log<sub>b</sub>a</sup>)</b> (leaves dominate)</li>\n<li><b>Case 2:</b> if f(n) = Θ(n<sup>log<sub>b</sub>a</sup> log<sup>k</sup>n), k ≥ 0 ⇒ <b>T(n) = Θ(n<sup>log<sub>b</sub>a</sup> log<sup>k+1</sup>n)</b> (all levels equal)</li>\n<li><b>Case 3:</b> if f(n) = Ω(n<sup>log<sub>b</sub>a + ε</sup>) for some ε &gt; 0 <b>and</b> regularity a·f(n/b) ≤ c·f(n) for some c &lt; 1 and large n ⇒ <b>T(n) = Θ(f(n))</b> (root dominates)</li>\n</ul></div>\n<p><b>Meaning of symbols:</b> a = number of subproblems, n/b = size of each subproblem, f(n) = cost of dividing + combining.</p>\n<h4>Short-cut form (when f(n) = Θ(nᵈ))</h4>\n<table class=\"t\">\n<tr><th>Condition</th><th>Result</th></tr>\n<tr><td>a &lt; bᵈ (i.e. d &gt; log<sub>b</sub>a)</td><td>Θ(nᵈ)</td></tr>\n<tr><td>a = bᵈ (i.e. d = log<sub>b</sub>a)</td><td>Θ(nᵈ log n)</td></tr>\n<tr><td>a &gt; bᵈ (i.e. d &lt; log<sub>b</sub>a)</td><td>Θ(n<sup>log<sub>b</sub>a</sup>)</td></tr>\n</table>\n<h4>Procedure to write in exam</h4>\n<ol>\n<li>Write the given recurrence and compare with T(n) = aT(n/b) + f(n); write a, b, f(n).</li>\n<li>Compute log<sub>b</sub>a and n<sup>log<sub>b</sub>a</sup>.</li>\n<li>Compare f(n) with n<sup>log<sub>b</sub>a</sup>, decide the case (state ε or k).</li>\n<li>For case 3, check the regularity condition.</li>\n<li>Write the answer in a box.</li>\n</ol>\n<h4>Solved examples</h4>\n<table class=\"t\">\n<tr><th>Recurrence</th><th>a, b, n<sup>log<sub>b</sub>a</sup></th><th>Case</th><th>T(n)</th></tr>\n<tr><td>T(n) = T(n/2) + 1</td><td>1, 2, n⁰ = 1</td><td>2 (k = 0)</td><td>Θ(log n)</td></tr>\n<tr><td>T(n) = 2T(n/2) + n</td><td>2, 2, n</td><td>2 (k = 0)</td><td>Θ(n log n)</td></tr>\n<tr><td>T(n) = 9T(n/3) + n</td><td>9, 3, n²</td><td>1 (ε = 1)</td><td>Θ(n²)</td></tr>\n<tr><td>T(n) = 9T(n/3) + n²</td><td>9, 3, n²</td><td>2 (k = 0)</td><td>Θ(n² log n)</td></tr>\n<tr><td>T(n) = 2T(n/2) + n³</td><td>2, 2, n</td><td>3 (ε = 2)</td><td>Θ(n³)</td></tr>\n<tr><td>T(n) = 2T(n/2) + n²</td><td>2, 2, n</td><td>3 (ε = 1)</td><td>Θ(n²)</td></tr>\n<tr><td>T(n) = 8T(n/2) + n²</td><td>8, 2, n³</td><td>1</td><td>Θ(n³)</td></tr>\n<tr><td>T(n) = 7T(n/2) + n²</td><td>7, 2, n<sup>2.807</sup></td><td>1</td><td>Θ(n<sup>log₂7</sup>) ≈ Θ(n<sup>2.81</sup>)</td></tr>\n<tr><td>T(n) = 3T(n/4) + n log n</td><td>3, 4, n<sup>0.793</sup></td><td>3</td><td>Θ(n log n)</td></tr>\n<tr><td>T(n) = 2T(n/2) + n log n</td><td>2, 2, n</td><td>2 (k = 1)</td><td>Θ(n log² n)</td></tr>\n<tr><td>T(n) = T(2n/3) + 1</td><td>1, 3/2, 1</td><td>2 (k = 0)</td><td>Θ(log n)</td></tr>\n<tr><td>T(n) = 2T(n/4) + √n</td><td>2, 4, n<sup>1/2</sup></td><td>2 (k = 0)</td><td>Θ(√n log n)</td></tr>\n</table>\n<h4>When the Master theorem does NOT apply</h4>\n<ul>\n<li><b>a is not a constant:</b> T(n) = 2ⁿT(n/2) + n.</li>\n<li><b>a &lt; 1:</b> T(n) = 0.5T(n/2) + n (fewer than one subproblem).</li>\n<li><b>f(n) not positive:</b> T(n) = 64T(n/8) − n² log n.</li>\n<li><b>Subtract form, not divide form:</b> T(n) = T(n−1) + n (use substitution instead).</li>\n<li><b>Gap between cases (non-polynomial difference):</b> T(n) = 2T(n/2) + n/log n. Here f(n) = n/log n is smaller than n but not by a polynomial factor nᵉ, and k = −1 &lt; 0, so none of the three cases fits. (Its answer by recursion tree is Θ(n log log n).)</li>\n<li><b>Case 3 but regularity fails:</b> e.g. T(n) = T(n/2) + n(2 − cos n).</li>\n</ul>\n\n<h3>7. Change of variable (bonus – often asked)</h3>\n<p>T(n) = 2T(√n) + log n. Let m = log₂n ⇒ n = 2ᵐ. Then T(2ᵐ) = 2T(2<sup>m/2</sup>) + m. Put S(m) = T(2ᵐ): S(m) = 2S(m/2) + m ⇒ S(m) = Θ(m log m) ⇒ <b>T(n) = Θ(log n · log log n)</b>.</p>\n\n<div class=\"tip\"><b>Exam tips / common mistakes:</b>\n<ul>\n<li>Always state a, b, f(n) and n<sup>log<sub>b</sub>a</sup> explicitly — marks are given for each step.</li>\n<li>In Case 3 never forget to verify the regularity condition a·f(n/b) ≤ c·f(n).</li>\n<li>\"Bigger\" must mean <b>polynomially</b> bigger (by a factor nᵉ). n log n vs n is NOT polynomially bigger — it is Case 2 with k = 1 in the extended form.</li>\n<li>log<sub>b</sub>a: log₂3 ≈ 1.585, log₂7 ≈ 2.807, log₄3 ≈ 0.793, log₃2 ≈ 0.631, log₄2 = 0.5.</li>\n<li>Master theorem cannot solve T(n) = T(n−1) + … recurrences — use substitution.</li>\n</ul></div>\n",

 "title": "Divide & Conquer: General Method",
 "lectures": "L12",
 "weight": "High",
 "summary": "Divide the problem, conquer subproblems recursively, combine the answers; analysed with T(n) = aT(n/b) + f(n).",
 "notes": "\n<h3>1. Definition</h3>\n<div class=\"def\"><b>Divide and Conquer (D&amp;C)</b> is an algorithm design paradigm in which a problem of size n is broken into a number of smaller subproblems of the same (or related) type, each subproblem is solved recursively, and the solutions of the subproblems are combined to obtain the solution of the original problem. Recursion stops at a <b>base case</b> small enough to be solved directly.</div>\n\n<h3>2. The three phases</h3>\n<table class=\"t\">\n<tr><th>Phase</th><th>What happens</th><th>Example (Merge sort)</th></tr>\n<tr><td><b>Divide</b></td><td>Split the problem into a subproblems, each of size about n/b</td><td>Split array into two halves</td></tr>\n<tr><td><b>Conquer</b></td><td>Solve each subproblem recursively; solve directly if small (base case)</td><td>Sort each half recursively</td></tr>\n<tr><td><b>Combine</b></td><td>Merge the sub-solutions into the final solution</td><td>Merge the two sorted halves</td></tr>\n</table>\n<pre class=\"tree\">                 Problem (size n)\n                 /       |                 DIVIDE\n       Sub-P1(n/b)  Sub-P2(n/b) … Sub-Pa(n/b)\n           |            |             |      CONQUER (recursively)\n         S1           S2     …       Sa\n                       |            /\n                 Solution of P               COMBINE</pre>\n\n<h3>3. Control abstraction (Horowitz–Sahni)</h3>\n<pre class=\"code\">Algorithm DAndC(P)\n{\n   IF Small(P) THEN RETURN S(P);          // base case: solve directly\n   ELSE\n   {\n      divide P into smaller instances P1, P2, …, Pk,  k ≥ 1;\n      apply DAndC to each of these subproblems;\n      RETURN Combine(DAndC(P1), DAndC(P2), …, DAndC(Pk));\n   }\n}</pre>\n<p><b>Small(P)</b> is a Boolean function that decides whether the input is small enough to compute the answer directly by function <b>S(P)</b> without splitting.</p>\n<h4>Lecture template</h4>\n<pre class=\"code\">DIVIDE_AND_CONQUER(P)\n  IF P is small enough\n      RETURN DirectSolution(P)\n  DIVIDE P into P1, P2, …, Pa\n  FOR each subproblem Pi\n      Si ← DIVIDE_AND_CONQUER(Pi)\n  RETURN COMBINE(S1, S2, …, Sa)</pre>\n\n<h3>4. Time complexity – general recurrence</h3>\n<div class=\"def\">T(n) = g(n) if n is small; T(n) = T(n₁) + T(n₂) + … + T(nₖ) + f(n) otherwise. When all subproblems are of equal size: <b>T(n) = aT(n/b) + f(n)</b>, where a = number of subproblems, n/b = size of each subproblem, f(n) = time to divide and combine.</div>\n<p>Solved with the Master theorem / substitution / recursion tree.</p>\n\n<h3>5. Worked example 1 – Maximum element (MaxDC)</h3>\n<pre class=\"code\">MaxDC(A, l, r)\n  IF l = r THEN RETURN A[l]\n  mid ← ⌊(l + r)/2⌋\n  x ← MaxDC(A, l, mid)\n  y ← MaxDC(A, mid + 1, r)\n  RETURN max(x, y)</pre>\n<p>Recurrence T(n) = 2T(n/2) + 1 ⇒ Case 1 of Master theorem ⇒ <b>Θ(n)</b>. Example: [7, 2, 9, 4, 6, 1] → left max 9, right max 6 → max = 9.</p>\n\n<h3>6. Worked example 2 – Finding Maximum AND Minimum (MaxMin)</h3>\n<p>Straightforward method: compare every element with max and min ⇒ 2(n − 1) comparisons.</p>\n<pre class=\"code\">Algorithm MaxMin(i, j, max, min)\n// A[i..j] ; returns largest in max and smallest in min\n{\n   IF (i = j) THEN max ← min ← A[i];                 // one element\n   ELSE IF (i = j − 1) THEN                           // two elements\n   {   IF (A[i] &lt; A[j]) THEN { max ← A[j]; min ← A[i]; }\n       ELSE                 { max ← A[i]; min ← A[j]; }\n   }\n   ELSE\n   {   mid ← ⌊(i + j)/2⌋;\n       MaxMin(i, mid, max, min);\n       MaxMin(mid + 1, j, max1, min1);\n       IF (max &lt; max1) THEN max ← max1;            // combine: 2 comparisons\n       IF (min &gt; min1) THEN min ← min1;\n   }\n}</pre>\n<p><b>Number of comparisons:</b> T(n) = 2T(n/2) + 2 for n &gt; 2, T(2) = 1, T(1) = 0.</p>\n<div class=\"step\">For n = 2ᵏ: T(n) = 2T(n/2) + 2 = 4T(n/4) + 4 + 2 = … = 2ᵏ⁻¹T(2) + (2ᵏ⁻¹ + … + 4 + 2) = n/2 + (n − 2)</div>\n<div class=\"ans\">T(n) = 3n/2 − 2 comparisons (vs 2n − 2 for straightforward method) – about 25% saving. Order still Θ(n).</div>\n<p>Example n = 8 ⇒ 3·8/2 − 2 = 10 comparisons (straightforward: 14).</p>\n\n<h3>7. Applications of Divide and Conquer</h3>\n<table class=\"t\">\n<tr><th>Application</th><th>Recurrence</th><th>Complexity</th></tr>\n<tr><td>Binary search</td><td>T(n) = T(n/2) + 1</td><td>Θ(log n)</td></tr>\n<tr><td>Merge sort</td><td>T(n) = 2T(n/2) + n</td><td>Θ(n log n)</td></tr>\n<tr><td>Quick sort</td><td>best 2T(n/2) + n; worst T(n−1) + n</td><td>Θ(n log n) / Θ(n²)</td></tr>\n<tr><td>Max–Min</td><td>T(n) = 2T(n/2) + 2</td><td>3n/2 − 2 comparisons</td></tr>\n<tr><td>Strassen’s matrix multiplication</td><td>T(n) = 7T(n/2) + n²</td><td>Θ(n<sup>2.81</sup>)</td></tr>\n<tr><td>Integer (Karatsuba) multiplication</td><td>T(n) = 3T(n/2) + n</td><td>Θ(n<sup>1.585</sup>)</td></tr>\n<tr><td>Closest pair of points, Tower of Hanoi, power aⁿ</td><td>—</td><td>—</td></tr>\n</table>\n\n<h3>8. Advantages and disadvantages</h3>\n<table class=\"t\">\n<tr><th>Advantages</th><th>Disadvantages</th></tr>\n<tr><td>Solves difficult problems by breaking them into easy ones</td><td>Recursion overhead (function calls, stack space)</td></tr>\n<tr><td>Often gives efficient algorithms (n² → n log n)</td><td>Not efficient when subproblems overlap (e.g. Fibonacci) – DP is better</td></tr>\n<tr><td>Subproblems are independent ⇒ naturally parallel</td><td>Poor division (unbalanced split) or costly combine reduces benefit</td></tr>\n<tr><td>Uses cache/memory efficiently (small subproblems fit in cache)</td><td>Simple iterative solution may be faster for small n</td></tr>\n</table>\n\n<h3>9. Comparison of design approaches</h3>\n<table class=\"t\">\n<tr><th>Aspect</th><th>Divide &amp; Conquer</th><th>Dynamic Programming</th><th>Greedy</th></tr>\n<tr><td>Idea</td><td>Split → solve recursively → combine</td><td>Solve overlapping subproblems once and store</td><td>Make locally best choice at each step</td></tr>\n<tr><td>Subproblems</td><td>Independent</td><td>Overlapping</td><td>Only one subproblem left after choice</td></tr>\n<tr><td>Approach</td><td>Top-down</td><td>Bottom-up (tabulation) / memoization</td><td>Top-down, no backtracking</td></tr>\n<tr><td>Reuse results</td><td>No</td><td>Yes</td><td>No</td></tr>\n<tr><td>Optimal?</td><td>Exact solution</td><td>Always optimal</td><td>Optimal only with greedy-choice property</td></tr>\n<tr><td>Example</td><td>Merge sort, binary search</td><td>0/1 knapsack, LCS</td><td>Fractional knapsack, Huffman</td></tr>\n</table>\n\n<div class=\"tip\"><b>Exam tips / common mistakes:</b>\n<ul>\n<li>Always write all three phases (Divide, Conquer, Combine) for any D&amp;C algorithm asked – e.g. binary search has <i>no real combine</i> step.</li>\n<li>Write the control abstraction DAndC(P) with Small(P) and S(P) for full marks in the \"general method\" question.</li>\n<li>Min–max: number of comparisons = 3n/2 − 2 (exact when n is a power of 2).</li>\n<li>Do not confuse D&amp;C with DP: D&amp;C subproblems are independent.</li>\n</ul></div>\n",

 "summary": "Search a sorted array by comparing with the middle element and discarding half each time: Θ(log n).",
 "notes": "\n<h3>1. Definition</h3>\n<div class=\"def\"><b>Binary Search</b> is a Divide and Conquer searching algorithm that finds the position of a key in a <b>sorted</b> array by repeatedly comparing the key with the middle element and discarding the half in which the key cannot lie.</div>\n<p><b>Precondition:</b> the array must be sorted and must allow random access (array, not linked list).</p>\n\n<h3>2. Binary search as Divide and Conquer</h3>\n<table class=\"t\">\n<tr><th>Phase</th><th>Binary search</th></tr>\n<tr><td>Divide</td><td>Compute mid = ⌊(low + high)/2⌋, splitting A[low..high] into two halves</td></tr>\n<tr><td>Conquer</td><td>Recursively search only ONE half: left if key &lt; A[mid], right if key &gt; A[mid]</td></tr>\n<tr><td>Combine</td><td>Nothing to combine – the recursive result is returned directly</td></tr>\n<tr><td>Base cases</td><td>key = A[mid] (found) or low &gt; high (not found, return −1)</td></tr>\n</table>\n\n<h3>3. Recursive algorithm</h3>\n<pre class=\"code\">BINARY_SEARCH(A, low, high, key)\n  IF low &gt; high\n      RETURN −1                                   // unsuccessful\n  mid ← ⌊(low + high)/2⌋\n  IF A[mid] = key\n      RETURN mid                                  // successful\n  ELSE IF key &lt; A[mid]\n      RETURN BINARY_SEARCH(A, low, mid − 1, key)  // left half\n  ELSE\n      RETURN BINARY_SEARCH(A, mid + 1, high, key) // right half</pre>\n\n<h3>4. Iterative algorithm</h3>\n<pre class=\"code\">BINSEARCH(A, n, key)\n  low ← 0 ; high ← n − 1\n  WHILE low ≤ high DO\n      mid ← ⌊(low + high)/2⌋\n      IF key = A[mid] THEN RETURN mid\n      ELSE IF key &lt; A[mid] THEN high ← mid − 1\n      ELSE low ← mid + 1\n  END WHILE\n  RETURN −1</pre>\n<div class=\"note\">To avoid integer overflow in programs, mid is often written as low + (high − low)/2.</div>\n\n<h3>5. Worked example (successful)</h3>\n<p>A = [3, 8, 12, 17, 23, 31, 38, 45, 52, 60, 71] (index 0–10), key = 52.</p>\n<table class=\"t\">\n<tr><th>Step</th><th>low</th><th>high</th><th>mid</th><th>A[mid]</th><th>Decision</th></tr>\n<tr><td>1</td><td>0</td><td>10</td><td>5</td><td>31</td><td>52 &gt; 31 → low = 6</td></tr>\n<tr><td>2</td><td>6</td><td>10</td><td>8</td><td>52</td><td>Found</td></tr>\n</table>\n<div class=\"ans\">Key 52 found at index 8 after 2 comparisons.</div>\n<h4>Worked example (unsuccessful)</h4>\n<p>Same array, key = 10.</p>\n<table class=\"t\">\n<tr><th>Step</th><th>low</th><th>high</th><th>mid</th><th>A[mid]</th><th>Decision</th></tr>\n<tr><td>1</td><td>0</td><td>10</td><td>5</td><td>31</td><td>10 &lt; 31 → high = 4</td></tr>\n<tr><td>2</td><td>0</td><td>4</td><td>2</td><td>12</td><td>10 &lt; 12 → high = 1</td></tr>\n<tr><td>3</td><td>0</td><td>1</td><td>0</td><td>3</td><td>10 &gt; 3 → low = 1</td></tr>\n<tr><td>4</td><td>1</td><td>1</td><td>1</td><td>8</td><td>10 &gt; 8 → low = 2</td></tr>\n<tr><td>5</td><td>2</td><td>1</td><td>—</td><td>—</td><td>low &gt; high → stop</td></tr>\n</table>\n<div class=\"ans\">Key 10 not found; return −1 after 4 comparisons.</div>\n\n<h3>6. Complexity analysis</h3>\n<p><b>Recurrence:</b> T(n) = T(n/2) + c, T(1) = c.</p>\n<p><b>Master theorem:</b> a = 1, b = 2, n<sup>log₂1</sup> = n⁰ = 1, f(n) = c = Θ(1) ⇒ Case 2 ⇒ T(n) = Θ(log n).</p>\n<p><b>Substitution:</b> T(n) = T(n/2ᵏ) + kc; with n = 2ᵏ, T(n) = c + c log₂n = Θ(log n).</p>\n<table class=\"t\">\n<tr><th>Case</th><th>When</th><th>Comparisons</th><th>Time</th></tr>\n<tr><td>Best</td><td>key at first mid</td><td>1</td><td>Θ(1)</td></tr>\n<tr><td>Average</td><td>random position</td><td>≈ log₂n − 1</td><td>Θ(log n)</td></tr>\n<tr><td>Worst</td><td>key at leaf level / absent</td><td>⌊log₂n⌋ + 1</td><td>Θ(log n)</td></tr>\n</table>\n<p><b>Space:</b> Iterative Θ(1). Recursive Θ(log n) (one stack frame per level of recursion).</p>\n<p><b>Maximum comparisons:</b> ⌊log₂n⌋ + 1 (= ⌈log₂(n+1)⌉). n = 1,000,000 ⇒ only 20 comparisons; n = 1024 ⇒ 11.</p>\n\n<h3>7. Binary decision tree</h3>\n<p>The behaviour of binary search on n elements can be drawn as a binary tree: the root is the first mid, left subtree = searches in left half, right subtree = right half. Height of this tree = ⌊log₂n⌋, so the worst case = ⌊log₂n⌋ + 1 comparisons. For n = 10 (indices 0–9):</p>\n<pre class=\"tree\">                      4\n                 /                        1             7\n             /            /               0     2       5     8\n                                                   3       6     9\nLevels: 4 levels ⇒ worst case 4 = ⌊log₂10⌋ + 1 comparisons</pre>\n<p>Average successful comparisons for n = 10 = (1·1 + 2·2 + 3·4 + 4·3)/10 = 29/10 = 2.9.</p>\n\n<h3>8. Linear search vs binary search</h3>\n<table class=\"t\">\n<tr><th>Aspect</th><th>Linear search</th><th>Binary search</th></tr>\n<tr><td>Data requirement</td><td>Sorted or unsorted</td><td>Must be sorted</td></tr>\n<tr><td>Approach</td><td>Sequential</td><td>Divide and conquer (halving)</td></tr>\n<tr><td>Best case</td><td>Θ(1)</td><td>Θ(1)</td></tr>\n<tr><td>Worst case</td><td>Θ(n)</td><td>Θ(log n)</td></tr>\n<tr><td>Data structure</td><td>Array or linked list</td><td>Random access (array)</td></tr>\n<tr><td>n = 1024</td><td>up to 1024 comparisons</td><td>at most 11 comparisons</td></tr>\n<tr><td>Space (iterative)</td><td>Θ(1)</td><td>Θ(1)</td></tr>\n</table>\n\n<h3>9. Advantages / limitations</h3>\n<ul><li>+ Very fast Θ(log n); simple; iterative version uses Θ(1) space.</li>\n<li>− Needs sorted data (sorting costs Θ(n log n)); needs random access; not good for frequently changing data (insert/delete cost Θ(n)).</li></ul>\n\n<div class=\"tip\"><b>Exam tips / common mistakes:</b>\n<ul>\n<li>Always draw the trace table with columns low, high, mid, A[mid], decision.</li>\n<li>Use mid = ⌊(low + high)/2⌋ (floor). State whether indices start at 0 or 1.</li>\n<li>For unsuccessful search, continue until low &gt; high and write \"return −1\".</li>\n<li>Binary search is D&amp;C even though only ONE subproblem is solved — the problem size is halved.</li>\n<li>Recursive space is Θ(log n), not Θ(1).</li>\n</ul></div>\n",

v>"
