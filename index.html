   "s": "<h4>1. Problem</h4><p>n jobs, each requiring one unit of time on one machine; job i has deadline dᵢ and profit pᵢ earned only if finished by dᵢ. Goal: maximise total profit.</p><h4>2. Greedy approach</h4><p>Sort jobs by decreasing profit; schedule each job in the latest free time slot not later than its deadline; reject if none.</p><h4>3. Algorithm</h4><pre class=\"code\">Algorithm JobSeq(d, p, n)\n{\n    sort jobs so that p[1] ≥ ... ≥ p[n];\n    for t := 1 to dmax do slot[t] := 0;\n    for i := 1 to n do\n        for t := min(dmax, d[i]) down to 1 do\n            if slot[t] = 0 then { slot[t] := i; break; }\n}</pre><h4>4. Complexity</h4><p>O(n log n) + O(n²) = O(n²); space O(n).</p><h4>5. Example</h4><div class=\"step\">Sorted: J1(40,3), J2(30,1), J3(20,2), J4(10,2). d<sub>max</sub> = 3.</div><div class=\"step\">J1 → slot 3; J2 → slot 1; J3 → slot 2; J4 → slots 2,1 busy → reject.</div><pre class=\"tree\">Time  0      1      2      3\n      |  J2  |  J3  |  J1  |</pre><div class=\"ans\">Sequence J2, J3, J1; Maximum profit = 30 + 20 + 40 = 90</div><h4>6. Conclusion</h4><p>The greedy profit-first strategy with latest-slot placement always gives an optimal schedule for unit-time jobs.</p>"

 "id": "knap",

 "title": "Knapsack Problem (Greedy)",
 "lectures": "L25",
 "weight": "High",
 "summary": "Fractional knapsack: sort by profit/weight ratio, take whole items while they fit, then a fraction of the next one.",
 "notes": "\n<h3>1. Definition</h3>\n<div class=\"def\"><b>Knapsack problem:</b> Given n objects, object i has weight wᵢ &gt; 0 and profit pᵢ &gt; 0, and a knapsack (bag) of capacity M. If a fraction xᵢ (0 ≤ xᵢ ≤ 1) of object i is placed in the knapsack, a profit pᵢxᵢ is earned. The objective is to fill the knapsack so that total profit is <b>maximum</b> and total weight does not exceed M.</div>\n<h4>Mathematical formulation</h4>\n<pre class=\"tree\">   maximise    Σ (i = 1 to n)  pᵢ xᵢ                    ... (objective function)\n   subject to  Σ (i = 1 to n)  wᵢ xᵢ  ≤  M              ... (capacity constraint)\n               0 ≤ xᵢ ≤ 1 ,  1 ≤ i ≤ n                  ... (fraction allowed)</pre>\n<ul>\n<li>Any (x₁,…,xₙ) satisfying the two constraints is a <b>feasible solution</b>.</li>\n<li>A feasible solution that maximises Σ pᵢxᵢ is an <b>optimal solution</b>.</li>\n<li><b>Fractional knapsack</b>: xᵢ ∈ [0, 1] → solved optimally by greedy.</li>\n<li><b>0/1 knapsack</b>: xᵢ ∈ {0, 1} (take whole or leave) → greedy NOT always optimal → use Dynamic Programming.</li>\n</ul>\n\n<h3>2. Three greedy strategies</h3>\n<table class=\"t\">\n<tr><th>Strategy</th><th>Idea</th><th>Optimal?</th></tr>\n<tr><td>1. Max profit first</td><td>Pick the most profitable object first</td><td>No – heavy object may fill the bag quickly</td></tr>\n<tr><td>2. Min weight first</td><td>Pick the lightest object first (capacity used slowly)</td><td>No – light objects may give little profit</td></tr>\n<tr><td>3. Max pᵢ/wᵢ first</td><td>Pick object with highest profit per unit weight</td><td><b>Yes – always optimal for fractional</b></td></tr>\n</table>\n<h4>Horowitz example: n = 3, M = 20, (p₁,p₂,p₃) = (25, 24, 15), (w₁,w₂,w₃) = (18, 15, 10)</h4>\n<table class=\"t\">\n<tr><th>Strategy</th><th>(x₁, x₂, x₃)</th><th>Σ wᵢxᵢ</th><th>Σ pᵢxᵢ</th></tr>\n<tr><td>Max profit (25 first)</td><td>(1, 2/15, 0)</td><td>18 + 2 = 20</td><td>25 + 3.2 = 28.2</td></tr>\n<tr><td>Min weight (10 first)</td><td>(0, 2/3, 1)</td><td>10 + 10 = 20</td><td>15 + 16 = 31</td></tr>\n<tr><td>Max p/w (1.39, 1.6, 1.5)</td><td>(0, 1, 1/2)</td><td>15 + 5 = 20</td><td><b>24 + 7.5 = 31.5</b></td></tr>\n<tr><td>Arbitrary</td><td>(1/2, 1/3, 1/4)</td><td>16.5</td><td>24.25</td></tr>\n</table>\n<div class=\"ans\">Best = 31.5 by p/w ratio strategy → optimal.</div>\n\n<h3>3. Greedy algorithm (Horowitz – GreedyKnapsack)</h3>\n<pre class=\"code\">Algorithm GreedyKnapsack(m, n)\n// p[1:n], w[1:n] contain profits and weights of n objects\n// ordered such that p[i]/w[i] ≥ p[i+1]/w[i+1].\n// m is the knapsack size and x[1:n] is the solution vector.\n{\n    for i := 1 to n do x[i] := 0.0;     // initialise x\n    U := m;                              // remaining capacity\n    for i := 1 to n do\n    {\n        if (w[i] &gt; U) then break;\n        x[i] := 1.0;  U := U − w[i];\n    }\n    if (i ≤ n) then x[i] := U / w[i];    // fraction of next object\n}</pre>\n<p><b>Total profit</b> = Σ p[i]·x[i].</p>\n\n<h3>4. Steps to solve a numerical (exam format)</h3>\n<div class=\"step\"><b>Step 1:</b> Compute ratio rᵢ = pᵢ / wᵢ for every object (table).</div>\n<div class=\"step\"><b>Step 2:</b> Arrange objects in decreasing order of rᵢ.</div>\n<div class=\"step\"><b>Step 3:</b> Take objects completely while wᵢ ≤ remaining capacity U; update U and profit.</div>\n<div class=\"step\"><b>Step 4:</b> For the first object that does not fit, take fraction U / wᵢ; profit += pᵢ·(U/wᵢ); knapsack full.</div>\n<div class=\"step\"><b>Step 5:</b> Write solution vector x (in original item order) and total profit; check Σ wᵢxᵢ = M.</div>\n\n<h3>5. Worked example (CLRS)</h3>\n<p>M = 50; items (w, p): I1 (10, 60), I2 (20, 100), I3 (30, 120).</p>\n<table class=\"t\"><tr><th>Item</th><th>w</th><th>p</th><th>p/w</th></tr><tr><td>I1</td><td>10</td><td>60</td><td>6</td></tr><tr><td>I2</td><td>20</td><td>100</td><td>5</td></tr><tr><td>I3</td><td>30</td><td>120</td><td>4</td></tr></table>\n<table class=\"t\"><tr><th>Item taken</th><th>Fraction</th><th>Weight added</th><th>Remaining U</th><th>Profit so far</th></tr>\n<tr><td>I1</td><td>1</td><td>10</td><td>40</td><td>60</td></tr>\n<tr><td>I2</td><td>1</td><td>20</td><td>20</td><td>160</td></tr>\n<tr><td>I3</td><td>20/30 = 2/3</td><td>20</td><td>0</td><td>160 + 80 = 240</td></tr></table>\n<div class=\"ans\">x = (1, 1, 2/3); Maximum profit = 240</div>\n\n<h3>6. Time complexity</h3>\n<table class=\"t\"><tr><th>Step</th><th>Cost</th></tr><tr><td>Compute ratios</td><td>O(n)</td></tr><tr><td>Sort by ratio</td><td>O(n log n)</td></tr><tr><td>Greedy filling loop</td><td>O(n)</td></tr><tr><td><b>Total</b></td><td><b>O(n log n)</b> (O(n) if already sorted)</td></tr><tr><td>Space</td><td>O(n) for x[ ]</td></tr></table>\n\n<h3>7. Why p/w greedy is optimal (proof idea)</h3>\n<p>Suppose an optimal solution y differs from greedy solution x. Let k be the first index (in ratio order) where xₖ ≠ yₖ; then yₖ &lt; xₖ. Increase yₖ to xₖ and remove the same weight from later objects (which have smaller or equal ratio). The profit does not decrease. Repeating this converts y into x without losing profit, so x is optimal. (Exchange argument.)</p>\n\n<h3>8. 0/1 knapsack – greedy fails</h3>\n<p>Same CLRS data with xᵢ ∈ {0,1}: greedy by ratio takes I1 + I2 = 160 (I3 doesn't fit), but optimal is I2 + I3 = <b>220</b>. Therefore 0/1 knapsack is solved by <b>dynamic programming</b> (O(nM)).</p>\n<table class=\"t\"><tr><th>Fractional knapsack</th><th>0/1 knapsack</th></tr>\n<tr><td>Items can be broken (0 ≤ xᵢ ≤ 1)</td><td>Item taken whole or not at all (xᵢ = 0 or 1)</td></tr>\n<tr><td>Greedy (p/w) gives optimal</td><td>Greedy may fail; DP gives optimal</td></tr>\n<tr><td>O(n log n)</td><td>O(n·M) with DP</td></tr>\n<tr><td>Knapsack always completely filled (if Σw ≥ M)</td><td>Some capacity may remain unused</td></tr></table>\n\n<h3>9. Applications</h3>\n<ul><li>Cargo loading of divisible goods (grain, liquid, sand)</li><li>Budget allocation among divisible investments</li><li>Resource allocation (man-hours, bandwidth) among tasks</li></ul>\n<div class=\"tip\"><b>Exam tip:</b> Draw 3 tables: (i) ratio table, (ii) sorted order, (iii) selection table with \"remaining capacity\" and \"profit\" columns. Write x in the <b>original item order</b>, and verify Σ wᵢxᵢ = M. Write fractions exactly (e.g. 4/11) and the final profit to 2 decimals.</div>\n<div class=\"tip\"><b>Common mistakes:</b> sorting by profit instead of ratio; writing the solution vector in sorted order; forgetting the fraction for the last item; using greedy for 0/1 and calling it optimal.</div>\n",

   "s": "<h4>1. Problem</h4><p>Maximise Σpᵢxᵢ subject to Σwᵢxᵢ ≤ M, 0 ≤ xᵢ ≤ 1.</p><h4>2. Greedy strategy</h4><p>Sort by pᵢ/wᵢ (decreasing); take items fully while they fit; take a fraction of the next item.</p><h4>3. Algorithm</h4><pre class=\"code\">Algorithm GreedyKnapsack(m, n)\n{\n    for i := 1 to n do x[i] := 0.0;\n    U := m;\n    for i := 1 to n do\n    {   if (w[i] &gt; U) then break;\n        x[i] := 1.0; U := U − w[i]; }\n    if (i ≤ n) then x[i] := U / w[i];\n}</pre><h4>4. Optimality (exchange argument)</h4><p>Let x be greedy and y an optimal solution. At the first index k (ratio order) where they differ, yₖ &lt; xₖ. Increase yₖ and decrease later items (ratio ≤ ratio of k) by the same weight; profit does not decrease. Repeating gives x with profit ≥ profit(y). Hence greedy is optimal.</p><h4>5. Complexity</h4><p>O(n log n) sort + O(n) loop = O(n log n).</p><h4>6. Example</h4><table class=\"t\"><tr><th>Item</th><th>w</th><th>p</th><th>p/w</th><th>x</th><th>U left</th><th>Profit</th></tr><tr><td>I1</td><td>10</td><td>60</td><td>6</td><td>1</td><td>40</td><td>60</td></tr><tr><td>I2</td><td>20</td><td>100</td><td>5</td><td>1</td><td>20</td><td>160</td></tr><tr><td>I3</td><td>30</td><td>120</td><td>4</td><td>2/3</td><td>0</td><td>240</td></tr></table><div class=\"ans\">x = (1, 1, 2/3); Maximum profit = 240</div>"

 "summary": "Greedy optimal prefix code: repeatedly merge the two least-frequent nodes; frequent symbols get short codes.",
 "notes": "\n<h3>1. Introduction</h3>\n<div class=\"def\"><b>Huffman coding</b> is a greedy, <b>lossless data-compression</b> algorithm that assigns <b>variable-length, prefix-free binary codes</b> to characters based on their frequencies: frequent characters get <b>short</b> codes and rare characters get <b>long</b> codes, so that the total number of bits is minimum. It was developed by David A. Huffman (1952).</div>\n<h4>Fixed-length vs variable-length codes</h4>\n<table class=\"t\">\n<tr><th>Fixed-length code</th><th>Variable-length code</th></tr>\n<tr><td>Every character uses the same number of bits = ⌈log₂ n⌉ (n = number of distinct characters)</td><td>Number of bits differs per character</td></tr>\n<tr><td>Simple to decode</td><td>Needs prefix property to decode uniquely</td></tr>\n<tr><td>Ignores frequency → more bits</td><td>Uses frequency → fewer total bits (compression)</td></tr>\n<tr><td>e.g. 6 chars → 3 bits each</td><td>e.g. Huffman: F = 0, A = 1100</td></tr>\n</table>\n<div class=\"def\"><b>Prefix code (prefix-free code):</b> a code in which <b>no codeword is a prefix of any other codeword</b>. Hence an encoded bit string can be decoded uniquely, left to right, without separators. Example: {0, 100, 101, 1100, 1101, 111} is prefix-free; {0, 01, 11} is not (0 is a prefix of 01).</div>\n\n<h3>2. Algorithm (CLRS – using a min-priority queue)</h3>\n<pre class=\"code\">HUFFMAN(C)\n// C = set of n characters, each c has frequency c.freq\n1  n = |C|\n2  Q = C                         // min-priority queue keyed on freq\n3  for i = 1 to n − 1\n4      allocate a new node z\n5      z.left  = x = EXTRACT-MIN(Q)\n6      z.right = y = EXTRACT-MIN(Q)\n7      z.freq  = x.freq + y.freq\n8      INSERT(Q, z)\n9  return EXTRACT-MIN(Q)         // root of the Huffman tree</pre>\n<h4>Steps (exam format)</h4>\n<div class=\"step\"><b>Step 1:</b> Arrange the characters in increasing order of frequency (each is a leaf node).</div>\n<div class=\"step\"><b>Step 2:</b> Take the two nodes with the smallest frequencies; create a new internal node whose frequency is their sum; smaller one becomes the <b>left child</b>, the other the <b>right child</b>.</div>\n<div class=\"step\"><b>Step 3:</b> Insert the new node back in the list (keep sorted). Repeat Step 2 until one node (the root) remains — exactly n − 1 merges.</div>\n<div class=\"step\"><b>Step 4:</b> Label every left edge 0 and right edge 1. The code of a character = sequence of edge labels from root to its leaf.</div>\n<div class=\"step\"><b>Step 5:</b> Compute code lengths, total bits = Σ fᵢ·lᵢ, average length = Σ fᵢ·lᵢ / Σ fᵢ, and compare with fixed length.</div>\n\n<h3>3. Worked example (lecture): A 5, B 9, C 12, D 13, E 16, F 45</h3>\n<table class=\"t\"><tr><th>Step</th><th>Two smallest</th><th>New node</th><th>Queue after merge</th></tr>\n<tr><td>1</td><td>A(5), B(9)</td><td>14</td><td>C12, D13, 14, E16, F45</td></tr>\n<tr><td>2</td><td>C(12), D(13)</td><td>25</td><td>14, E16, 25, F45</td></tr>\n<tr><td>3</td><td>14, E(16)</td><td>30</td><td>25, 30, F45</td></tr>\n<tr><td>4</td><td>25, 30</td><td>55</td><td>F45, 55</td></tr>\n<tr><td>5</td><td>F(45), 55</td><td>100</td><td>100 (root)</td></tr></table>\n<pre class=\"tree\">                 (100)\n               0/     \\1\n            F:45      (55)\n                    0/     \\1\n                 (25)       (30)\n                0/  \\1     0/   \\1\n             C:12  D:13  (14)   E:16\n                        0/  \\1\n                       A:5  B:9</pre>\n<table class=\"t\"><tr><th>Char</th><th>Freq</th><th>Code</th><th>Length</th><th>f × l</th></tr>\n<tr><td>F</td><td>45</td><td>0</td><td>1</td><td>45</td></tr>\n<tr><td>C</td><td>12</td><td>100</td><td>3</td><td>36</td></tr>\n<tr><td>D</td><td>13</td><td>101</td><td>3</td><td>39</td></tr>\n<tr><td>A</td><td>5</td><td>1100</td><td>4</td><td>20</td></tr>\n<tr><td>B</td><td>9</td><td>1101</td><td>4</td><td>36</td></tr>\n<tr><td>E</td><td>16</td><td>111</td><td>3</td><td>48</td></tr>\n<tr><td colspan=\"4\"><b>Total</b></td><td><b>224</b></td></tr></table>\n<div class=\"ans\">Total = 224 bits (for 100 characters); average = 2.24 bits/char; fixed-length = 3 × 100 = 300 bits; saving = 76/300 = 25.33%</div>\n<p>(If frequencies are in thousands, as in CLRS: 224,000 bits vs 300,000 bits.)</p>\n\n<h3>4. Decoding</h3>\n<p>Start at the root; read bits: 0 → go left, 1 → go right; when a leaf is reached, output that character and return to the root. Example with the code above: <b>110001011111001101</b> → 1100 | 0 | 101 | 111 | 100 | 1101 → <b>A F D E C B</b>.</p>\n\n<h3>5. Time complexity</h3>\n<table class=\"t\"><tr><th>Operation</th><th>Cost</th></tr>\n<tr><td>Build min-heap of n characters</td><td>O(n)</td></tr>\n<tr><td>n − 1 iterations, each 2 EXTRACT-MIN + 1 INSERT</td><td>O(log n) each</td></tr>\n<tr><td><b>Total</b></td><td><b>O(n log n)</b></td></tr>\n<tr><td>Space (tree)</td><td>O(n) (2n − 1 nodes)</td></tr></table>\n\n<h3>6. Properties</h3>\n<ul>\n<li><b>Prefix-free</b> – unique decoding without separators.</li>\n<li><b>Optimal</b> – minimum average code length among all prefix codes for the given frequencies.</li>\n<li><b>Greedy-choice property</b> – the two least frequent characters can be sibling leaves at the deepest level of some optimal tree.</li>\n<li><b>Optimal substructure</b> – replacing two merged characters by one character with summed frequency gives an optimal subproblem.</li>\n<li>The Huffman tree is a <b>full binary tree</b>: every internal node has exactly 2 children; n leaves ⇒ n − 1 internal nodes.</li>\n<li>Ties may be broken arbitrarily → different codes, but the <b>same total/average length</b> (all optimal).</li>\n</ul>\n\n<h3>7. Applications</h3>\n<p>ZIP / GZIP (DEFLATE), JPEG and MP3 entropy coding, PNG, fax machines, text compression, IoT sensor data transmission.</p>\n<div class=\"tip\"><b>Exam tip:</b> Show the queue after every merge (table), draw the final tree with 0/1 on edges, write a code table with f × l, and calculate total bits, average length and % saving vs fixed length. State \"smaller frequency on the left (0)\".</div>\n<div class=\"tip\"><b>Common mistakes:</b> merging a new node before checking that two smaller original nodes exist; forgetting to re-insert the merged node in sorted position; using ⌊log₂ n⌋ instead of ⌈log₂ n⌉ for fixed length; giving short code to a rare symbol.</div>\n",

   "s": "<p>A prefix code is a code in which no codeword is a prefix of another codeword, e.g. {0, 100, 101, 111}. It is needed so that an encoded bit-string can be <b>decoded uniquely</b> from left to right without any separators between codewords.</p>"

   "s": "<pre class=\"code\">HUFFMAN(C)\n1  n = |C|\n2  Q = C                        // min-priority queue on freq\n3  for i = 1 to n − 1\n4      allocate new node z\n5      z.left  = x = EXTRACT-MIN(Q)\n6      z.right = y = EXTRACT-MIN(Q)\n7      z.freq  = x.freq + y.freq\n8      INSERT(Q, z)\n9  return EXTRACT-MIN(Q)</pre><p><b>Analysis:</b> Building the heap: O(n). The loop runs n − 1 times; each iteration does two EXTRACT-MIN and one INSERT, each O(log n).</p><div class=\"ans\">T(n) = O(n) + (n − 1)·O(log n) = O(n log n)</div>"

   "s": "<div class=\"step\"><b>Frequencies:</b> s:5, i:3, space:3, h:2, e:2, t:1, m:1, a:1, g:1 (total 19).</div><table class=\"t\"><tr><th>Merge</th><th>Nodes</th><th>New</th></tr><tr><td>1</td><td>t1 + m1</td><td>2</td></tr><tr><td>2</td><td>a1 + g1</td><td>2</td></tr><tr><td>3</td><td>h2 + e2</td><td>4</td></tr><tr><td>4</td><td>(2) + (2)</td><td>4</td></tr><tr><td>5</td><td>i3 + space3</td><td>6</td></tr><tr><td>6</td><td>(4) + (4)</td><td>8</td></tr><tr><td>7</td><td>s5 + (6)</td><td>11</td></tr><tr><td>8</td><td>(8) + (11)</td><td>19</td></tr></table><table class=\"t\"><tr><th>Char</th><th>Code</th><th>l</th><th>f·l</th></tr><tr><td>h</td><td>000</td><td>3</td><td>6</td></tr><tr><td>e</td><td>001</td><td>3</td><td>6</td></tr><tr><td>t</td><td>0100</td><td>4</td><td>4</td></tr><tr><td>m</td><td>0101</td><td>4</td><td>4</td></tr><tr><td>a</td><td>0110</td><td>4</td><td>4</td></tr><tr><td>g</td><td>0111</td><td>4</td><td>4</td></tr><tr><td>s</td><td>10</td><td>2</td><td>10</td></tr><tr><td>i</td><td>110</td><td>3</td><td>9</td></tr><tr><td>space</td><td>111</td><td>3</td><td>9</td></tr></table><div class=\"ans\">Total = 56 bits (fixed: 9 symbols → 4 bits × 19 = 76 bits); saving ≈ 26.3%</div>"

   "q": "Explain Huffman coding with its algorithm, properties, complexity and an example. Why is it called a greedy algorithm?",
   "s": "<h4>1. Definition</h4><p>Huffman coding is a lossless compression technique that produces optimal prefix-free variable-length codes; frequent characters get shorter codes.</p><h4>2. Why greedy?</h4><p>At every step it makes the locally optimal choice of merging the <b>two least-frequent</b> nodes and never revises this decision; this local choice leads to a globally optimal code (greedy-choice property + optimal substructure).</p><h4>3. Algorithm</h4><pre class=\"code\">HUFFMAN(C)\n  n = |C|; Q = C\n  for i = 1 to n − 1\n      z.left  = x = EXTRACT-MIN(Q)\n      z.right = y = EXTRACT-MIN(Q)\n      z.freq = x.freq + y.freq\n      INSERT(Q, z)\n  return EXTRACT-MIN(Q)</pre><h4>4. Example</h4><p>A5 B9 C12 D13 E16 F45 → merges 14, 25, 30, 55, 100 → F = 0, C = 100, D = 101, A = 1100, B = 1101, E = 111; total 224 bits vs 300 fixed (25.33% saving).</p><h4>5. Properties</h4><ul><li>Prefix-free → unique decoding</li><li>Optimal average code length</li><li>Full binary tree with n leaves and n − 1 internal nodes</li></ul><h4>6. Complexity</h4><p>O(n log n) time using min-heap; O(n) space.</p><h4>7. Applications</h4><p>ZIP, JPEG, MP3, PNG, fax.</p>"

 ]

<script>/* ===== Numerical practice generators: each returns {q: html, s: html} ===== */
(function(){
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=(n,lo,hi)=>{const s=new Set();while(s.size<n)s.add(R(lo,hi));return [...s]};
const tbl=(head,rows)=>'<div class="tablewrap"><table class="t"><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</table></div>';
const step=(n,h)=>'<div class="step"><b>Step '+n+':</b> '+h+'</div>';
const ans=h=>'<div class="ans">'+h+'</div>';
const arr=(a,hi)=>'[ '+a.map((x,i)=>hi&&hi.includes(i)?'<span class="hlr">'+x+'</span>':x).join(', ')+' ]';
const sup=x=>'<sup>'+x+'</sup>';
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+'/'+d};
const r2=x=>(Math.round(x*100)/100).toFixed(2);

/* ---------- tree SVG ---------- */
function treeSVG(root,o){
  o=o||{};const gap=o.gap||46, lv=o.lv||62, r=o.r||17;
  let idx=0, maxd=0; const nodes=[];
  (function lay(n,d){if(!n)return;lay(n.l,d+1);n._x=idx++;n._d=d;maxd=Math.max(maxd,d);nodes.push(n);lay(n.r,d+1)})(root,0);
  const W=Math.max(idx*gap+20,120), H=(maxd+1)*lv+(o.under?34:20);
  const X=n=>10+gap/2+n._x*gap, Y=n=>r+6+n._d*lv;
  let s='';
  nodes.forEach(n=>{[['l',n.l,'0'],['r',n.r,'1']].forEach(([k,c,b])=>{if(!c)return;
    s+='<line class="ed" x1="'+X(n)+'" y1="'+Y(n)+'" x2="'+X(c)+'" y2="'+Y(c)+'"/>';
    if(o.edgeBits)s+='<text class="el" x="'+((X(n)+X(c))/2+(k==='l'?-9:5))+'" y="'+((Y(n)+Y(c))/2-2)+'" text-anchor="middle">'+b+'</text>';})});
  nodes.forEach(n=>{const leaf=!n.l&&!n.r;
    s+='<circle class="nd'+(leaf?' leaf':'')+'" cx="'+X(n)+'" cy="'+Y(n)+'" r="'+r+'"/>';
    s+='<text x="'+X(n)+'" y="'+(Y(n)+4.5)+'" text-anchor="middle">'+(o.label?o.label(n):n.v)+'</text>';
    if(o.under&&leaf&&o.under(n))s+='<text class="el" x="'+X(n)+'" y="'+(Y(n)+r+15)+'" text-anchor="middle">'+o.under(n)+'</text>';});
  return '<div class="svgwrap"><svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="tree diagram">'+s+'</svg></div>';
}
const pre=n=>n?[n.v,...pre(n.l),...pre(n.r)]:[];
const ino=n=>n?[...ino(n.l),n.v,...ino(n.r)]:[];
const post=n=>n?[...post(n.l),...post(n.r),n.v]:[];
const level=n=>{const q=[n],o=[];while(q.length){const x=q.shift();if(!x)continue;o.push(x.v);q.push(x.l,x.r)}return o};
const height=n=>n?1+Math.max(height(n.l),height(n.r)):-1;

const G={};

/* ---------- 1. Asymptotic proof ---------- */
G.asym={title:'Asymptotic proof (find c and n₀)',topic:'asym',desc:'Prove a polynomial is O, Ω and Θ of its leading term by finding constants.',
make(){
  const d=pick([2,3]);const co=[];for(let i=d;i>=0;i--)co.push(i===d?R(2,9):R(0,12));
  const terms=co.map((c,k)=>{const p=d-k;if(!c)return null;return c+(p===0?'':p===1?'n':'n'+sup(p))}).filter(Boolean);
  const f=terms.join(' + '); const lead='n'+sup(d); const sum=co.reduce((a,b)=>a+b,0);
  const q='<p>Let f(n) = '+f+'. Prove that f(n) = O('+lead+'), f(n) = Ω('+lead+') and hence f(n) = Θ('+lead+'). Find suitable constants c₁, c₂ and n₀.</p>';
  const lower=co.slice(1).map((c,k)=>{const p=d-1-k;if(!c)return null;return c+(p===0?'':p===1?'n':'n'+sup(p))+' ≤ '+c+'n'+sup(d)}).filter(Boolean);
  let s='<p><b>Given:</b> f(n) = '+f+', g(n) = '+lead+'.</p>';
  s+=step(1,'<b>Upper bound (Big-O).</b> We need c₂ &gt; 0, n₀ such that 0 ≤ f(n) ≤ c₂·'+lead+' for all n ≥ n₀.<br>For n ≥ 1 every lower power is at most '+lead+': '+(lower.join(', ')||'(no lower terms)')+'.<br>∴ f(n) ≤ ('+co.filter(x=>x).join(' + ')+')'+lead+' = '+sum+lead+' for all n ≥ 1.<br>So c₂ = '+sum+', n₀ = 1 ⇒ f(n) = O('+lead+').');
  s+=step(2,'<b>Lower bound (Big-Ω).</b> We need c₁ &gt; 0 with 0 ≤ c₁·'+lead+' ≤ f(n).<br>All coefficients are non-negative, so f(n) ≥ '+co[0]+lead+' for all n ≥ 1.<br>So c₁ = '+co[0]+', n₀ = 1 ⇒ f(n) = Ω('+lead+').');
  s+=step(3,'<b>Tight bound (Θ).</b> Combining: '+co[0]+lead+' ≤ f(n) ≤ '+sum+lead+' for all n ≥ 1.');
  s+=step(4,'<b>Check with n = 2:</b> c₁g = '+co[0]*2**d+', f(2) = '+co.reduce((a,c,k)=>a+c*2**(d-k),0)+', c₂g = '+sum*2**d+' ✓');
  s+=ans('f(n) = Θ('+lead+') with c₁ = '+co[0]+', c₂ = '+sum+', n₀ = 1');
  s+='<div class="tip"><b>Exam tip:</b> Any valid constants earn full marks. Always state c, n₀ and the inequality "for all n ≥ n₀" explicitly.</div>';
  return {q,s};
}};

/* ---------- 2. Master theorem ---------- */
G.master={title:'Master theorem',topic:'recur',desc:'Random recurrences T(n) = aT(n/b) + f(n), solved case by case.',
make(){
  let a,b,k,p;
  const mode=R(1,3);
  b=pick([2,2,2,3,4]);
  if(mode===2){const e=pick([0,1,2]);a=b**e; if(a<1)a=1; k=e; p=pick([0,0,1]);}
  else {a=pick([1,2,3,4,7,8,9,16,27]); k=pick([0,0.5,1,2,3]); p=pick([0,0,0,1]);}
  const e=Math.log(a)/Math.log(b); const eInt=Math.abs(e-Math.round(e))<1e-9; const E=eInt?String(Math.round(e)):e.toFixed(3);
  const nk=k===0?'':k===0.5?'√n':k===1?'n':'n'+sup(k);
  const lg=p===0?'':(p===1?'log n':'log'+sup(p)+' n');
  const f=(nk||lg)?(nk+(nk&&lg?' ':'')+lg):'1';
  const ne=eInt?(Math.round(e)===0?'1':Math.round(e)===1?'n':'n'+sup(E)):'n'+sup(E);
  const q='<p>Solve using the Master method: <b>T(n) = '+(a===1?'':a)+'T(n/'+b+') + '+f+'</b></p>';
  let s='<p><b>Given:</b> T(n) = aT(n/b) + f(n) with a = '+a+', b = '+b+', f(n) = '+f+'. Here a ≥ 1 and b &gt; 1, so the Master theorem can be applied.</p>';
  s+=step(1,'Compute n'+sup('log<sub>b</sub>a')+' = n'+sup('log<sub>'+b+'</sub>'+a)+' = '+ne+(eInt?'':' (log<sub>'+b+'</sub>'+a+' ≈ '+E+')')+'.');
  s+=step(2,'Compare f(n) = '+f+' with '+ne+'.');
  let res;
  if(Math.abs(k-e)<1e-9){
    s+=step(3,'f(n) = Θ('+ne+(p?' · '+lg:'')+'), i.e. f(n) = Θ(n'+sup('log<sub>b</sub>a')+' log'+sup('k')+' n) with k = '+p+'. ⇒ <b>Case 2</b>.');
    const lg2=(p+1)===1?'log n':'log'+sup(p+1)+' n';
    res='Θ('+(ne==='1'?'':ne+' ')+lg2+')';
    s+=step(4,'By Case 2: T(n) = Θ(n'+sup('log<sub>b</sub>a')+' log'+sup('k+1')+' n) = '+res+'.');
  } else if(k<e){
    const eps=(e-k);
    s+=step(3,'f(n) grows polynomially slower: f(n) = O(n'+sup(E+' − ε')+') with ε = '+(Number.isInteger(eps)?eps:eps.toFixed(3))+(p?' (any log factor is absorbed by choosing a slightly smaller ε)':'')+' &gt; 0. ⇒ <b>Case 1</b>.');
    res='Θ('+ne+')';
    s+=step(4,'By Case 1: T(n) = Θ(n'+sup('log<sub>b</sub>a')+') = '+res+'.');
  } else {
    const eps=(k-e); const c=a/b**k;
    s+=step(3,'f(n) grows polynomially faster: f(n) = Ω(n'+sup(E+' + ε')+') with ε = '+(Number.isInteger(eps)?eps:eps.toFixed(3))+' &gt; 0. ⇒ <b>Case 3</b> (check regularity).');
    s+=step(4,'Regularity: a·f(n/b) = '+a+'·f(n/'+b+') ≤ ('+a+'/'+b+sup(k)+')·f(n) = '+(Number.isInteger(c)?c:c.toFixed(3))+'·f(n). Since c = '+(Number.isInteger(c)?c:c.toFixed(3))+' &lt; 1 ✓ condition holds.');
    res='Θ('+f+')';
    s+=step(5,'By Case 3: T(n) = Θ(f(n)) = '+res+'.');
  }
  s+=ans('T(n) = '+res);
  return {q,s};
}};

/* ---------- 3. Binary search ---------- */
G.bsearch={title:'Binary search trace',topic:'bsearch',desc:'Trace low, high, mid for a random sorted array — successful or unsuccessful search.',
make(){
  const n=R(9,15); const A=uniq(n,3,99).sort((x,y)=>x-y);
  const present=Math.random()<0.6; let key;
  if(present)key=pick(A); else {do{key=R(2,100)}while(A.includes(key));}
  const q='<p>Apply binary search to find <b>key = '+key+'</b> in the sorted array (0-indexed):</p>'+tbl(['Index',...A.map((_,i)=>i)],[['A[i]',...A]])+'<p>Show low, high, mid and A[mid] at each step and state the number of comparisons.</p>';
  let low=0,high=n-1,rows=[],found=-1,c=0;
  while(low<=high){const mid=Math.floor((low+high)/2);c++;
    if(A[mid]===key){rows.push([c,low,high,mid,A[mid],key+' = '+A[mid],'<b>Found</b> at index '+mid]);found=mid;break}
    else if(key<A[mid]){rows.push([c,low,high,mid,A[mid],key+' &lt; '+A[mid],'high = mid − 1 = '+(mid-1)]);high=mid-1}
    else {rows.push([c,low,high,mid,A[mid],key+' &gt; '+A[mid],'low = mid + 1 = '+(mid+1)]);low=mid+1}}
  let s='<p><b>Given:</b> n = '+n+', key = '+key+'. Initially low = 0, high = '+(n-1)+'. mid = ⌊(low + high)/2⌋.</p>';
  s+=tbl(['Step','low','high','mid','A[mid]','Comparison','Action'],rows);
  if(found<0)s+='<p>Now low = '+low+' &gt; high = '+high+', so the search interval is empty.</p>';
  s+=ans(found>=0?'Key '+key+' found at index '+found+' after '+c+' comparison(s).':'Key '+key+' is NOT present — return −1 after '+c+' comparison(s).');
  s+='<div class="note">Max comparisons for n = '+n+' is ⌊log₂'+n+'⌋ + 1 = '+(Math.floor(Math.log2(n))+1)+'. Time complexity Θ(log n).</div>';
  return {q,s};
}};

/* ---------- 4. Quick sort ---------- */
G.quick={title:'Quick sort (Lomuto partition)',topic:'quick',desc:'Full partition trace with pivot = last element, as in the lecture slides.',
make(){
  const n=R(6,8); const A=uniq(n,5,99); const orig=A.slice();
  const q='<p>Sort the array using Quick Sort (pivot = last element, Lomuto partition). Show every partition step.</p><p><b>A = '+arr(orig)+'</b></p>';
  let s='<p><b>Algorithm used:</b> PARTITION(A, low, high): pivot = A[high], i = low − 1; for j = low to high − 1: if A[j] ≤ pivot then i = i + 1, swap A[i], A[j]; finally swap A[i+1], A[high] and return i + 1.</p>';
  let call=0, comps=0;
  function qs(lo,hi,depth){
    if(lo>=hi){return}
    call++; const pivot=A[hi]; let i=lo-1; const rows=[]; const before=A.slice(lo,hi+1);
    for(let j=lo;j<hi;j++){comps++; const aj=A[j];
      if(aj<=pivot){i++;const sw=i!==j;[A[i],A[j]]=[A[j],A[i]];rows.push([j,aj,aj+' ≤ '+pivot+' ✓',i,sw?'swap A['+i+'] ↔ A['+j+']':'i = j, no change',arr(A.slice(lo,hi+1))]);}
      else rows.push([j,aj,aj+' &gt; '+pivot+' ✗',i,'—',arr(A.slice(lo,hi+1))]);}
    [A[i+1],A[hi]]=[A[hi],A[i+1]]; const p=i+1;
    s+='<h4>Call '+call+': QUICKSORT(A, '+lo+', '+hi+') — subarray '+arr(before)+'</h4>';
    s+='<p>pivot = A['+hi+'] = <b>'+pivot+'</b>, i = '+(lo-1)+'</p>';
    s+=tbl(['j','A[j]','Compare','i','Action','Subarray after'],rows);
    s+='<p>Final swap A['+p+'] ↔ A['+hi+'] → pivot '+pivot+' placed at index <b>'+p+'</b>. Array: '+arr(A,[p])+'</p>';
    qs(lo,p-1,depth+1); qs(p+1,hi,depth+1);
  }
  qs(0,n-1,0);
  s+=ans('Sorted array: '+arr(A)+' &nbsp;('+call+' partition calls, '+comps+' comparisons)');
  s+='<div class="note">Best/average case Θ(n log n) (balanced splits); worst case Θ(n²) when the array is already sorted with last-element pivot.</div>';
  return {q,s};
}};

/* ---------- 5. Merge sort ---------- */
G.merge={title:'Merge sort',topic:'merge',desc:'Divide tree and every merge with comparison counts.',
make(){
  const n=R(6,8); const A=uniq(n,5,99);
  const q='<p>Sort using Merge Sort. Show the divide phase and every merge step with the number of comparisons.</p><p><b>A = '+arr(A)+'</b></p>';
  const levels=[]; const merges=[]; let total=0;
  function ms(a,d){(levels[d]=levels[d]||[]).push(a);
    if(a.length<=1)return a; const m=Math.ceil(a.length/2)/* q=floor((p+r)/2) gives left size ceil(n/2) */;
    const L=ms(a.slice(0,m),d+1), Rr=ms(a.slice(m),d+1);
    let i=0,j=0,c=0,o=[];while(i<L.length&&j<Rr.length){c++;if(L[i]<=Rr[j])o.push(L[i++]);else o.push(Rr[j++])}
    o=o.concat(L.slice(i),Rr.slice(j)); total+=c; merges.push([merges.length+1,arr(L),arr(Rr),arr(o),c]); return o;}
  const out=ms(A,0);
  let s='<p><b>Algorithm:</b> MERGE-SORT(A, p, r): if p &lt; r then q = ⌊(p + r)/2⌋, MERGE-SORT(A, p, q), MERGE-SORT(A, q+1, r), MERGE(A, p, q, r).</p>';
  s+='<h4>Divide phase</h4><pre class="tree">'+levels.map((L,d)=>'Level '+d+':  '+L.map(x=>'['+x.join(',')+']').join('  ')).join('\n')+'</pre>';
  s+='<h4>Conquer &amp; combine (merge) phase</h4>'+tbl(['Merge #','Left','Right','Merged','Comparisons'],merges);
  s+=ans('Sorted: '+arr(out)+' &nbsp;Total comparisons = '+total);
  s+='<div class="note">Recurrence T(n) = 2T(n/2) + Θ(n) ⇒ Θ(n log n) in best, average and worst case; extra space Θ(n); stable.</div>';
  return {q,s};
}};

/* ---------- 6. Strassen ---------- */
G.strassen={title:'Strassen 2×2 multiplication',topic:'strassen',desc:'Seven products P1–P7 with substitution, then C11–C22, verified conventionally.',
make(){
  const v=()=>R(-3,9); const a=[[v(),v()],[v(),v()]], b=[[v(),v()],[v(),v()]];
  const M=m=>'<span class="matrix"><span>'+m[0][0]+'</span><span>'+m[0][1]+'</span><span>'+m[1][0]+'</span><span>'+m[1][1]+'</span></span>';
  const q='<p>Multiply using Strassen\'s method: &nbsp;A = '+M(a)+' &nbsp; B = '+M(b)+'</p>';
  const [A11,A12,A21,A22]=[a[0][0],a[0][1],a[1][0],a[1][1]],[B11,B12,B21,B22]=[b[0][0],b[0][1],b[1][0],b[1][1]];
  const p=x=>x<0?'('+x+')':x;
  const P=[
    ['P1','(A11 + A22)(B11 + B22)','('+p(A11)+' + '+p(A22)+')('+p(B11)+' + '+p(B22)+')',A11+A22,B11+B22],
    ['P2','(A21 + A22)·B11','('+p(A21)+' + '+p(A22)+')·'+p(B11),A21+A22,B11],
    ['P3','A11·(B12 − B22)',p(A11)+'·('+p(B12)+' − '+p(B22)+')',A11,B12-B22],
    ['P4','A22·(B21 − B11)',p(A22)+'·('+p(B21)+' − '+p(B11)+')',A22,B21-B11],
    ['P5','(A11 + A12)·B22','('+p(A11)+' + '+p(A12)+')·'+p(B22),A11+A12,B22],
    ['P6','(A21 − A11)(B11 + B12)','('+p(A21)+' − '+p(A11)+')('+p(B11)+' + '+p(B12)+')',A21-A11,B11+B12],
    ['P7','(A12 − A22)(B21 + B22)','('+p(A12)+' − '+p(A22)+')('+p(B21)+' + '+p(B22)+')',A12-A22,B21+B22]];
  const val=P.map(x=>x[3]*x[4]); const [P1,P2,P3,P4,P5,P6,P7]=val;
  let s='<p><b>Given:</b> A11 = '+A11+', A12 = '+A12+', A21 = '+A21+', A22 = '+A22+'; B11 = '+B11+', B12 = '+B12+', B21 = '+B21+', B22 = '+B22+'.</p>';
  s+=step(1,'Compute the seven products:')+tbl(['Product','Formula','Substitution','Value'],P.map((x,i)=>[x[0],x[1],x[2]+' = '+p(x[3])+' × '+p(x[4]),'<b>'+val[i]+'</b>']));
  const C11=P1+P4-P5+P7,C12=P3+P5,C21=P2+P4,C22=P1+P3-P2+P6;
  s+=step(2,'Combine:')+tbl(['Entry','Formula','Value'],[
    ['C11','P1 + P4 − P5 + P7',P1+' + '+p(P4)+' − '+p(P5)+' + '+p(P7)+' = <b>'+C11+'</b>'],
    ['C12','P3 + P5',P3+' + '+p(P5)+' = <b>'+C12+'</b>'],
    ['C21','P2 + P4',P2+' + '+p(P4)+' = <b>'+C21+'</b>'],
    ['C22','P1 + P3 − P2 + P6',P1+' + '+p(P3)+' − '+p(P2)+' + '+p(P6)+' = <b>'+C22+'</b>']]);
  const c11=A11*B11+A12*B21,c12=A11*B12+A12*B22,c21=A21*B11+A22*B21,c22=A21*B12+A22*B22;
  s+=step(3,'Verify conventionally: C11 = '+p(A11)+'·'+p(B11)+' + '+p(A12)+'·'+p(B21)+' = '+c11+', C12 = '+c12+', C21 = '+c21+', C22 = '+c22+' ✓');
  s+=ans('C = A × B = '+M([[C11,C12],[C21,C22]])+' &nbsp; (7 multiplications, 18 additions/subtractions)');
  return {q,s};
}};

/* ---------- 7. Traversals / construction ---------- */
function randTree(n){const labels='ABCDEFGHIJKLMNOP'.slice(0,n).split('');const root={v:labels[0]};
  for(let i=1;i<n;i++){let c=root;while(true){const d=Math.random()<0.5?'l':'r';if(!c[d]){c[d]={v:labels[i]};break}c=c[d]}}return root}
G.trav={title:'Tree traversals',topic:'trav',desc:'Read a random binary tree in preorder, inorder, postorder and level order.',
make(){
  let t;do{t=randTree(R(7,10))}while(height(t)>4);
  const q='<p>Write the preorder, inorder, postorder and level-order traversals of the binary tree below.</p>'+treeSVG(t);
  let s=step(1,'<b>Preorder</b> (Root → Left → Right): visit a node the first time you reach it.')+'<p class="hl">'+pre(t).join(' ')+'</p>';
  s+=step(2,'<b>Inorder</b> (Left → Root → Right).')+'<p class="hl">'+ino(t).join(' ')+'</p>';
  s+=step(3,'<b>Postorder</b> (Left → Right → Root).')+'<p class="hl">'+post(t).join(' ')+'</p>';
  s+=step(4,'<b>Level order</b> (breadth first, left to right).')+'<p class="hl">'+level(t).join(' ')+'</p>';
  s+=ans('Pre: '+pre(t).join('')+' &nbsp;|&nbsp; In: '+ino(t).join('')+' &nbsp;|&nbsp; Post: '+post(t).join(''));
  s+='<div class="tip"><b>Check:</b> preorder starts with the root ('+t.v+') and postorder ends with it.</div>';
  return {q,s};
}};
G.construct={title:'Construct tree from traversals',topic:'trav',desc:'Rebuild the unique tree from inorder + preorder or inorder + postorder.',
make(){
  let t;do{t=randTree(R(7,10))}while(height(t)>4);
  const withPre=Math.random()<0.5; const I=ino(t), P=withPre?pre(t):post(t);
  const q='<p>Construct the binary tree from:</p><p><b>Inorder:</b> '+I.join(' ')+'<br><b>'+(withPre?'Preorder':'Postorder')+':</b> '+P.join(' ')+'</p><p>Also write its '+(withPre?'postorder':'preorder')+' traversal.</p>';
  let s='<p><b>Rule:</b> the '+(withPre?'first element of preorder':'last element of postorder')+' is the root; its position in inorder splits the left and right subtrees.</p>';
  let k=0;
  (function build(ino_,ord){if(!ino_.length)return;const r=withPre?ord[0]:ord[ord.length-1];const ix=ino_.indexOf(r);
    const L=ino_.slice(0,ix),Rt=ino_.slice(ix+1);
    s+=step(++k,'Root = <b>'+r+'</b> (from '+(withPre?'preorder':'postorder')+' ['+ord.join(' ')+']). Inorder ['+ino_.join(' ')+'] ⇒ left = {'+(L.join(' ')||'∅')+'}, right = {'+(Rt.join(' ')||'∅')+'}.');
    if(withPre){build(L,ord.slice(1,1+L.length));build(Rt,ord.slice(1+L.length))}
    else {build(L,ord.slice(0,L.length));build(Rt,ord.slice(L.length,ord.length-1))}
  })(I,P);
  s+='<h4>Constructed tree</h4>'+treeSVG(t);
  s+=ans((withPre?'Postorder: '+post(t).join(' '):'Preorder: '+pre(t).join(' ')));
  return {q,s};
}};

/* ---------- 8. BST ---------- */
function bstInsert(root,v,path){if(!root)return {v};let c=root;while(true){path.push(c.v);const d=v<c.v?'l':'r';if(!c[d]){c[d]={v};return root}c=c[d]}}
const clone=n=>n?{v:n.v,l:clone(n.l),r:clone(n.r)}:null;
G.bst={title:'BST construct & delete',topic:'bst',desc:'Insert a key sequence, then delete a leaf, a one-child node and a two-child node.',
make(){
  let keys,root;
  do{keys=uniq(R(9,11),10,99);root=null;keys.forEach(k=>{root=root?bstInsert(root,k,[]):{v:k}})}while(height(root)>5);
  // choose deletions
  const all=[];(function w(n,par){if(!n)return;all.push(n);w(n.l);w(n.r)})(root);
  const leaf=all.filter(n=>!n.l&&!n.r&&n!==root), one=all.filter(n=>(!!n.l)!==(!!n.r)), two=all.filter(n=>n.l&&n.r);
  const dels=[]; if(leaf.length)dels.push(pick(leaf).v); const o1=one.filter(n=>!dels.includes(n.v)); if(o1.length)dels.push(pick(o1).v);
  const q='<p>(a) Construct a BST by inserting the keys in order: <b>'+keys.join(', ')+'</b><br>(b) Write its inorder traversal.<br>(c) Then delete, in order: <b>'+'DELS'+'</b> and draw the tree after each deletion.</p>';
  let s='<h4>(a) Construction</h4>';
  let r2=null; const rows=[];
  keys.forEach((k,i)=>{const path=[];if(!r2){r2={v:k};rows.push([k,'—','Tree empty → becomes root'])}else{bstInsert(r2,k,path);
    const par=path[path.length-1];rows.push([k,path.map(x=>x+(k<x?'(L)':'(R)')).join(' → '),'inserted as '+(k<par?'left':'right')+' child of '+par])}});
  s+=tbl(['Key','Path (compare → go)','Placed'],rows)+treeSVG(r2);
  s+='<h4>(b) Inorder traversal</h4><p class="hl">'+ino(r2).join(', ')+'</p><p>Inorder of a BST is always sorted ✓</p>';
  s+='<h4>(c) Deletions</h4>';
  let cur=clone(r2); let stepn=0;
  function del(n,v,info){if(!n)return null;
    if(v<n.v){n.l=del(n.l,v,info);return n} if(v>n.v){n.r=del(n.r,v,info);return n}
    if(!n.l&&!n.r){info.c='Case 1 — leaf node: simply remove it (set parent\'s pointer to NULL).';return null}
    if(!n.l||!n.r){const ch=n.l||n.r;info.c='Case 2 — one child: replace '+v+' by its only child '+ch.v+' (link parent directly to '+ch.v+').';return ch}
    let su=n.r;while(su.l)su=su.l;info.c='Case 3 — two children: inorder successor = smallest key in right subtree = <b>'+su.v+'</b>. Copy '+su.v+' into the node and delete '+su.v+' from the right subtree.';
    n.v=su.v;n.r=del(n.r,su.v,{});return n}
  // two-child target chosen on current tree (may differ after earlier deletions)
  const seq=dels.slice();
  seq.forEach(v=>{const info={};cur=del(cur,v,info);s+=step(++stepn,'Delete <b>'+v+'</b>. '+info.c)+treeSVG(cur)});
  const allc=[];(function w(n){if(!n)return;allc.push(n);w(n.l);w(n.r)})(cur);
  const t2=allc.filter(n=>n.l&&n.r); if(t2.length){const v=pick(t2).v;seq.push(v);const info={};cur=del(cur,v,info);s+=step(++stepn,'Delete <b>'+v+'</b>. '+info.c)+treeSVG(cur)}
  s+=ans('Final inorder after deletions: '+ino(cur).join(', '));
  return {q:q.replace('DELS',seq.join(', ')),s};
}};

/* ---------- 9. Job sequencing ---------- */
G.jobseq={title:'Job sequencing with deadlines',topic:'jobseq',desc:'Greedy schedule with Gantt-chart slots.',
make(){
  const n=R(5,7); const dmax=Math.min(4,n-1); const P=uniq(n,2,25).map(x=>x*5); const D=Array.from({length:n},()=>R(1,dmax));
  const jobs=P.map((p,i)=>({j:'J'+(i+1),p,d:D[i]}));
  const q='<p>Find the optimal job sequence and maximum profit (each job takes 1 unit of time).</p>'+tbl(['Job',...jobs.map(x=>x.j)],[['Profit',...P],['Deadline',...D]]);
  const sorted=jobs.slice().sort((a,b)=>b.p-a.p); const md=Math.max(...D); const slot=Array(md).fill(null); const rows=[];
  sorted.forEach(x=>{let t=Math.min(md,x.d)-1;while(t>=0&&slot[t])t--;
    if(t>=0){slot[t]=x;rows.push([x.j,x.p,x.d,'['+t+'–'+(t+1)+']','Accept',slot.map(z=>z?z.j:'–').join(' | ')])}
    else rows.push([x.j,x.p,x.d,'none free ≤ '+x.d,'<span class="hlr">Reject</span>',slot.map(z=>z?z.j:'–').join(' | ')])});
  let s=step(1,'Sort jobs in decreasing order of profit:')+tbl(['Job',...sorted.map(x=>x.j)],[['Profit',...sorted.map(x=>x.p)],['Deadline',...sorted.map(x=>x.d)]]);
  s+=step(2,'Maximum deadline = '+md+' ⇒ Gantt chart has '+md+' slots: [0–1] … ['+(md-1)+'–'+md+'].');
  s+=step(3,'Place each job in the latest free slot on or before its deadline:')+tbl(['Job','Profit','Deadline','Slot','Decision','Slots after'],rows);
  const seq=slot.filter(Boolean); const tot=seq.reduce((a,x)=>a+x.p,0);
  s+='<pre class="tree">'+'0'+slot.map((z,i)=>'────'+(z?z.j:'--').padEnd(3)+'───'+(i+1)).join('')+'</pre>';
  s+=ans('Optimal sequence: '+seq.map(x=>x.j).join(' → ')+' &nbsp; Maximum profit = '+seq.map(x=>x.p).join(' + ')+' = '+tot);
  return {q,s};
}};

/* ---------- 10. Fractional knapsack ---------- */
G.knap={title:'Fractional knapsack',topic:'knap',desc:'Greedy by profit/weight ratio with solution vector and exact profit.',
make(){
  const n=R(4,7); const W=Array.from({length:n},()=>R(2,20)); const Pf=Array.from({length:n},()=>R(4,40));
  const totW=W.reduce((a,b)=>a+b,0); const M=Math.max(5,Math.round(totW*(0.45+Math.random()*0.25)));
  const q='<p>Solve the fractional knapsack problem using the greedy method. Capacity <b>M = '+M+'</b>, n = '+n+'.</p>'+tbl(['Item',...W.map((_,i)=>i+1)],[['Profit pᵢ',...Pf],['Weight wᵢ',...W]]);
  const it=W.map((w,i)=>({i:i+1,w,p:Pf[i],r:Pf[i]/w}));
  let s=step(1,'Compute profit/weight ratios:')+tbl(['Item',...it.map(x=>x.i)],[['pᵢ/wᵢ',...it.map(x=>r2(x.r))]]);
  const so=it.slice().sort((a,b)=>b.r-a.r||a.i-b.i);
  s+=step(2,'Arrange in decreasing order of ratio: '+so.map(x=>'I'+x.i).join(', '));
  let rem=M; const x=Array(n).fill('0'); const rows=[]; let num=0; // profit as exact: sum of p*fraction
  let profit=0; const parts=[];
  for(const o of so){ if(rem<=0)break;
    if(o.w<=rem){x[o.i-1]='1';rows.push(['I'+o.i,o.w,o.p,rem,'1 (whole)',o.p,rem-o.w]);profit+=o.p;parts.push(String(o.p));rem-=o.w}
    else {const fr=frac(rem,o.w);x[o.i-1]=fr;const add=o.p*rem/o.w;rows.push(['I'+o.i,o.w,o.p,rem,fr,o.p+' × '+fr+' = '+r2(add),0]);profit+=add;parts.push(r2(add));rem=0}}
  s+=step(3,'Fill the knapsack:')+tbl(['Item','wᵢ','pᵢ','Capacity left','Fraction xᵢ','Profit added','Capacity after'],rows);
  s+=step(4,'Solution vector (x₁ … x'+'ₙ'+') = ('+x.join(', ')+')');
  s+=ans('Maximum profit = '+parts.join(' + ')+' = '+r2(profit));
  s+='<div class="note">Time complexity O(n log n) for sorting by ratio + O(n) for filling.</div>';
  return {q,s};
}};

/* ---------- 11. Huffman ---------- */
G.huffman={title:'Huffman coding',topic:'huffman',desc:'Merge table, tree with 0/1 edges, codes, average length and saving.',
make(){
  const n=R(5,7); const ch='ABCDEFGHIJ'.slice(0,n).split(''); const F=uniq(n,2,45);
  const q='<p>Construct the Huffman tree and find the Huffman code for each character. Also find the average code length, total bits, and the saving compared with a fixed-length code.</p>'+tbl(['Character',...ch],[['Frequency',...F]]);
  let id=0; let Q=ch.map((c,i)=>({v:F[i],c,id:id++}));
  const key=(a,b)=>a.v-b.v||a.id-b.id; const rows=[];
  const show=Q=>Q.slice().sort(key).map(x=>(x.c?x.c+':':'')+x.v).join(', ');
  let k=0;
  while(Q.length>1){Q.sort(key);const x=Q.shift(),y=Q.shift();const z={v:x.v+y.v,l:x,r:y,id:id++};Q.push(z);
    rows.push([++k,(x.c||'('+x.v+')')+' = '+x.v,(y.c||'('+y.v+')')+' = '+y.v,z.v,show(Q)])}
  const root=Q[0]; const codes={};
  (function w(nd,c){if(!nd.l&&!nd.r){codes[nd.c]=c||'0';return}w(nd.l,c+'0');w(nd.r,c+'1')})(root,'');
  let s='<p><b>Method:</b> repeatedly remove the two nodes with smallest frequency, make the smaller one the <b>left (0)</b> child and the other the <b>right (1)</b> child, insert their sum back. (Ties: the node created earlier is taken first.)</p>';
  s+=step(1,'Initial queue: '+show(ch.map((c,i)=>({v:F[i],c,id:i}))));
  s+=step(2,'Merging steps:')+tbl(['Step','Left (0)','Right (1)','New node','Queue after'],rows);
  s+=step(3,'Huffman tree (left edge = 0, right edge = 1):')+treeSVG(root,{edgeBits:true,label:nd=>nd.v,under:nd=>nd.c,gap:50});
  const tot=ch.reduce((a,c,i)=>a+F[i]*codes[c].length,0), sumF=F.reduce((a,b)=>a+b,0), fixed=Math.ceil(Math.log2(n));
  s+=step(4,'Codes:')+tbl(['Char','Freq','Code','Length','Freq × Length'],ch.map((c,i)=>[c,F[i],'<b>'+codes[c]+'</b>',codes[c].length,F[i]*codes[c].length]).concat([['<b>Total</b>','<b>'+sumF+'</b>','','','<b>'+tot+'</b>']]));
  s+=step(5,'Average code length = Σ(f × len)/Σf = '+tot+'/'+sumF+' = <b>'+(tot/sumF).toFixed(3)+'</b> bits/char.');
  s+=step(6,'Fixed-length code needs ⌈log₂'+n+'⌉ = '+fixed+' bits/char ⇒ '+fixed+' × '+sumF+' = '+fixed*sumF+' bits. Saving = ('+fixed*sumF+' − '+tot+')/'+fixed*sumF+' × 100 = <b>'+((fixed*sumF-tot)/(fixed*sumF)*100).toFixed(2)+'%</b>.');
  s+=ans('Total Huffman bits = '+tot+', average = '+(tot/sumF).toFixed(3)+' bits/char');
  s+='<div class="tip"><b>Exam tip:</b> Different tie-breaking gives different codes, but the total number of bits is always the same. Always state your left/right convention.</div>';
  return {q,s};
}};

window.GEN=G; window.treeSVG=treeSVG;
})();

    '<div class="row" style="margin-top:12px;justify-content:center"><button class="btn" id="fp">← Prev</button><button class="btn red" id="fno">Still learning</button><button class="btn primary" id="fyes">Got it ✓</button><button class="btn" id="fn">Next →</button></div>');
    const fc=$('#fc');const flip=()=>{flipped=!flipped;fc.classList.toggle('flipped',flipped)};fc.onclick=flip;
    fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev()};
    const next=()=>{i=(i+1)%deck.length;flipped=false;draw();$('#fc').focus()},prev=()=>{i=(i-1+deck.length)%deck.length;flipped=false;draw();$('#fc').focus()};
    $('#fn').onclick=next;$('#fp').onclick=prev;
    $('#fyes').onclick=()=>{known[c.id]=1;S.set('known',known);next()};$('#fno').onclick=()=>{known[c.id]=0;S.set('known',known);next()};
    $('#fsh').onclick=()=>{deck=shuffle(deck);i=0;flipped=false;draw()};
    $('#fun').onclick=()=>{const u=cards.filter(x=>!known[x.id]);if(!u.length){toast('All cards in this set are marked known');return}deck=u;i=0;flipped=false;draw()};
    $('#fall').onclick=()=>{deck=cards.slice();i=0;flipped=false;draw()}};
  draw()}

function runTest(qs,mins){clearTimers();let i=0;const ans={},flag={};let end=Date.now()+mins*60000;let confirmSubmit=false;

/* ---------- Mock paper ---------- */
const PATTERNS={half:{name:'Mid-term style · 50 marks · 90 min',mins:90,secs:[['A','Answer all',2,5],['B','Answer all',5,4],['C','Answer all',10,2]]},
  full:{name:'End-term style · 100 marks · 3 hours',mins:180,secs:[['A','Answer all',2,10],['B','Answer all',5,8],['C','Answer all',10,4]]}};
function buildPaper(p){const used=new Set();const paper=[];
  p.secs.forEach(([sec,ins,m,cnt])=>{let pool=ALLQ.filter(q=>q.marks===m&&!used.has(q.id));
    if(pool.length<cnt)pool=pool.concat(ALLQ.filter(q=>Math.abs(q.marks-m)<=3&&!used.has(q.id)&&!pool.includes(q)));
    // round robin across units, then topics
    const byU={};shuffle(pool).forEach(q=>{const u=byId[q.topic].unit;(byU[u]=byU[u]||[]).push(q)});
    const out=[];const units=shuffle(Object.keys(byU));let k=0,guard=0;const tUsed={};
    while(out.length<cnt&&guard<500){guard++;const u=units[k++%units.length];const L=byU[u];if(!L||!L.length)continue;
      let ix=L.findIndex(q=>!tUsed[q.topic]);if(ix<0)ix=0;const q=L.splice(ix,1)[0];tUsed[q.topic]=1;out.push(q);used.add(q.id)}
    paper.push({sec,ins,m,qs:out})});return paper}
function viewPaper(){clearTimers();
  let h='<div class="wrap"><div><div class="eyebrow">Write it on paper</div><h1 class="page-title">Mock exam paper</h1><p class="muted" style="margin:6px 0 0">A fresh paper is drawn from the question bank, balanced across all four units. Write your answers on paper against the timer, then reveal the model answers and mark yourself.</p></div><div class="grid g2">';
  Object.entries(PATTERNS).forEach(([k,p])=>{h+='<div class="card"><h3 style="font-size:18px">'+p.name+'</h3><ul style="margin:8px 0;padding-left:20px">'+p.secs.map(s=>'<li>Section '+s[0]+': '+s[3]+' × '+s[2]+' marks</li>').join('')+'</ul><button class="btn primary" data-pat="'+k+'">Generate paper</button></div>'});
  h+='</div></div>';setHTML(main,h);
  main.querySelectorAll('[data-pat]').forEach(b=>b.onclick=()=>runPaper(PATTERNS[b.dataset.pat]))}
function runPaper(p){clearTimers();const paper=buildPaper(p);const total=paper.reduce((a,s)=>a+s.qs.reduce((x,q)=>x+s.m,0),0);
  let end=Date.now()+p.mins*60000, evaluating=false; const marks={};
  const draw=()=>{let n=0;
    let h='<div class="wrap"><div class="row"><div><div class="eyebrow">Mock paper · Design & Analysis of Algorithms (E1UA306B)</div><h2 style="font-size:22px">'+p.name+'</h2></div><span class="spacer"></span>'+(evaluating?'':'<div class="timer" id="tm"></div>')+'</div>';
    h+='<div class="card"><p style="margin:0"><b>Instructions:</b> Attempt all questions. Assume missing data suitably. Draw diagrams where needed. Total marks: '+total+'.</p></div>';
    paper.forEach(s=>{h+='<h3 style="font-size:19px;margin-top:4px">Section '+s.sec+' <span class="muted" style="font-size:14px;font-weight:400">('+s.qs.length+' × '+s.m+' = '+s.qs.length*s.m+' marks)</span></h3>';
      s.qs.forEach(q=>{n++;h+='<div class="card qcard"><div class="qhead"><span class="qnum">Q'+n+'</span><span class="chip marks">'+s.m+' marks</span><span class="chip">'+esc(byId[q.topic].title)+'</span></div><div class="rich qtext">'+q.q+'</div>';
        if(evaluating){h+='<div class="sol rich"><div class="sol-label">Model answer</div>'+q.s+'</div><div class="row"><span class="muted" style="font-size:13px">Your marks:</span>'+[[1,'Full'],[0.5,'Half'],[0,'Zero']].map(([f,l])=>'<button class="btn small'+(marks[q.id]===f?' primary':'')+'" data-mk="'+q.id+'" data-f="'+f+'">'+l+' ('+(s.m*f)+')</button>').join('')+'</div>'}
        h+='</div>'})});
    if(!evaluating)h+='<div class="row"><button class="btn red" id="pfin">Finish & see model answers</button><button class="btn" id="pnew">New paper</button></div>';
    else{const got=paper.reduce((a,s)=>a+s.qs.reduce((x,q)=>x+(marks[q.id]||0)*s.m,0),0);
      h+='<div class="card"><div class="row"><b>Self-assessed score: '+got+' / '+total+'</b> <span class="muted">('+Math.round(got/total*100)+'%)</span><span class="spacer"></span><button class="btn primary" id="pnew">New paper</button></div></div>'}
    h+='</div>';setHTML(main,h);
    if($('#pfin'))$('#pfin').onclick=()=>{evaluating=true;clearTimers();draw();window.scrollTo(0,0)};
    $('#pnew').onclick=()=>viewPaper();
    main.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{marks[b.dataset.mk]=+b.dataset.f;const y=window.scrollY;draw();window.scrollTo(0,y)});
    if(!evaluating)tick()};
  const tick=()=>{const left=Math.max(0,end-Date.now());const el=$('#tm');if(el)el.textContent=String(Math.floor(left/3600000))+':'+String(Math.floor(left%3600000/60000)).padStart(2,'0')+':'+String(Math.floor(left%60000/1000)).padStart(2,'0');if(left<=0&&!evaluating){evaluating=true;clearTimers();draw();toast('Time is up')}};
  timers.push(setInterval(tick,1000));draw();window.scrollTo(0,0)}

/* ---------- Bank ---------- */
let bankF={u:'',t:'',type:'',marks:'',st:'',q:''};
function viewBank(){
  let h='<div class="wrap"><div><div class="eyebrow">'+ALLQ.length+' questions with model answers</div><h1 class="page-title">Question bank</h1></div>';
  h+='<div class="card row"><select id="bu"><option value="">All units</option>'+[1,2,3,4].map(u=>'<option value="'+u+'"'+(bankF.u==u?' selected':'')+'>Unit '+u+'</option>').join('')+'</select><select id="bt"><option value="">All topics</option>'+T.filter(t=>!bankF.u||t.unit==bankF.u).map(t=>'<option value="'+t.id+'"'+(bankF.t===t.id?' selected':'')+'>'+esc(t.title)+'</option>').join('')+'</select><select id="bty"><option value="">Theory + numerical</option><option value="theory"'+(bankF.type==='theory'?' selected':'')+'>Theory</option><option value="numerical"'+(bankF.type==='numerical'?' selected':'')+'>Numerical</option></select><select id="bm"><option value="">All marks</option>'+[2,5,10].map(m=>'<option'+(bankF.marks==m?' selected':'')+'>'+m+'</option>').join('')+'</select><select id="bs"><option value="">Solved + unsolved</option><option value="un"'+(bankF.st==='un'?' selected':'')+'>Unsolved</option><option value="so"'+(bankF.st==='so'?' selected':'')+'>Solved</option></select><input type="text" id="bq" placeholder="Search…" value="'+esc(bankF.q)+'" style="flex:1;min-width:140px"></div><div id="blist"></div></div>';
  setHTML(main,h);
  const list=()=>{const qq=bankF.q.toLowerCase();const L=ALLQ.filter(q=>(!bankF.u||byId[q.topic].unit==bankF.u)&&(!bankF.t||q.topic===bankF.t)&&(!bankF.type||q.type===bankF.type)&&(!bankF.marks||q.marks==bankF.marks)&&(!bankF.st||(bankF.st==='so')===!!solved[q.id])&&(!qq||q.q.toLowerCase().includes(qq)));
    const el=$('#blist');setHTML(el,'<p class="muted" style="font-size:13px;margin:0 0 10px">'+L.length+' questions</p><div class="grid">'+L.map((q,i)=>qCard(q,i+1,{showTopic:true})).join('')+'</div>'+(L.length?'':'<div class="empty">No questions match these filters.</div>'));bindQ(el,L)};
  $('#bu').onchange=e=>{bankF.u=e.target.value;bankF.t='';viewBank()};$('#bt').onchange=e=>{bankF.t=e.target.value;list()};$('#bty').onchange=e=>{bankF.type=e.target.value;list()};$('#bm').onchange=e=>{bankF.marks=e.target.value;list()};$('#bs').onchange=e=>{bankF.st=e.target.value;list()};
  let tmo;$('#bq').oninput=e=>{clearTimeout(tmo);tmo=setTimeout(()=>{bankF.q=e.target.value;list()},200)};list()}

/* ---------- Formulas ---------- */
const COMPLEX=[['Binary search','Θ(1)','Θ(log n)','Θ(log n)','Θ(1) iter / Θ(log n) rec','T(n)=T(n/2)+1'],['Merge sort','Θ(n log n)','Θ(n log n)','Θ(n log n)','Θ(n)','T(n)=2T(n/2)+n'],['Quick sort','Θ(n log n)','Θ(n log n)','Θ(n²)','Θ(log n) avg / Θ(n) worst','T(n)=2T(n/2)+n ; T(n)=T(n−1)+n'],['Max–min (D&C)','3n/2 − 2 comparisons','—','—','Θ(log n)','T(n)=2T(n/2)+2'],['Conventional matrix mult.','Θ(n³)','Θ(n³)','Θ(n³)','—','T(n)=8T(n/2)+n²'],['Strassen','Θ(n^2.81)','Θ(n^2.81)','Θ(n^2.81)','—','T(n)=7T(n/2)+n²'],['BST search/insert/delete','Θ(1)','Θ(log n)','Θ(n) (skewed)','Θ(h)','—'],['Tree traversal','Θ(n)','Θ(n)','Θ(n)','Θ(h) stack','T(n)=T(k)+T(n−k−1)+1'],['Job sequencing','—','—','O(n²)','O(n)','sort + slot search'],['Fractional knapsack','—','—','O(n log n)','O(n)','sort by p/w'],['Huffman coding','—','—','O(n log n)','O(n)','n−1 merges with heap']];
function viewFormulas(){
  let h='<div class="wrap"><div><div class="eyebrow">One-page revision</div><h1 class="page-title">Formula sheet</h1></div>';
  h+='<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Complexity summary</h2><div class="tablewrap"><table class="t"><tr><th>Algorithm</th><th>Best</th><th>Average</th><th>Worst</th><th>Space</th><th>Recurrence / note</th></tr>'+COMPLEX.map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i?c:'<b>'+c+'</b>')+'</td>').join('')+'</tr>').join('')+'</table></div></div>';
  h+='<div class="card"><h2 style="font-size:20px;margin-bottom:8px">Order of growth</h2><p class="f" style="font-family:var(--f-mono);overflow-x:auto;white-space:nowrap;margin:0">1 &lt; log log n &lt; log n &lt; √n &lt; n &lt; n log n &lt; n² &lt; n³ &lt; 2ⁿ &lt; 3ⁿ &lt; n! &lt; nⁿ</p></div>';
  [1,2,3,4].forEach(u=>{h+='<div class="unit-head"><span class="eyebrow">Unit '+u+'</span><h2>'+UNITS[u]+'</h2></div>';
    T.filter(t=>t.unit===u).forEach(t=>{h+='<div class="card"><h3 style="font-size:17px;margin-bottom:6px"><a href="#t-'+t.id+'" style="color:inherit">'+esc(t.title)+'</a></h3>'+t.formulas.map(f=>'<div class="formula-row"><div><b>'+f.name+'</b></div><div><div class="f">'+f.f+'</div>'+(f.note?'<div class="n">'+f.note+'</div>':'')+'</div></div>').join('')+'</div>'})});
  h+='</div>';setHTML(main,h)}

/* ---------- Lab ---------- */
function genPanel(container,key){const g=GEN[key];const d=document.createElement('div');d.className='card qcard';container.appendChild(d);
  const run=()=>{const p=g.make();d.innerHTML='<div class="qhead"><h3 style="font-size:18px">'+esc(g.title)+'</h3><span class="spacer"></span><a class="chip" href="#t-'+g.topic+'">'+esc(byId[g.topic].title)+'</a></div><div class="rich qtext">'+p.q+'</div><div class="row"><button class="btn small" data-sh>Show solution</button><button class="btn small primary" data-nw>New problem</button></div><div class="sol rich" hidden><div class="sol-label">Step-by-step solution</div>'+p.s+'</div>';
    enhance(d);const sb=d.querySelector('[data-sh]'),sol=d.querySelector('.sol');sb.onclick=()=>{sol.hidden=!sol.hidden;sb.textContent=sol.hidden?'Show solution':'Hide solution'};d.querySelector('[data-nw]').onclick=run};
  run()}
function viewLab(){
  let h='<div class="wrap"><div><div class="eyebrow">Unlimited numericals</div><h1 class="page-title">Numerical lab</h1><p class="muted" style="margin:6px 0 0">Every press of <b>New problem</b> makes a fresh question with new numbers. Solve it on paper first, then open the step-by-step solution, written the way you should write it in the exam.</p></div>';
  h+='<div class="row">'+Object.entries(GEN).map(([k,g])=>'<a class="chip" href="#lab-'+k+'">'+esc(g.title)+'</a>').join('')+'</div><div class="grid" id="labs"></div></div>';
  setHTML(main,h);Object.keys(GEN).forEach(k=>{genPanel($('#labs'),k);$('#labs').lastChild.id='lab-'+k})}

/* ---------- router ---------- */
function route(){clearTimers();const h=(location.hash||'#home').slice(1);let active=h;
  if(h.startsWith('t-'))viewTopic(h.slice(2));
  else if(h==='bank')viewBank();else if(h==='flash')viewFlash();else if(h==='mcq')viewMCQ();else if(h==='paper')viewPaper();else if(h==='formulas')viewFormulas();
  else if(h==='lab'||h.startsWith('lab-')){active='lab';viewLab();if(h.startsWith('lab-')){const el=document.getElementById(h);if(el){el.scrollIntoView();return renderRail(active)}}}
  else {active='home';viewHome()}
  renderRail(active);$('#rail').classList.remove('open');window.scrollTo(0,0)}
window.addEventListener('hashchange',route);
$('#menu').onclick=()=>$('#rail').classList.toggle('open');
document.addEventListener('click',e=>{const r=$('#rail');if(r.classList.contains('open')&&!r.contains(e.target)&&!e.target.closest('#menu'))r.classList.remove('open')});
route();
})();
</script>
