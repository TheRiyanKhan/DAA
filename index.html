 "weight": "High",
 "summary": "Partition around a pivot (last element, Lomuto), recurse on both sides: Θ(n log n) average, Θ(n²) worst, in-place, not stable.",
 "notes": "\n<h3>1. Introduction</h3>\n<div class=\"def\"><b>Definition:</b> <b>Quick Sort</b> is a comparison-based, divide-and-conquer sorting algorithm that selects an element called the <b>pivot</b>, <b>partitions</b> the array so that all elements ≤ pivot are on its left and all elements &gt; pivot are on its right (the pivot reaches its final sorted position), and then recursively sorts the two sub-arrays. It was developed by <b>C.A.R. Hoare (1960)</b>.</div>\n<p>Average time is Θ(n log n), worst case is Θ(n²). It sorts <b>in place</b> (only the recursion stack is extra) and is usually the fastest sort in practice because its inner loop is very simple and cache friendly.</p>\n\n<h3>2. Divide – Conquer – Combine in Quick Sort</h3>\n<table class=\"t\">\n<tr><th>Phase</th><th>What Quick Sort does</th></tr>\n<tr><td><b>Divide</b></td><td>Choose pivot (last element). PARTITION rearranges A[low..high] into A[low..q−1] ≤ A[q] &lt; A[q+1..high]. All the real work is done here.</td></tr>\n<tr><td><b>Conquer</b></td><td>Recursively sort A[low..q−1] and A[q+1..high].</td></tr>\n<tr><td><b>Combine</b></td><td>Nothing to do — sub-arrays are sorted in place, so the whole array is sorted.</td></tr>\n</table>\n<div class=\"note\">Contrast: in <b>Merge Sort</b> the <i>divide</i> step is trivial and the <i>combine</i> (merge) step does the work; in <b>Quick Sort</b> the <i>divide</i> (partition) step does the work and <i>combine</i> is trivial.</div>\n\n<h3>3. Algorithm (as in the lecture — Lomuto partition, pivot = last element)</h3>\n<pre class=\"code\">QUICKSORT(A, low, high)\n1.  IF low &lt; high THEN\n2.      q ← PARTITION(A, low, high)      // pivot placed at index q\n3.      QUICKSORT(A, low, q − 1)          // sort left part\n4.      QUICKSORT(A, q + 1, high)         // sort right part\n5.  END IF                                 // else: 0 or 1 element → already sorted\n\nPARTITION(A, low, high)                   // Lomuto partition\n1.  pivot ← A[high]                        // last element is the pivot\n2.  i ← low − 1                            // i = end of the \"≤ pivot\" region\n3.  FOR j ← low TO high − 1 DO\n4.      IF A[j] ≤ pivot THEN\n5.          i ← i + 1\n6.          SWAP A[i] and A[j]\n7.      END IF\n8.  END FOR\n9.  SWAP A[i + 1] and A[high]              // put pivot in its final place\n10. RETURN i + 1\n\nInitial call: QUICKSORT(A, 0, n − 1)</pre>\n<h4>Invariant of PARTITION (why it is correct)</h4>\n<p>At the start of each iteration of the FOR loop, for any index k:</p>\n<ul>\n<li>If low ≤ k ≤ i, then A[k] ≤ pivot.</li>\n<li>If i+1 ≤ k ≤ j−1, then A[k] &gt; pivot.</li>\n<li>If k = high, then A[k] = pivot.</li>\n</ul>\n<p>When the loop ends (j = high), the array is split into three regions; swapping A[i+1] with A[high] puts the pivot between them. PARTITION makes exactly <b>(high − low)</b> comparisons, so it takes <b>Θ(n)</b> time.</p>\n\n<h3>4. Fully worked example</h3>\n<p>Sort A = [2, 8, 7, 1, 3, 5, 6, 4] using Quick Sort.</p>\n<div class=\"step\"><b>Given:</b> A = [2, 8, 7, 1, 3, 5, 6, 4], n = 8 (indices 0 to 7). Pivot = last element (Lomuto partition).</div><div class=\"step\"><b>Step 1: PARTITION(A, 0, 7)</b>, pivot = 4</div><table class=\"t\"><tr><th>j</th><th>A[j]</th><th>A[j] ≤ 4 ?</th><th>Action</th><th>i</th><th>Array after step</th></tr><tr><td>–</td><td>–</td><td>–</td><td>pivot = A[7] = 4, i = low−1</td><td>-1</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>0</td><td>2</td><td>Yes</td><td>i←0; swap A[0] with itself</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>1</td><td>8</td><td>No</td><td>no change</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>2</td><td>7</td><td>No</td><td>no change</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>3</td><td>1</td><td>Yes</td><td>i←1; swap A[1]=8 ↔ A[3]=1</td><td>1</td><td>[2, 1, 7, 8, 3, 5, 6, 4]</td></tr><tr><td>4</td><td>3</td><td>Yes</td><td>i←2; swap A[2]=7 ↔ A[4]=3</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>5</td><td>5</td><td>No</td><td>no change</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>6</td><td>6</td><td>No</td><td>no change</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>end</td><td>–</td><td>–</td><td>Place pivot: swap A[3]=8 ↔ A[7]=4</td><td>2</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr></table><p>Pivot 4 is now at its final position q = 3. Left sub-array: A[0..2] (elements ≤ 4); right sub-array: A[4..7] (elements &gt; 4).</p><div class=\"step\"><b>Step 2: Recursive calls</b> (calls with low ≥ high are base cases and return immediately)</div><table class=\"t\"><tr><th>#</th><th>Call QUICKSORT(A, low, high)</th><th>Pivot</th><th>Pivot final index q</th><th>Array after partition</th></tr><tr><td>1</td><td>QS(0, 7)</td><td>4</td><td>3</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>2</td><td>&nbsp;&nbsp;QS(0, 2)</td><td>3</td><td>2</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>3</td><td>&nbsp;&nbsp;&nbsp;&nbsp;QS(0, 1)</td><td>1</td><td>0</td><td>[1, 2, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>4</td><td>&nbsp;&nbsp;QS(4, 7)</td><td>8</td><td>7</td><td>[1, 2, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>5</td><td>&nbsp;&nbsp;&nbsp;&nbsp;QS(4, 6)</td><td>6</td><td>5</td><td>[1, 2, 3, 4, 5, 6, 7, 8]</td></tr></table><div class=\"ans\">Final answer: Sorted array = [1, 2, 3, 4, 5, 6, 7, 8] &nbsp;(5 partition calls, 15 key comparisons)</div>\n<pre class=\"tree\">Recursion tree (pivot shown, sub-arrays below)\n                    [2 8 7 1 3 5 6 4]  pivot 4\n                    /                \\\n            [2 1 3]  pivot 3        [7 5 6 8]  pivot 8\n             /                        /\n       [2 1] pivot 1             [7 5 6] pivot 6\n             \\                    /     \\\n             [2]                [5]     [7]</pre>\n\n<h3>5. Time complexity analysis</h3>\n<p>Let partition split n elements into sizes k and n−k−1. Then <b>T(n) = T(k) + T(n−k−1) + Θ(n)</b>.</p>\n<h4>(a) Best case — pivot always splits into two equal halves</h4>\n<p>T(n) = 2T(n/2) + Θ(n). Master theorem: a = 2, b = 2, n<sup>log<sub>2</sub>2</sup> = n, f(n) = Θ(n) → Case 2 → <b>T(n) = Θ(n log n)</b>.</p>\n<h4>(b) Worst case — pivot is always the smallest or largest element</h4>\n<p>Happens when the array is <b>already sorted</b> or <b>reverse sorted</b> (with pivot = last element), or all elements are equal. One side gets n−1 elements and the other gets 0:</p>\n<p>T(n) = T(n−1) + T(0) + Θ(n) = T(n−1) + cn</p>\n<p>Expanding: T(n) = cn + c(n−1) + c(n−2) + … + c·1 = c · n(n+1)/2 ⇒ <b>T(n) = Θ(n²)</b>.</p>\n<p>Exact comparisons in the worst case = (n−1) + (n−2) + … + 1 = <b>n(n−1)/2</b>.</p>\n<h4>(c) Average case</h4>\n<p>Even a constant-proportion split such as 9:1 gives T(n) = T(9n/10) + T(n/10) + cn. The recursion tree has depth log<sub>10/9</sub> n = Θ(log n) and each level costs at most cn ⇒ <b>Θ(n log n)</b>. Averaged over all n! permutations, the expected number of comparisons is about <b>1.39 n log₂ n</b> (≈ 2n ln n).</p>\n<h4>(d) Space complexity</h4>\n<p>In-place: no extra array. Only the recursion stack: <b>O(log n)</b> in best/average case, <b>O(n)</b> in the worst case (can be limited to O(log n) by always recursing on the smaller part first).</p>\n\n<table class=\"t\">\n<tr><th>Case</th><th>When</th><th>Recurrence</th><th>Time</th></tr>\n<tr><td>Best</td><td>Pivot is the median each time</td><td>T(n)=2T(n/2)+Θ(n)</td><td>Θ(n log n)</td></tr>\n<tr><td>Average</td><td>Random input / balanced splits</td><td>T(n)=T(9n/10)+T(n/10)+Θ(n) (any constant ratio)</td><td>Θ(n log n)</td></tr>\n<tr><td>Worst</td><td>Sorted / reverse sorted input, pivot = last</td><td>T(n)=T(n−1)+Θ(n)</td><td>Θ(n²)</td></tr>\n<tr><td>Space</td><td>Recursion stack</td><td>—</td><td>O(log n) avg, O(n) worst</td></tr>\n</table>\n\n<h3>6. Randomized Quick Sort (avoiding the worst case)</h3>\n<p>Choose the pivot <b>randomly</b> from A[low..high] (swap it with A[high], then call the normal PARTITION). Now no particular input (e.g. sorted) is always bad; the <b>expected</b> running time is Θ(n log n) for every input. Other pivot rules: <b>median-of-three</b> (median of first, middle, last).</p>\n<pre class=\"code\">RANDOMIZED-PARTITION(A, low, high)\n1. k ← RANDOM(low, high)\n2. SWAP A[k] and A[high]\n3. RETURN PARTITION(A, low, high)</pre>\n\n<h3>7. Properties</h3>\n<ul>\n<li><b>In-place:</b> Yes (O(1) extra apart from the stack).</li>\n<li><b>Stable:</b> <b>No</b> — long-distance swaps can change the relative order of equal keys. E.g. [3<sub>a</sub>, 3<sub>b</sub>, 1] with pivot 1 → swap puts 1 first and 3<sub>a</sub> at the end: [1, 3<sub>b</sub>, 3<sub>a</sub>].</li>\n<li><b>Adaptive:</b> No — sorted input is its worst case (with last-element pivot).</li>\n<li><b>Comparison based</b>, so it cannot beat Ω(n log n) on average.</li>\n</ul>\n\n<h3>8. Quick Sort vs Merge Sort</h3>\n<table class=\"t\">\n<tr><th>Point</th><th>Quick Sort</th><th>Merge Sort</th></tr>\n<tr><td>Strategy</td><td>Partition (hard divide), trivial combine</td><td>Trivial divide, merge (hard combine)</td></tr>\n<tr><td>Best / Avg / Worst</td><td>n log n / n log n / <b>n²</b></td><td>n log n in <b>all</b> cases</td></tr>\n<tr><td>Extra space</td><td>O(log n) stack — in-place</td><td>O(n) auxiliary array — not in-place</td></tr>\n<tr><td>Stable</td><td>No</td><td>Yes</td></tr>\n<tr><td>Split</td><td>Depends on pivot (may be unbalanced)</td><td>Always into halves</td></tr>\n<tr><td>Best suited for</td><td>Arrays in RAM, average-case speed</td><td>Linked lists, external sorting, guaranteed time</td></tr>\n</table>\n\n<h3>9. Advantages and disadvantages</h3>\n<ul>\n<li><b>Advantages:</b> fastest in practice (small constant), in-place, cache-friendly, easy to parallelise the two recursive calls.</li>\n<li><b>Disadvantages:</b> Θ(n²) worst case, not stable, recursive (stack overflow risk on bad input), performance depends on pivot choice.</li>\n</ul>\n\n<div class=\"tip\"><b>Exam tip:</b> (1) Always write the PARTITION trace as a table with columns j, A[j], comparison, i and the array. (2) State the pivot rule you are using (last element). (3) For worst case write T(n)=T(n−1)+n and expand to n(n+1)/2 ⇒ Θ(n²). (4) Common mistake: forgetting the final swap of A[i+1] with the pivot, or swapping when A[j] &gt; pivot.</div>\n",

   "s": "<div class=\"step\"><b>Algorithm (Lomuto partition, pivot = last element):</b></div>\n<pre class=\"code\">PARTITION(A, low, high)\n1.  pivot ← A[high]\n2.  i ← low − 1\n3.  FOR j ← low TO high − 1 DO\n4.      IF A[j] ≤ pivot THEN\n5.          i ← i + 1\n6.          SWAP A[i] and A[j]\n7.  SWAP A[i + 1] and A[high]\n8.  RETURN i + 1</pre>\n<div class=\"step\"><b>Working:</b> i marks the end of the region of elements ≤ pivot. j scans every element; when A[j] ≤ pivot, the region grows by one (i ← i+1) and A[j] is swapped into it. Elements &gt; pivot stay between i+1 and j−1. Finally the pivot is swapped into position i+1, between the two regions.</div>\n<div class=\"step\"><b>Loop invariant:</b> A[low..i] ≤ pivot, A[i+1..j−1] &gt; pivot, A[high] = pivot.</div>\n<div class=\"step\"><b>Complexity:</b> the loop runs high − low = n − 1 times with O(1) work ⇒ <b>Θ(n)</b> time, <b>O(1)</b> extra space.</div>\n<div class=\"ans\">PARTITION places the pivot at its final index q in Θ(n) time and returns q.</div>"

   "q": "Explain the Quick Sort algorithm with its algorithm, an example, and complete time and space complexity analysis.",
   "s": "<div class=\"def\"><b>Definition:</b> Quick Sort is a divide-and-conquer sorting algorithm which partitions the array around a pivot so that the pivot reaches its final position, and then recursively sorts the left and right parts.</div>\n<div class=\"step\"><b>1. Divide–Conquer–Combine:</b> Divide = PARTITION around pivot A[high]; Conquer = sort both parts recursively; Combine = nothing.</div>\n<div class=\"step\"><b>2. Algorithm:</b></div>\n<pre class=\"code\">QUICKSORT(A, low, high)\n1.  IF low &lt; high THEN\n2.      q ← PARTITION(A, low, high)      // pivot placed at index q\n3.      QUICKSORT(A, low, q − 1)          // sort left part\n4.      QUICKSORT(A, q + 1, high)         // sort right part\n5.  END IF                                 // else: 0 or 1 element → already sorted\n\nPARTITION(A, low, high)                   // Lomuto partition\n1.  pivot ← A[high]                        // last element is the pivot\n2.  i ← low − 1                            // i = end of the \"≤ pivot\" region\n3.  FOR j ← low TO high − 1 DO\n4.      IF A[j] ≤ pivot THEN\n5.          i ← i + 1\n6.          SWAP A[i] and A[j]\n7.      END IF\n8.  END FOR\n9.  SWAP A[i + 1] and A[high]              // put pivot in its final place\n10. RETURN i + 1\n\nInitial call: QUICKSORT(A, 0, n − 1)</pre>\n<div class=\"step\"><b>3. Example:</b> A = [2, 8, 7, 1, 3, 5, 6, 4]</div><div class=\"step\"><b>Given:</b> A = [2, 8, 7, 1, 3, 5, 6, 4], n = 8 (indices 0 to 7). Pivot = last element (Lomuto partition).</div><div class=\"step\"><b>Step 1: PARTITION(A, 0, 7)</b>, pivot = 4</div><table class=\"t\"><tr><th>j</th><th>A[j]</th><th>A[j] ≤ 4 ?</th><th>Action</th><th>i</th><th>Array after step</th></tr><tr><td>–</td><td>–</td><td>–</td><td>pivot = A[7] = 4, i = low−1</td><td>-1</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>0</td><td>2</td><td>Yes</td><td>i←0; swap A[0] with itself</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>1</td><td>8</td><td>No</td><td>no change</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>2</td><td>7</td><td>No</td><td>no change</td><td>0</td><td>[2, 8, 7, 1, 3, 5, 6, 4]</td></tr><tr><td>3</td><td>1</td><td>Yes</td><td>i←1; swap A[1]=8 ↔ A[3]=1</td><td>1</td><td>[2, 1, 7, 8, 3, 5, 6, 4]</td></tr><tr><td>4</td><td>3</td><td>Yes</td><td>i←2; swap A[2]=7 ↔ A[4]=3</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>5</td><td>5</td><td>No</td><td>no change</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>6</td><td>6</td><td>No</td><td>no change</td><td>2</td><td>[2, 1, 3, 8, 7, 5, 6, 4]</td></tr><tr><td>end</td><td>–</td><td>–</td><td>Place pivot: swap A[3]=8 ↔ A[7]=4</td><td>2</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr></table><p>Pivot 4 is now at its final position q = 3. Left sub-array: A[0..2] (elements ≤ 4); right sub-array: A[4..7] (elements &gt; 4).</p><div class=\"step\"><b>Step 2: Recursive calls</b> (calls with low ≥ high are base cases and return immediately)</div><table class=\"t\"><tr><th>#</th><th>Call QUICKSORT(A, low, high)</th><th>Pivot</th><th>Pivot final index q</th><th>Array after partition</th></tr><tr><td>1</td><td>QS(0, 7)</td><td>4</td><td>3</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>2</td><td>&nbsp;&nbsp;QS(0, 2)</td><td>3</td><td>2</td><td>[2, 1, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>3</td><td>&nbsp;&nbsp;&nbsp;&nbsp;QS(0, 1)</td><td>1</td><td>0</td><td>[1, 2, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>4</td><td>&nbsp;&nbsp;QS(4, 7)</td><td>8</td><td>7</td><td>[1, 2, 3, 4, 7, 5, 6, 8]</td></tr><tr><td>5</td><td>&nbsp;&nbsp;&nbsp;&nbsp;QS(4, 6)</td><td>6</td><td>5</td><td>[1, 2, 3, 4, 5, 6, 7, 8]</td></tr></table><div class=\"ans\">Final answer: Sorted array = [1, 2, 3, 4, 5, 6, 7, 8] &nbsp;(5 partition calls, 15 key comparisons)</div>\n<div class=\"step\"><b>4. Time complexity:</b><br>\n• Best case (balanced): T(n) = 2T(n/2) + n ⇒ Θ(n log n) (Master Case 2).<br>\n• Worst case (sorted input): T(n) = T(n−1) + n = n(n+1)/2 ⇒ Θ(n²).<br>\n• Average case: T(n) = Θ(n log n) (≈1.39 n log₂ n comparisons).</div>\n<div class=\"step\"><b>5. Space:</b> in-place; recursion stack O(log n) average, O(n) worst.</div>\n<div class=\"step\"><b>6. Properties:</b> not stable, in-place, not adaptive; randomized pivot avoids worst case in expectation.</div>\n<div class=\"step\"><b>7. Advantages:</b> fastest in practice, little memory, cache-friendly. <b>Disadvantages:</b> Θ(n²) worst case, unstable, pivot-sensitive.</div>\n<div class=\"ans\">Conclusion: Quick Sort sorts in Θ(n log n) on average with O(log n) extra space, but degrades to Θ(n²) for badly chosen pivots.</div>"

 "id": "merge",
 "unit": 2,
 "title": "Merge Sort",
 "lectures": "L15",
 "weight": "High",
 "summary": "Split into halves, sort recursively, merge in Θ(n): T(n)=2T(n/2)+n = Θ(n log n) in every case; stable; Θ(n) extra space.",
 "notes": "\n<h3>1. Introduction</h3>\n<div class=\"def\"><b>Definition:</b> <b>Merge Sort</b> is a comparison-based divide-and-conquer sorting algorithm that recursively divides the array into two halves until each part has one element, and then repeatedly <b>merges</b> two sorted halves into one sorted array. It was invented by <b>John von Neumann (1945)</b>.</div>\n<p>It runs in <b>Θ(n log n)</b> time in the best, average and worst case, is <b>stable</b>, but needs <b>Θ(n)</b> extra memory (not in-place).</p>\n\n<h3>2. Divide – Conquer – Combine</h3>\n<table class=\"t\">\n<tr><th>Phase</th><th>Merge Sort</th><th>Cost</th></tr>\n<tr><td><b>Divide</b></td><td>Compute middle q = ⌊(p+r)/2⌋</td><td>Θ(1)</td></tr>\n<tr><td><b>Conquer</b></td><td>Recursively sort A[p..q] and A[q+1..r]</td><td>2T(n/2)</td></tr>\n<tr><td><b>Combine</b></td><td>MERGE the two sorted halves</td><td>Θ(n)</td></tr>\n</table>\n\n<h3>3. Algorithm (CLRS)</h3>\n<pre class=\"code\">MERGE-SORT(A, p, r)\n1.  IF p &lt; r THEN\n2.      q ← ⌊(p + r) / 2⌋              // DIVIDE\n3.      MERGE-SORT(A, p, q)             // CONQUER left half\n4.      MERGE-SORT(A, q + 1, r)         // CONQUER right half\n5.      MERGE(A, p, q, r)               // COMBINE\n6.  END IF\n\nMERGE(A, p, q, r)\n1.  n1 ← q − p + 1 ;  n2 ← r − q\n2.  create arrays L[1 .. n1 + 1] and R[1 .. n2 + 1]\n3.  FOR i ← 1 TO n1 DO  L[i] ← A[p + i − 1]\n4.  FOR j ← 1 TO n2 DO  R[j] ← A[q + j]\n5.  L[n1 + 1] ← ∞ ;  R[n2 + 1] ← ∞           // sentinels\n6.  i ← 1 ;  j ← 1\n7.  FOR k ← p TO r DO\n8.      IF L[i] ≤ R[j] THEN                   // \"≤\" keeps it stable\n9.          A[k] ← L[i] ;  i ← i + 1\n10.     ELSE\n11.         A[k] ← R[j] ;  j ← j + 1\n12. END FOR\n\nInitial call: MERGE-SORT(A, 1, n)</pre>\n<h4>How MERGE works</h4>\n<p>Copy the two sorted halves into L and R, put a sentinel ∞ at the end of each, then repeatedly compare the front elements L[i] and R[j] and copy the smaller one back into A. Each of the n = r−p+1 positions is filled once ⇒ <b>MERGE takes Θ(n)</b>. Using <b>≤</b> (take from the left on ties) makes the sort <b>stable</b>.</p>\n<div class=\"note\"><b>Comparisons while merging two sorted lists of sizes m and n</b> (without sentinels): minimum = <b>min(m, n)</b> (all of one list is smaller), maximum = <b>m + n − 1</b> (lists interleave).</div>\n\n<h3>4. Divide tree and merge tree</h3>\n<pre class=\"tree\">                     [38 27 43 3 9 82 10]                    DIVIDE\n                    /                    \\\n          [38 27 43 3]                  [9 82 10]\n           /        \\                    /      \\\n      [38 27]      [43 3]           [9 82]     [10]\n      /    \\       /    \\           /    \\       |\n   [38]   [27]  [43]   [3]       [9]   [82]    [10]\n      \\    /       \\    /           \\    /       |\n      [27 38]      [3 43]           [9 82]     [10]           MERGE\n           \\        /                    \\      /\n          [3 27 38 43]                  [9 10 82]\n                    \\                    /\n                  [3 9 10 27 38 43 82]</pre>\n\n<h3>5. Worked example (exam format)</h3>\n<div class=\"step\"><b>Given:</b> A = [38, 27, 43, 3, 9, 82, 10], n = 7. Split at q = ⌊(p+r)/2⌋ (left half gets the extra element).</div><div class=\"step\"><b>Step 1: DIVIDE</b> (top-down until single elements)</div><pre class=\"tree\">Level 0: [38, 27, 43, 3, 9, 82, 10]\nLevel 1: [38, 27, 43, 3]  [9, 82, 10]\nLevel 2: [38, 27]  [43, 3]  [9, 82]  [10]\nLevel 3: [38]  [27]  [43]  [3]  [9]  [82]</pre><div class=\"step\"><b>Step 2: CONQUER + COMBINE</b> (MERGE calls in the order they execute)</div><table class=\"t\"><tr><th>Merge</th><th>Left</th><th>Right</th><th>Result</th><th>Comparisons</th></tr><tr><td>1</td><td>[38]</td><td>[27]</td><td>[27, 38]</td><td>1</td></tr><tr><td>2</td><td>[43]</td><td>[3]</td><td>[3, 43]</td><td>1</td></tr><tr><td>3</td><td>[27, 38]</td><td>[3, 43]</td><td>[3, 27, 38, 43]</td><td>3</td></tr><tr><td>4</td><td>[9]</td><td>[82]</td><td>[9, 82]</td><td>1</td></tr><tr><td>5</td><td>[9, 82]</td><td>[10]</td><td>[9, 10, 82]</td><td>2</td></tr><tr><td>6</td><td>[3, 27, 38, 43]</td><td>[9, 10, 82]</td><td>[3, 9, 10, 27, 38, 43, 82]</td><td>6</td></tr></table><div class=\"ans\">Final answer: Sorted array = [3, 9, 10, 27, 38, 43, 82] &nbsp;(total comparisons = 14, merge calls = 6)</div>\n\n<h3>6. Time complexity</h3>\n<p>Recurrence: <b>T(n) = 2T(n/2) + Θ(n)</b>, T(1) = Θ(1).</p>\n<h4>(a) By Master theorem</h4>\n<p>a = 2, b = 2, f(n) = n. n<sup>log<sub>b</sub>a</sup> = n<sup>log<sub>2</sub>2</sup> = n. f(n) = Θ(n<sup>log<sub>b</sub>a</sup> · log⁰n) ⇒ Case 2 (k = 0) ⇒ <b>T(n) = Θ(n log n)</b>.</p>\n<h4>(b) By recursion tree</h4>\n<pre class=\"tree\">Level 0:            cn                         → cn\nLevel 1:      cn/2        cn/2                 → cn\nLevel 2:   cn/4 cn/4   cn/4 cn/4               → cn\n  ...                                          → cn\nLevel log₂n:  c c c ... c   (n leaves)         → cn\nNumber of levels = log₂n + 1\nTotal = cn(log₂n + 1) = Θ(n log n)</pre>\n<h4>(c) By substitution (n = 2<sup>k</sup>)</h4>\n<p>T(n) = 2T(n/2) + cn = 4T(n/4) + 2cn = 8T(n/8) + 3cn = … = 2<sup>k</sup>T(n/2<sup>k</sup>) + kcn. Put 2<sup>k</sup> = n (k = log₂n): T(n) = nT(1) + cn log₂n = Θ(n log n).</p>\n<p>The split is always into halves regardless of input order, so <b>best = average = worst = Θ(n log n)</b>.</p>\n<h4>Exact comparison counts (n a power of 2)</h4>\n<ul><li>Best case (already sorted): (n/2)·log₂n comparisons (e.g. n=8 → 12).</li>\n<li>Worst case: n log₂n − n + 1 comparisons (e.g. n=8 → 17).</li></ul>\n\n<h3>7. Space complexity</h3>\n<p>Auxiliary arrays L and R hold up to n elements ⇒ <b>Θ(n)</b> extra space, plus O(log n) recursion stack. Hence Merge Sort is <b>not in-place</b>. (For linked lists merging needs only O(1) extra pointers.)</p>\n\n<h3>8. Properties</h3>\n<table class=\"t\">\n<tr><th>Property</th><th>Merge Sort</th></tr>\n<tr><td>Time (best / avg / worst)</td><td>Θ(n log n) / Θ(n log n) / Θ(n log n)</td></tr>\n<tr><td>Space</td><td>Θ(n) auxiliary</td></tr>\n<tr><td>Stable</td><td>Yes</td></tr>\n<tr><td>In-place</td><td>No</td></tr>\n<tr><td>Recursion depth</td><td>⌈log₂n⌉</td></tr>\n<tr><td>Number of MERGE calls</td><td>n − 1</td></tr>\n</table>\n\n<h3>9. Advantages / disadvantages / applications</h3>\n<ul>\n<li><b>Advantages:</b> guaranteed Θ(n log n); stable; ideal for linked lists; used for <b>external sorting</b> (data on disk) because it reads data sequentially; easy to parallelise.</li>\n<li><b>Disadvantages:</b> Θ(n) extra memory; slower than Quick Sort in practice for arrays in RAM; does the full work even if the input is already sorted.</li>\n<li><b>Applications:</b> external sorting, sorting linked lists, counting inversions, Timsort (Python/Java) uses merging.</li>\n</ul>\n\n<div class=\"tip\"><b>Exam tip:</b> Draw BOTH the divide tree (top-down) and the merge tree (bottom-up). Write the recurrence 2T(n/2)+n and solve it by Master theorem AND by recursion tree for full marks. Common mistake: saying worst case of merge sort is n² — it is n log n in all cases.</div>\n",

   "s": "<div class=\"def\"><b>Definition:</b> Merge Sort is a divide-and-conquer sorting algorithm that divides the array into two halves, recursively sorts them and merges the sorted halves.</div>\n<div class=\"step\"><b>1. Divide–Conquer–Combine:</b> Divide: q = ⌊(p+r)/2⌋; Conquer: sort A[p..q] and A[q+1..r]; Combine: MERGE in Θ(n).</div>\n<div class=\"step\"><b>2. Algorithm:</b></div><pre class=\"code\">MERGE-SORT(A, p, r)\n1.  IF p &lt; r THEN\n2.      q ← ⌊(p + r) / 2⌋              // DIVIDE\n3.      MERGE-SORT(A, p, q)             // CONQUER left half\n4.      MERGE-SORT(A, q + 1, r)         // CONQUER right half\n5.      MERGE(A, p, q, r)               // COMBINE\n6.  END IF\n\nMERGE(A, p, q, r)\n1.  n1 ← q − p + 1 ;  n2 ← r − q\n2.  create arrays L[1 .. n1 + 1] and R[1 .. n2 + 1]\n3.  FOR i ← 1 TO n1 DO  L[i] ← A[p + i − 1]\n4.  FOR j ← 1 TO n2 DO  R[j] ← A[q + j]\n5.  L[n1 + 1] ← ∞ ;  R[n2 + 1] ← ∞           // sentinels\n6.  i ← 1 ;  j ← 1\n7.  FOR k ← p TO r DO\n8.      IF L[i] ≤ R[j] THEN                   // \"≤\" keeps it stable\n9.          A[k] ← L[i] ;  i ← i + 1\n10.     ELSE\n11.         A[k] ← R[j] ;  j ← j + 1\n12. END FOR\n\nInitial call: MERGE-SORT(A, 1, n)</pre>\n<div class=\"step\"><b>3. Example:</b> A = [38, 27, 43, 3, 9, 82, 10]</div><pre class=\"tree\">                     [38 27 43 3 9 82 10]                    DIVIDE\n                    /                    \\\n          [38 27 43 3]                  [9 82 10]\n           /        \\                    /      \\\n      [38 27]      [43 3]           [9 82]     [10]\n      /    \\       /    \\           /    \\       |\n   [38]   [27]  [43]   [3]       [9]   [82]    [10]\n      \\    /       \\    /           \\    /       |\n      [27 38]      [3 43]           [9 82]     [10]           MERGE\n           \\        /                    \\      /\n          [3 27 38 43]                  [9 10 82]\n                    \\                    /\n                  [3 9 10 27 38 43 82]</pre>\n<div class=\"step\"><b>4. Time:</b> T(n) = 2T(n/2) + cn. Master theorem: a=2, b=2, n<sup>log₂2</sup> = n = f(n) ⇒ Case 2 ⇒ Θ(n log n). Recursion tree: log₂n + 1 levels × cn = Θ(n log n). Same for best, average, worst.</div>\n<div class=\"step\"><b>5. Space:</b> Θ(n) auxiliary for L and R + O(log n) stack ⇒ not in-place.</div>\n<div class=\"step\"><b>6. Advantages:</b> guaranteed Θ(n log n), stable, good for linked lists and external sorting, parallelisable. <b>Disadvantages:</b> Θ(n) extra memory, slower than Quick Sort in practice, no benefit for nearly sorted data.</div>\n<div class=\"ans\">Conclusion: Merge Sort is a stable Θ(n log n) sort in every case at the cost of Θ(n) extra space.</div>"

   "s": "<div class=\"step\"><b>Working:</b> Given sorted sub-arrays A[p..q] and A[q+1..r], copy them into L and R, append ∞ to each, then for k = p to r copy the smaller of L[i], R[j] into A[k] and advance that pointer.</div>\n<div class=\"step\"><b>Example:</b> L = [27, 38, ∞], R = [3, 43, ∞]<br>k=1: 27 vs 3 → 3; k=2: 27 vs 43 → 27; k=3: 38 vs 43 → 38; k=4: ∞ vs 43 → 43. Result [3, 27, 38, 43].</div>\n<div class=\"step\"><b>Sentinel ∞:</b> when one list is used up, its front becomes ∞, so the other list is copied automatically — no need to test \"is L empty?\" in every iteration.</div>\n<div class=\"ans\">MERGE is Θ(n); sentinels simplify the loop to exactly n iterations.</div>"

DAA.topics.push({
 "id": "strassen",
 "unit": 2,
 "title": "Strassen's Matrix Multiplication",
 "lectures": "L16",
 "weight": "High",
 "summary": "7 block multiplications + 18 additions instead of 8: T(n) = 7T(n/2) + Θ(n²) = Θ(n^log₂7) ≈ Θ(n^2.81).",
 "notes": "\n<h3>1. Matrix multiplication problem</h3>\n<p>Given two n × n matrices A and B, compute C = A × B where <b>C<sub>ij</sub> = ∑<sub>k=1</sub><sup>n</sup> A<sub>ik</sub> · B<sub>kj</sub></b>.</p>\n<h4>(a) Conventional (iterative) method</h4>\n<pre class=\"code\">FOR i ← 1 TO n\n    FOR j ← 1 TO n\n        C[i][j] ← 0\n        FOR k ← 1 TO n\n            C[i][j] ← C[i][j] + A[i][k] × B[k][j]</pre>\n<p>n² entries, each needs n multiplications and n−1 additions ⇒ <b>n³ multiplications, n³ − n² additions ⇒ Θ(n³)</b>. For 2×2 matrices: 8 multiplications and 4 additions:</p>\n<pre class=\"code\">C11 = A11·B11 + A12·B21      C12 = A11·B12 + A12·B22\nC21 = A21·B11 + A22·B21      C22 = A21·B12 + A22·B22</pre>\n\n<h3>2. Simple divide-and-conquer method</h3>\n<p>Assume n is a power of 2 (otherwise <b>pad with zeros</b>). Divide each matrix into four n/2 × n/2 blocks and apply the same four formulas to blocks.</p>\n<pre class=\"code\">MM(A, B, n)                          // simple divide &amp; conquer\n1. IF n ≤ 2 THEN compute C directly with the 4 formulas\n2. ELSE\n3.   partition A, B into n/2 × n/2 blocks A11..A22, B11..B22\n4.   C11 ← MM(A11,B11,n/2) + MM(A12,B21,n/2)\n5.   C12 ← MM(A11,B12,n/2) + MM(A12,B22,n/2)\n6.   C21 ← MM(A21,B11,n/2) + MM(A22,B21,n/2)\n7.   C22 ← MM(A21,B12,n/2) + MM(A22,B22,n/2)\n8. RETURN C                            // 8 recursive multiplications</pre>\n<p>8 recursive multiplications of size n/2 plus 4 matrix additions of size n/2 (Θ(n²)):</p>\n<p><b>T(n) = 8T(n/2) + Θ(n²)</b>, T(1) or T(2) = constant. Master: a = 8, b = 2, n<sup>log<sub>2</sub>8</sup> = n³ ≫ n² ⇒ Case 1 ⇒ <b>Θ(n³)</b>. No improvement over the conventional method — we must reduce the number of multiplications.</p>\n\n<h3>3. Strassen's idea (Volker Strassen, 1969)</h3>\n<div class=\"def\"><b>Definition:</b> <b>Strassen's matrix multiplication</b> is a divide-and-conquer algorithm that multiplies two n × n matrices using only <b>7 recursive multiplications</b> of n/2 × n/2 matrices (instead of 8) at the cost of <b>18 additions/subtractions</b>, giving time Θ(n<sup>log<sub>2</sub>7</sup>) ≈ Θ(n<sup>2.81</sup>).</div>\n<p>Since multiplication of matrices is much costlier (Θ(n³)) than addition (Θ(n²)), trading one multiplication for extra additions wins asymptotically.</p>\n<h4>Strassen's formulas (as in the lecture)</h4>\n<pre class=\"code\">P1 = (A11 + A22) · (B11 + B22)\nP2 = (A21 + A22) · B11\nP3 = A11 · (B12 − B22)\nP4 = A22 · (B21 − B11)\nP5 = (A11 + A12) · B22\nP6 = (A21 − A11) · (B11 + B12)\nP7 = (A12 − A22) · (B21 + B22)\n\nC11 = P1 + P4 − P5 + P7\nC12 = P3 + P5\nC21 = P2 + P4\nC22 = P1 + P3 − P2 + P6</pre>\n<div class=\"note\">Count: products use 10 additions/subtractions (P1: 2, P2: 1, P3: 1, P4: 1, P5: 1, P6: 2, P7: 2) and combining uses 8 (C11: 3, C12: 1, C21: 1, C22: 3) ⇒ <b>18 additions/subtractions, 7 multiplications</b>.</div>\n\n<h3>4. Algorithm</h3>\n<pre class=\"code\">STRASSEN(A, B, n)\n1.  IF n = 1 THEN RETURN [A[1][1] × B[1][1]]\n2.  Partition A and B into four n/2 × n/2 sub-matrices\n3.  Recursively compute the 7 products P1 … P7 (each n/2 × n/2):\n       P1 ← STRASSEN(A11 + A22, B11 + B22, n/2)\n       P2 ← STRASSEN(A21 + A22, B11, n/2)\n       P3 ← STRASSEN(A11, B12 − B22, n/2)\n       P4 ← STRASSEN(A22, B21 − B11, n/2)\n       P5 ← STRASSEN(A11 + A12, B22, n/2)\n       P6 ← STRASSEN(A21 − A11, B11 + B12, n/2)\n       P7 ← STRASSEN(A12 − A22, B21 + B22, n/2)\n4.  C11 ← P1 + P4 − P5 + P7      C12 ← P3 + P5\n    C21 ← P2 + P4                C22 ← P1 + P3 − P2 + P6\n5.  RETURN C</pre>\n\n<h3>5. Verification of the formulas</h3>\n<pre class=\"code\">C11 = P1 + P4 − P5 + P7\n    = (A11 + A22)(B11 + B22) + A22(B21 − B11) − (A11 + A12)B22 + (A12 − A22)(B21 + B22)\n    = A11B11 + A11B22 + A22B11 + A22B22\n      + A22B21 − A22B11\n      − A11B22 − A12B22\n      + A12B21 + A12B22 − A22B21 − A22B22\n    = A11B11 + A12B21            (all other terms cancel)  ✓</pre>\n<pre class=\"code\">C22 = P1 + P3 − P2 + P6\n    = (A11 + A22)(B11 + B22) + A11(B12 − B22) − (A21 + A22)B11 + (A21 − A11)(B11 + B12)\n    = A11B11 + A11B22 + A22B11 + A22B22\n      + A11B12 − A11B22\n      − A21B11 − A22B11\n      + A21B11 + A21B12 − A11B11 − A11B12\n    = A21B12 + A22B22            ✓</pre>\n<p>C12 = P3 + P5 = A11B12 − A11B22 + A11B22 + A12B22 = A11B12 + A12B22 ✓ &nbsp; C21 = P2 + P4 = A21B11 + A22B11 + A22B21 − A22B11 = A21B11 + A22B21 ✓</p>\n\n<h3>6. Worked example (lecture activity)</h3>\n<div class=\"step\"><b>Given:</b> A = <table class=\"t\" style=\"display:inline-table;width:auto\"><tr><td>1</td><td>2</td></tr><tr><td>3</td><td>4</td></tr></table> &nbsp; B = <table class=\"t\" style=\"display:inline-table;width:auto\"><tr><td>5</td><td>6</td></tr><tr><td>7</td><td>8</td></tr></table><br>A11=1, A12=2, A21=3, A22=4; B11=5, B12=6, B21=7, B22=8</div><div class=\"step\"><b>Step 1: Compute the seven products</b></div><table class=\"t\"><tr><th>Product</th><th>Formula &amp; substitution</th><th>Value</th></tr><tr><td>P1</td><td>(A11+A22)(B11+B22) = (1+4)(5+8) = 5 × 13</td><td><b>65</b></td></tr><tr><td>P2</td><td>(A21+A22)·B11 = (3+4) × 5 = 7 × 5</td><td><b>35</b></td></tr><tr><td>P3</td><td>A11·(B12−B22) = 1 × (6−8) = 1 × -2</td><td><b>-2</b></td></tr><tr><td>P4</td><td>A22·(B21−B11) = 4 × (7−5) = 4 × 2</td><td><b>8</b></td></tr><tr><td>P5</td><td>(A11+A12)·B22 = (1+2) × 8 = 3 × 8</td><td><b>24</b></td></tr><tr><td>P6</td><td>(A21−A11)(B11+B12) = (3−1)(5+6) = 2 × 11</td><td><b>22</b></td></tr><tr><td>P7</td><td>(A12−A22)(B21+B22) = (2−4)(7+8) = -2 × 15</td><td><b>-30</b></td></tr></table><div class=\"step\"><b>Step 2: Combine</b><br>C11 = P1 + P4 − P5 + P7 = 65 + 8 − 24 − 30 = <b>19</b><br>C12 = P3 + P5 = -2 + 24 = <b>22</b><br>C21 = P2 + P4 = 35 + 8 = <b>43</b><br>C22 = P1 + P3 − P2 + P6 = 65 − 2 − 35 + 22 = <b>50</b></div><div class=\"step\"><b>Step 3: Verification (conventional method)</b><br>C11 = 1·5 + 2·7 = 19; C12 = 1·6 + 2·8 = 22; C21 = 3·5 + 4·7 = 43; C22 = 3·6 + 4·8 = 50 ✓</div><div class=\"ans\">Final answer: C = A × B = <table class=\"t\" style=\"display:inline-table;width:auto\"><tr><td>19</td><td>22</td></tr><tr><td>43</td><td>50</td></tr></table> &nbsp;(7 multiplications, 18 additions/subtractions)</div>\n\n<h3>7. Time complexity analysis</h3>\n<p>7 multiplications of size n/2 and 18 additions of n/2 × n/2 matrices (each (n/2)² operations):</p>\n<p><b>T(n) = 7T(n/2) + 18(n/2)² = 7T(n/2) + Θ(n²)</b> for n &gt; 1 (or n &gt; 2), T(1) = 1.</p>\n<p><b>Master theorem:</b> a = 7, b = 2, f(n) = n². n<sup>log<sub>2</sub>7</sup> = n<sup>2.807</sup>. Since f(n) = n² = O(n<sup>2.807 − ε</sup>) with ε ≈ 0.8 ⇒ Case 1 ⇒ <b>T(n) = Θ(n<sup>log<sub>2</sub>7</sup>) = Θ(n<sup>2.81</sup>)</b>.</p>\n<p><b>By substitution</b> (counting multiplications only, M(n) = 7M(n/2), M(1)=1): M(n) = 7<sup>k</sup> with n = 2<sup>k</sup> ⇒ 7<sup>log<sub>2</sub>n</sup> = n<sup>log<sub>2</sub>7</sup> ≈ n<sup>2.81</sup>.</p>\n<table class=\"t\">\n<tr><th>n</th><th>Conventional mults n³ = 8<sup>k</sup></th><th>Strassen mults 7<sup>k</sup></th><th>Saving</th></tr>\n<tr><td>2</td><td>8</td><td>7</td><td>1</td></tr>\n<tr><td>4</td><td>64</td><td>49</td><td>15</td></tr>\n<tr><td>8</td><td>512</td><td>343</td><td>169</td></tr>\n<tr><td>16</td><td>4096</td><td>2401</td><td>1695</td></tr>\n<tr><td>32</td><td>32768</td><td>16807</td><td>15961</td></tr>\n</table>\n<p>Number of scalar additions in Strassen (recursing to 1×1): A(n) = 7A(n/2) + 18(n/2)², A(1) = 0 ⇒ A(2) = 18, A(4) = 198, A(8) = 1674 (conventional needs n³ − n²: 4, 48, 448).</p>\n\n<h3>8. Comparison</h3>\n<table class=\"t\">\n<tr><th>Method</th><th>Multiplications (2×2 / blocks)</th><th>Additions</th><th>Recurrence</th><th>Time</th></tr>\n<tr><td>Conventional (3 loops)</td><td>8</td><td>4</td><td>—</td><td>Θ(n³)</td></tr>\n<tr><td>Simple D&amp;C</td><td>8</td><td>4</td><td>8T(n/2)+Θ(n²)</td><td>Θ(n³)</td></tr>\n<tr><td>Strassen</td><td>7</td><td>18</td><td>7T(n/2)+Θ(n²)</td><td>Θ(n<sup>2.81</sup>)</td></tr>\n</table>\n\n<h3>9. 4 × 4 outline</h3>\n<p>For 4 × 4 matrices, split each into four 2 × 2 blocks. Each P<sub>i</sub> is a product of two 2 × 2 matrices, which is again computed by Strassen (7 scalar products each) ⇒ 7 × 7 = 49 scalar multiplications instead of 64. The C<sub>ij</sub> blocks are then assembled into the 4 × 4 result.</p>\n\n<h3>10. Limitations / disadvantages</h3>\n<ul>\n<li>Large hidden constant (18 additions) — for small n the conventional method is faster; practical implementations switch to the normal method below a <b>cutoff</b> size (e.g. n ≤ 64).</li>\n<li>n must be a power of 2; otherwise matrices are <b>padded with zeros</b> (wastes time/space).</li>\n<li>Extra memory for the temporary sums and the 7 products.</li>\n<li>Less <b>numerically stable</b> for floating-point numbers (subtractions cause round-off error).</li>\n<li>Not useful for <b>sparse</b> matrices; harder to implement.</li>\n</ul>\n<p><b>Advantage:</b> asymptotically faster — Θ(n<sup>2.81</sup>) vs Θ(n³); useful for very large dense matrices. (Later algorithms reach about n<sup>2.37</sup>, but are impractical.)</p>\n\n<div class=\"tip\"><b>Exam tip:</b> Memorise P1–P7 with the pattern \"1: (A11+A22)(B11+B22), 2: (A21+A22)B11, 3: A11(B12−B22), 4: A22(B21−B11), 5: (A11+A12)B22, 6: (A21−A11)(B11+B12), 7: (A12−A22)(B21+B22)\" and the combination \"C11 = 1+4−5+7, C12 = 3+5, C21 = 2+4, C22 = 1+3−2+6\". Always verify the result with the normal method at the end of a numerical — it catches sign mistakes in P4, P6, P7.</div>\n",

   "s": "<pre class=\"code\">P1 = (A11 + A22) · (B11 + B22)\nP2 = (A21 + A22) · B11\nP3 = A11 · (B12 − B22)\nP4 = A22 · (B21 − B11)\nP5 = (A11 + A12) · B22\nP6 = (A21 − A11) · (B11 + B12)\nP7 = (A12 − A22) · (B21 + B22)\n\nC11 = P1 + P4 − P5 + P7\nC12 = P3 + P5\nC21 = P2 + P4\nC22 = P1 + P3 − P2 + P6</pre><div class=\"step\"><b>Verification of C11:</b></div><pre class=\"code\">C11 = P1 + P4 − P5 + P7\n    = (A11 + A22)(B11 + B22) + A22(B21 − B11) − (A11 + A12)B22 + (A12 − A22)(B21 + B22)\n    = A11B11 + A11B22 + A22B11 + A22B22\n      + A22B21 − A22B11\n      − A11B22 − A12B22\n      + A12B21 + A12B22 − A22B21 − A22B22\n    = A11B11 + A12B21            (all other terms cancel)  ✓</pre><div class=\"step\"><b>Verification of C22:</b></div><pre class=\"code\">C22 = P1 + P3 − P2 + P6\n    = (A11 + A22)(B11 + B22) + A11(B12 − B22) − (A21 + A22)B11 + (A21 − A11)(B11 + B12)\n    = A11B11 + A11B22 + A22B11 + A22B22\n      + A11B12 − A11B22\n      − A21B11 − A22B11\n      + A21B11 + A21B12 − A11B11 − A11B12\n    = A21B12 + A22B22            ✓</pre><div class=\"ans\">Both identities hold, so Strassen's 7 products give the correct product matrix.</div>"

  {
   "type": "theory",
   "marks": 10,
   "q": "Explain Strassen's matrix multiplication algorithm. Derive its time complexity and compare it with the conventional and simple divide-and-conquer methods.",
   "s": "<div class=\"def\"><b>Definition:</b> Strassen's algorithm (1969) multiplies n × n matrices by dividing them into four n/2 × n/2 blocks and computing the product with only 7 block multiplications and 18 block additions/subtractions.</div>\n<div class=\"step\"><b>1. Conventional:</b> C<sub>ij</sub> = ∑ A<sub>ik</sub>B<sub>kj</sub>, three nested loops ⇒ n³ multiplications ⇒ Θ(n³).</div>\n<div class=\"step\"><b>2. Simple D&amp;C:</b> 8 block products: T(n) = 8T(n/2) + Θ(n²) ⇒ Θ(n³).</div>\n<div class=\"step\"><b>3. Strassen's formulas:</b></div><pre class=\"code\">P1 = (A11 + A22) · (B11 + B22)\nP2 = (A21 + A22) · B11\nP3 = A11 · (B12 − B22)\nP4 = A22 · (B21 − B11)\nP5 = (A11 + A12) · B22\nP6 = (A21 − A11) · (B11 + B12)\nP7 = (A12 − A22) · (B21 + B22)\n\nC11 = P1 + P4 − P5 + P7\nC12 = P3 + P5\nC21 = P2 + P4\nC22 = P1 + P3 − P2 + P6</pre>\n<div class=\"step\"><b>4. Algorithm:</b></div><pre class=\"code\">STRASSEN(A, B, n)\n1.  IF n = 1 THEN RETURN [A[1][1] × B[1][1]]\n2.  Partition A and B into four n/2 × n/2 sub-matrices\n3.  Recursively compute the 7 products P1 … P7 (each n/2 × n/2):\n       P1 ← STRASSEN(A11 + A22, B11 + B22, n/2)\n       P2 ← STRASSEN(A21 + A22, B11, n/2)\n       P3 ← STRASSEN(A11, B12 − B22, n/2)\n       P4 ← STRASSEN(A22, B21 − B11, n/2)\n       P5 ← STRASSEN(A11 + A12, B22, n/2)\n       P6 ← STRASSEN(A21 − A11, B11 + B12, n/2)\n       P7 ← STRASSEN(A12 − A22, B21 + B22, n/2)\n4.  C11 ← P1 + P4 − P5 + P7      C12 ← P3 + P5\n    C21 ← P2 + P4                C22 ← P1 + P3 − P2 + P6\n5.  RETURN C</pre>\n<div class=\"step\"><b>5. Analysis:</b> T(n) = 7T(n/2) + 18(n/2)², T(1) = 1. Master theorem: a = 7, b = 2, n<sup>log₂7</sup> ≈ n<sup>2.807</sup>, f(n) = Θ(n²) = O(n<sup>2.807 − ε</sup>) ⇒ Case 1 ⇒ T(n) = Θ(n<sup>2.81</sup>). (Substitution: T(n) = 7<sup>log₂n</sup> = n<sup>log₂7</sup>.)</div>\n<div class=\"step\"><b>6. Comparison:</b></div>\n<table class=\"t\"><tr><th>Method</th><th>Mults</th><th>Adds</th><th>Time</th></tr>\n<tr><td>Conventional</td><td>8</td><td>4</td><td>Θ(n³)</td></tr><tr><td>Simple D&amp;C</td><td>8</td><td>4</td><td>Θ(n³)</td></tr><tr><td>Strassen</td><td>7</td><td>18</td><td>Θ(n<sup>2.81</sup>)</td></tr></table>\n<div class=\"step\"><b>7. Limitations:</b> large constants (slow for small n), padding to power of 2, extra memory, numerical instability, unsuitable for sparse matrices.</div>\n<div class=\"ans\">Conclusion: Strassen's method is asymptotically faster (Θ(n<sup>2.81</sup>)) than Θ(n³) methods and is used for large dense matrices with a cutoff to the normal method for small blocks.</div>"
  },

   "marks": 5,
   "q": "List the advantages and limitations of Strassen's matrix multiplication.",
   "s": "<p><b>Advantages:</b></p><ul><li>Asymptotically faster: Θ(n<sup>2.81</sup>) vs Θ(n³).</li><li>Fewer multiplications (7<sup>k</sup> vs 8<sup>k</sup>) — big saving for large matrices (n = 32: 16807 vs 32768).</li><li>Sub-problems are independent ⇒ parallelisable.</li></ul>\n<p><b>Limitations:</b></p><ul><li>18 additions ⇒ large constant; slower than conventional for small n (needs a cutoff).</li><li>Requires n = 2<sup>k</sup>; otherwise zero padding.</li><li>Needs extra memory for temporary matrices.</li><li>Numerically less stable with floating-point values.</li><li>Not suitable for sparse matrices; complex to implement.</li></ul>\n<div class=\"ans\">Useful for large dense matrices; for small ones the conventional method is better.</div>"

  notes: `
<h3>1. Definition</h3>
<div class="def"><b>Definition:</b> A <b>binary tree</b> is a finite set of nodes that is either <b>empty</b>, or consists of a distinguished node called the <b>root</b> together with two disjoint binary trees called the <b>left subtree</b> and the <b>right subtree</b>. Hence every node has <b>at most two children</b> (0, 1 or 2), called the left child and the right child.</div>
<p>A binary tree is a <b>non-linear, hierarchical</b> data structure. It is used in searching (BST), sorting (heap sort), expression evaluation (expression trees), compression (Huffman tree), priority queues (heaps) and database indexing.</p>

<h4>Node structure</h4>
<p>Each node has three parts: <b>Node = Left pointer + Data + Right pointer</b></p>
<pre class="code">struct Node {
    struct Node *left;    // address of left child (NULL if none)
    int data;             // information field
    struct Node *right;   // address of right child (NULL if none)
};</pre>
<pre class="tree">+------+------+-------+
| LEFT | DATA | RIGHT |
+------+------+-------+</pre>

<h4>Example (from the lecture)</h4>
<pre class="tree">            A
        /     \\
    B           C
  /   \\           \\
D       E           F</pre>
<p>A → root; B, C → children of A; D, E → children of B; F → right child of C; D, E, F → leaf nodes.</p>

<h3>2. Important Terminology</h3>
<table class="t">
<tr><th>Term</th><th>Meaning</th><th>In the tree above</th></tr>
<tr><td>Root</td><td>Topmost node; the only node with no parent</td><td>A</td></tr>
<tr><td>Parent</td><td>Node that has an edge to a child below it</td><td>B is parent of D, E</td></tr>
<tr><td>Child</td><td>Node directly below another node</td><td>B, C are children of A</td></tr>
<tr><td>Siblings</td><td>Nodes having the same parent</td><td>B and C; D and E</td></tr>
<tr><td>Leaf (external / terminal node)</td><td>Node with no children (degree 0)</td><td>D, E, F</td></tr>
<tr><td>Internal (non-terminal) node</td><td>Node with at least one child</td><td>A, B, C</td></tr>
<tr><td>Degree of a node</td><td>Number of children of that node (0, 1 or 2 in a binary tree)</td><td>deg(A)=2, deg(C)=1, deg(F)=0</td></tr>
<tr><td>Degree of the tree</td><td>Maximum degree of any node</td><td>2</td></tr>
<tr><td>Edge</td><td>Link between a parent and a child; n nodes ⇒ n − 1 edges</td><td>6 nodes, 5 edges</td></tr>
<tr><td>Path</td><td>Sequence of nodes connected by edges</td><td>A → B → E</td></tr>
<tr><td>Level</td><td>Root is at level 0; children of a level-i node are at level i + 1</td><td>D, E, F are at level 2</td></tr>
<tr><td>Depth of a node</td><td>Number of edges from the root to the node</td><td>depth(E) = 2</td></tr>
<tr><td>Height of a node</td><td>Number of edges on the longest path from the node down to a leaf</td><td>height(B) = 1</td></tr>
<tr><td>Height of the tree</td><td>Height of the root (empty tree = −1, single node = 0)</td><td>2</td></tr>
<tr><td>Ancestor / Descendant</td><td>Any node on the path from root to a node / any node below a node</td><td>A, B are ancestors of D</td></tr>
<tr><td>Subtree</td><td>A node together with all its descendants</td><td>B, D, E form the left subtree of A</td></tr>
</table>
<div class="note">Some books count levels and height starting from 1 (root at level 1). Always <b>state your convention</b> in the exam. This course uses: root at level 0, height of a perfect tree with h levels below the root = h, N = 2<sup>h+1</sup> − 1.</div>

<h3>3. Types of Binary Trees</h3>
<h4>(a) Full (Strict / Proper) Binary Tree</h4>
<div class="def"><b>Definition:</b> Every node has either <b>0 or 2 children</b>. No node has exactly one child.</div>
<pre class="tree">            A
        /     \\
    B           C
  /   \\
D       E</pre>
<p>Property: If a full binary tree has i internal nodes then it has <b>i + 1 leaves</b> and <b>2i + 1 nodes</b> in total.</p>

<h4>(b) Complete Binary Tree</h4>
<div class="def"><b>Definition:</b> All levels are completely filled <b>except possibly the last level</b>, and the last level is filled <b>from left to right</b> without gaps.</div>
<pre class="tree">Complete:
            A
        /       \\
    B               C
  /   \\           /
D       E       F

NOT complete (gap: B has no right child but C has children):
        A
      /     \\
    B           C
  /           /   \\
D           F       G</pre>
<p>Application: Heaps (min-heap, max-heap) and priority queues are complete binary trees stored in arrays. Height = ⌊log₂ n⌋.</p>

<h4>(c) Perfect Binary Tree</h4>
<div class="def"><b>Definition:</b> Every internal node has exactly two children <b>and</b> all leaves are at the <b>same level</b>.</div>
<pre class="tree">            A
        /       \\
    B               C
  /   \\           /   \\
D       E       F       G</pre>
<p>Number of nodes for height h: <b>N = 2<sup>h+1</sup> − 1</b>. For h = 2: N = 2³ − 1 = 7. Leaves = 2<sup>h</sup> = 4.</p>
<p>Every perfect tree is full and complete, but not vice-versa.</p>

<h4>(d) Balanced Binary Tree</h4>
<div class="def"><b>Definition:</b> For every node, the heights of its left and right subtrees differ by <b>at most 1</b>. Example: AVL tree.</div>
<pre class="tree">            A
        /     \\
    B           C
  /   \\           \\
D       E           F</pre>
<p>Height is O(log n), so search / insert / delete take O(log n).</p>

<h4>(e) Degenerate (Pathological) Binary Tree</h4>
<div class="def"><b>Definition:</b> Every internal node has <b>only one child</b>. It behaves like a linked list; height = n − 1, search = O(n).</div>
<pre class="tree">            A
      /
B
    \\
        C
      /
    D</pre>

<h4>(f) Skewed Binary Tree</h4>
<p>A degenerate tree in which all nodes lean to <b>one side</b>.</p>
<pre class="tree">Left-skewed:                 Right-skewed:
            A
          /
        B
      /
    C
  /
D

A
  \\
    B
      \\
        C
          \\
            D</pre>

<h4>(g) Extended Binary Tree (2-tree)</h4>
<p>Every empty subtree (NULL) is replaced by a special <b>external node</b> (□). The original nodes become internal nodes. Result: every internal node has exactly 2 children. If there are n internal nodes, there are <b>n + 1 external nodes</b>.</p>
<pre class="tree">                            A
                    /           \\
            B                       C
        /       \\                 /     \\
    D               E           □           F
  /   \\           /   \\                   /   \\
□       □       □       □               □       □</pre>

<h4>(h) Expression Tree</h4>
<p>Leaves are operands, internal nodes are operators. Example (A + B) * C:</p>
<pre class="tree">            *
        /     \\
    +           C
  /   \\
A       B</pre>
<p>Preorder gives prefix (* + A B C), inorder gives infix, postorder gives postfix (A B + C *).</p>

<h4>(i) Threaded Binary Tree</h4>
<p>In a binary tree with n nodes there are 2n pointers, of which <b>n + 1 are NULL</b>. In a threaded tree these NULL pointers are replaced by <b>threads</b>: a NULL right pointer points to the inorder successor, a NULL left pointer points to the inorder predecessor. This allows inorder traversal <b>without recursion or stack</b>.</p>

<h4>(j) Binary Search Tree</h4>
<p>Ordering property: Left subtree &lt; Root &lt; Right subtree (covered in BST topic).</p>

<h3>4. Properties of Binary Trees (with proofs)</h3>
<div class="step"><b>Property 1:</b> Maximum number of nodes at level i is <b>2<sup>i</sup></b> (root at level 0).<br>
<i>Proof (induction):</i> Level 0 has 1 = 2⁰ node. Assume level i has at most 2<sup>i</sup> nodes. Each node has at most 2 children, so level i + 1 has at most 2·2<sup>i</sup> = 2<sup>i+1</sup> nodes. ∎</div>
<div class="step"><b>Property 2:</b> Maximum number of nodes in a binary tree of height h is <b>2<sup>h+1</sup> − 1</b>.<br>
<i>Proof:</i> ∑<sub>i=0..h</sub> 2<sup>i</sup> = 1 + 2 + 4 + … + 2<sup>h</sup> = 2<sup>h+1</sup> − 1 (geometric series). ∎</div>
<div class="step"><b>Property 3:</b> Minimum number of nodes in a tree of height h is <b>h + 1</b> (skewed tree).</div>
<div class="step"><b>Property 4:</b> A binary tree with n nodes has exactly <b>n − 1 edges</b> (every node except the root has exactly one edge to its parent).</div>
<div class="step"><b>Property 5:</b> In any non-empty binary tree, <b>n₀ = n₂ + 1</b> (leaves = nodes of degree 2 + 1).<br>
<i>Proof:</i> Let n₀, n₁, n₂ be the number of nodes with 0, 1, 2 children.<br>
Total nodes: n = n₀ + n₁ + n₂ … (1)<br>
Every node except the root is a child, and children are produced only by degree-1 and degree-2 nodes, so edges: n − 1 = n₁ + 2n₂ … (2)<br>
From (1) and (2): n₀ + n₁ + n₂ − 1 = n₁ + 2n₂ ⇒ <b>n₀ = n₂ + 1</b>. ∎</div>
<div class="step"><b>Property 6:</b> Minimum possible height of a binary tree with n nodes is <b>⌈log₂(n + 1)⌉ − 1 = ⌊log₂ n⌋</b>; maximum height is <b>n − 1</b>.<br>
<i>Proof:</i> n ≤ 2<sup>h+1</sup> − 1 ⇒ n + 1 ≤ 2<sup>h+1</sup> ⇒ h ≥ log₂(n + 1) − 1 ⇒ h<sub>min</sub> = ⌈log₂(n + 1)⌉ − 1. ∎</div>
<div class="step"><b>Property 7:</b> Number of NULL links in a binary tree with n nodes = 2n − (n − 1) = <b>n + 1</b>.</div>
<div class="step"><b>Property 8:</b> Number of structurally different binary trees with n nodes = Catalan number <b>C<sub>n</sub> = (2n)! / ((n + 1)! · n!)</b> → 1, 1, 2, 5, 14, 42, …</div>

<h3>5. Representation of Binary Trees</h3>
<h4>(a) Array (Sequential) Representation</h4>
<p>Nodes are stored level by level, left to right.</p>
<table class="t">
<tr><th>Indexing</th><th>Left child of i</th><th>Right child of i</th><th>Parent of i</th></tr>
<tr><td>1-based (root at 1)</td><td>2i</td><td>2i + 1</td><td>⌊i/2⌋</td></tr>
<tr><td>0-based (root at 0)</td><td>2i + 1</td><td>2i + 2</td><td>⌊(i − 1)/2⌋</td></tr>
</table>
<pre class="tree">            A
        /       \\
    B               C
  /   \\           /   \\
D       E       F       G

Index (1-based): 1  2  3  4  5  6  7
Array          : A  B  C  D  E  F  G</pre>
<p><b>Advantages:</b> no pointers, direct access to parent/children — ideal for complete trees (heaps).<br>
<b>Disadvantages:</b> wastes memory for skewed/sparse trees (a skewed tree of height h needs 2<sup>h+1</sup> − 1 cells for only h + 1 nodes); fixed size; insertion/deletion in the middle is costly.</p>

<h4>(b) Linked Representation</h4>
<p>Each node is a structure with left pointer, data, right pointer; the tree is accessed through a root pointer.</p>
<p><b>Advantages:</b> dynamic size, no wasted space for sparse trees, easy insertion/deletion.<br>
<b>Disadvantages:</b> extra memory for pointers, no direct access to the parent (unless a parent pointer is added), n + 1 NULL pointers wasted.</p>

<h3>6. Summary Table (from slides)</h3>

<tr><td>Full</td><td>Every node has 0 or 2 children</td><td>A → B, C</td></tr>
<tr><td>Complete</td><td>Last level filled left to right</td><td>Heap</td></tr>

<tr><td>BST</td><td>Left &lt; Root &lt; Right</td><td>50, 30, 70</td></tr>
<tr><td>Threaded</td><td>NULL pointers used as traversal links</td><td>Inorder threads</td></tr>
<tr><td>Extended</td><td>Missing children shown as external nodes</td><td>□ nodes</td></tr>
<tr><td>Expression</td><td>Represents arithmetic expressions</td><td>(A+B)*C</td></tr>
</table>

DAA.topics.push({
  id: 'trav',
  unit: 3,
  title: 'Binary Tree Traversals',
  lectures: 'L18–L19',
  weight: 'High',
  summary: 'Visiting every node exactly once: Preorder (Root-L-R), Inorder (L-Root-R), Postorder (L-R-Root), level order; building a tree from two traversals.',
  notes: `
<h3>1. Tree Traversal</h3>
<div class="def"><b>Definition:</b> <b>Tree traversal</b> is the process of visiting each node of a tree <b>exactly once</b> in a specific order to perform some operation (printing, evaluating, modifying, deleting).</div>
<p>Since a tree is non-linear, there are several orders. For binary trees the three depth-first orders are named after <b>when the root is visited</b>:</p>
<table class="t">
<tr><th>Traversal</th><th>Order</th><th>Mnemonic</th></tr>
<tr><td>Preorder</td><td>Root → Left → Right</td><td>root <b>pre</b> (before) subtrees — NLR</td></tr>
<tr><td>Inorder</td><td>Left → Root → Right</td><td>root <b>in</b> between — LNR</td></tr>
<tr><td>Postorder</td><td>Left → Right → Root</td><td>root <b>post</b> (after) subtrees — LRN</td></tr>
<tr><td>Level order (BFS)</td><td>Level by level, left to right</td><td>uses a queue</td></tr>
</table>

<h3>2. Recursive Algorithms</h3>
<pre class="code">PREORDER(root)                 // Root → Left → Right
    IF root = NULL THEN RETURN
    VISIT(root)                    // print root.data
    PREORDER(root.left)
    PREORDER(root.right)

INORDER(root)                  // Left → Root → Right
    IF root = NULL THEN RETURN
    INORDER(root.left)
    VISIT(root)
    INORDER(root.right)

POSTORDER(root)                // Left → Right → Root
    IF root = NULL THEN RETURN
    POSTORDER(root.left)
    POSTORDER(root.right)
    VISIT(root)</pre>
<p>C code (as in lecture):</p>
<pre class="code">void preOrder(TreeNode *root) {
    if (root == NULL) return;
    printf("%d ", root-&gt;val);
    preOrder(root-&gt;left);
    preOrder(root-&gt;right);
}</pre>

<h3>3. Lecture Example</h3>
<pre class="tree">            A
        /         \\
    B                   C
  /   \\             /
D       E       F
                  \\
                    G</pre>
<table class="t">
<tr><th>Traversal</th><th>Result</th></tr>
<tr><td>Preorder</td><td>A, B, D, E, C, F, G</td></tr>
<tr><td>Inorder</td><td>D, B, E, A, F, G, C</td></tr>
<tr><td>Postorder</td><td>D, E, B, G, F, C, A</td></tr>
<tr><td>Level order</td><td>A, B, C, D, E, F, G</td></tr>
</table>
<h4>Step-by-step preorder trace</h4>
<table class="t">
<tr><th>Call</th><th>Action</th><th>Output so far</th></tr>
<tr><td>PRE(A)</td><td>visit A, go left</td><td>A</td></tr>
<tr><td>PRE(B)</td><td>visit B, go left</td><td>A B</td></tr>
<tr><td>PRE(D)</td><td>visit D, both NULL</td><td>A B D</td></tr>
<tr><td>PRE(E)</td><td>visit E</td><td>A B D E</td></tr>
<tr><td>PRE(C)</td><td>visit C, go left</td><td>A B D E C</td></tr>
<tr><td>PRE(F)</td><td>visit F, left NULL, go right</td><td>A B D E C F</td></tr>
<tr><td>PRE(G)</td><td>visit G</td><td>A B D E C F G</td></tr>
</table>

<h4>Lecture Figure 1</h4>
<pre class="tree">                        A
                    /     \\
                B           C
        /         \\           \\
D                   E           G
    \\
        F
      /   \\
    H       I</pre>
<p>Preorder: A, B, D, F, H, I, E, C, G<br>Inorder: D, H, F, I, B, E, A, C, G<br>Postorder: H, I, F, D, E, B, G, C, A</p>

<h3>4. Quick Hand Method (for exams)</h3>
<p>Draw a line around the tree starting from the left of the root (Euler tour). Every node is passed 3 times:</p>
<ul><li>Write a node when you pass it on its <b>left</b> side → <b>Preorder</b></li>
<li>Write it when you pass <b>below</b> it → <b>Inorder</b></li>
<li>Write it when you pass on its <b>right</b> side → <b>Postorder</b></li></ul>
<p>Check: Preorder always starts with the root; Postorder always ends with the root; Inorder has the root somewhere in the middle with the left subtree before it.</p>

<h3>5. Level Order Traversal (BFS)</h3>
<pre class="code">LEVELORDER(root)
    IF root = NULL RETURN
    Q ← empty queue;  ENQUEUE(Q, root)
    WHILE Q not empty DO
        x ← DEQUEUE(Q);  VISIT(x)
        IF x.left ≠ NULL  THEN ENQUEUE(Q, x.left)
        IF x.right ≠ NULL THEN ENQUEUE(Q, x.right)</pre>

<h3>6. Iterative Inorder using a Stack</h3>
<pre class="code">ITER_INORDER(root)
    S ← empty stack;  cur ← root
    WHILE cur ≠ NULL OR S not empty DO
        WHILE cur ≠ NULL DO          // go as far left as possible
            PUSH(S, cur);  cur ← cur.left
        cur ← POP(S)
        VISIT(cur)
        cur ← cur.right</pre>

<h3>7. Complexity</h3>
<table class="t"><tr><th>Traversal</th><th>Time</th><th>Space</th></tr>
<tr><td>Pre / In / Post (recursive)</td><td>Θ(n) — each node visited once</td><td>O(h): O(log n) balanced, O(n) skewed</td></tr>
<tr><td>Level order</td><td>Θ(n)</td><td>O(w), w = max width (≤ n/2)</td></tr></table>
<p>Recurrence: T(n) = T(k) + T(n − k − 1) + c, which solves to T(n) = Θ(n) for any split k.</p>

<h3>8. Expression Trees</h3>
<p>Operands are leaves, operators are internal nodes. Preorder → <b>prefix (Polish)</b>, Inorder → <b>infix</b> (add brackets), Postorder → <b>postfix (Reverse Polish)</b>.</p>
<pre class="tree">            *
        /       \\
    +               -
  /   \\           /   \\
a       b       c       d</pre>
<p>Expression (a + b) * (c − d): Prefix: * + a b − c d; Infix: (a + b) * (c − d); Postfix: a b + c d − *</p>
<h4>Building an expression tree from postfix</h4>
<pre class="code">FOR each symbol x in postfix DO
    IF x is an operand THEN PUSH(S, NewNode(x))
    ELSE                         // operator
        r ← POP(S);  l ← POP(S)
        PUSH(S, NewNode(x, l, r))
RETURN POP(S)                     // root</pre>

<h3>9. Constructing a Binary Tree from Traversals</h3>
<div class="def"><b>Key fact:</b> A binary tree is <b>uniquely</b> determined by <b>Inorder + Preorder</b> or by <b>Inorder + Postorder</b> (all keys distinct). <b>Preorder + Postorder</b> does <b>not</b> give a unique tree (unless the tree is full).</div>
<h4>Method (Inorder + Preorder)</h4>
<ol><li>The <b>first</b> element of preorder is the root.</li>
<li>Find the root in inorder: elements to its left form the left subtree, elements to its right form the right subtree.</li>
<li>Take the next elements of preorder (as many as the left subtree size) for the left subtree, the rest for the right; repeat recursively.</li></ol>
<h4>Method (Inorder + Postorder)</h4>
<p>Same, but the <b>last</b> element of postorder is the root.</p>

<h4>Worked example</h4>
<p>Preorder: A B D G C E H I F &nbsp;&nbsp; Inorder: D G B A H E I C F</p>
<table class="t"><tr><th>Step</th><th>Root (from preorder)</th><th>Inorder split</th></tr>
<tr><td>1</td><td>A</td><td>Left {D G B} | Right {H E I C F}</td></tr>
<tr><td>2</td><td>B (next in pre)</td><td>in {D G B}: Left {D G}, Right {}</td></tr>
<tr><td>3</td><td>D</td><td>in {D G}: Left {}, Right {G}</td></tr>
<tr><td>4</td><td>C</td><td>in {H E I C F}: Left {H E I}, Right {F}</td></tr>
<tr><td>5</td><td>E</td><td>in {H E I}: Left {H}, Right {I}</td></tr></table>
<pre class="tree">            A
          /         \\
        B                   C
    /                   /     \\
D                   E           F
  \\               /   \\
    G           H       I</pre>
<p>Check — Postorder: G, D, B, H, I, E, F, C, A</p>

<h4>Why Preorder + Postorder is not enough</h4>
<pre class="tree">Tree 1:
    A
  /
B

Tree 2:
A
  \\
    B</pre>
<p>Both have Preorder A B and Postorder B A, but they are different trees (B is a left child in one and a right child in the other). Inorder (B A vs A B) distinguishes them.</p>

<h3>10. Special Cases</h3>
<ul>
<li><b>Preorder = Inorder</b> ⇔ no node has a left child (right-skewed / only right children). E.g. 1→2→3→4: Pre = In = 1 2 3 4, Post = 4 3 2 1.</li>
<li><b>Postorder = Inorder</b> ⇔ no node has a right child (left-skewed).</li>
<li><b>Preorder = Postorder</b> ⇔ the tree has a single node (or is empty).</li>
<li><b>Preorder = reverse of Postorder</b> ⇔ every node has at most one child.</li>
<li>Inorder of a <b>BST</b> is always in <b>sorted</b> (ascending) order.</li>
</ul>

DAA.topics.push({
  id: 'bst',
  unit: 3,
  title: 'Binary Search Tree (BST)',
  lectures: 'L20–L22',
  weight: 'High',
  summary: 'Binary tree with Left < Root < Right; search, insertion and deletion (leaf / one child / two children) in O(h).',
  notes: `
<h3>1. Definition and BST Property</h3>
<div class="def"><b>Definition:</b> A <b>Binary Search Tree</b> (ordered binary tree) is a binary tree in which for every node x:<br>
• all keys in the <b>left subtree</b> of x are <b>smaller</b> than key(x), and<br>
• all keys in the <b>right subtree</b> of x are <b>greater</b> than key(x),<br>
• and both subtrees are themselves BSTs.</div>
<p>In the lecture: "If the value of the inserted node is bigger than the parent, it goes to the right subtree; if smaller, it goes to the left subtree." (Duplicates are usually not allowed, or are sent consistently to one side.)</p>
<p>Consequence: <b>Inorder traversal of a BST gives the keys in ascending order.</b></p>
<pre class="tree">               50
           /         \\
     30                  70
   /    \\              /    \\
20        40        60        80

Inorder: 20, 30, 40, 50, 60, 70, 80  (sorted)</pre>

<h3>2. Operations</h3>
<h4>(a) Search</h4>
<pre class="code">SEARCH_BST(root, key)
    IF root = NULL THEN RETURN "not found"
    IF key = root.data THEN RETURN root          // found
    ELSE IF key &lt; root.data THEN
        RETURN SEARCH_BST(root.left, key)
    ELSE
        RETURN SEARCH_BST(root.right, key)</pre>
<p>Iterative form: <code>while (x ≠ NULL and key ≠ x.key) x = (key &lt; x.key) ? x.left : x.right</code>.</p>
<p>Each comparison discards one subtree — the same <b>divide and conquer</b> idea as binary search.</p>

<h4>(b) Insertion</h4>
<pre class="code">INSERT_BST(root, key)
    IF root = NULL THEN
        root ← NEWNODE(key)                     // new leaf
        RETURN root
    IF key &lt; root.data THEN
        root.left  ← INSERT_BST(root.left, key)
    ELSE IF key &gt; root.data THEN
        root.right ← INSERT_BST(root.right, key)
    RETURN root                                  // duplicates ignored</pre>
<p>A new key is <b>always inserted as a leaf</b>.</p>

<h4>(c) Find minimum / maximum</h4>
<pre class="code">MIN(x): WHILE x.left ≠ NULL: x ← x.left;  RETURN x      // leftmost node
MAX(x): WHILE x.right ≠ NULL: x ← x.right; RETURN x     // rightmost node</pre>

<h4>(d) Inorder successor / predecessor</h4>
<ul><li>If x has a right subtree: successor = MIN(x.right). Otherwise successor = lowest ancestor whose left child is also an ancestor of x.</li>
<li>Predecessor: MAX(x.left), symmetric.</li></ul>

<h4>(e) Deletion — 3 cases</h4>
<table class="t">
<tr><th>Case</th><th>Action</th></tr>
<tr><td>1. Node is a <b>leaf</b></td><td>Simply remove it (set parent's pointer to NULL).</td></tr>
<tr><td>2. Node has <b>one child</b></td><td>Replace the node by its child (link parent directly to the child).</td></tr>
<tr><td>3. Node has <b>two children</b></td><td>Find the <b>inorder successor</b> (smallest key in the right subtree), copy it into the node, then delete the successor (which has at most one right child → case 1 or 2). Using the inorder predecessor (largest in left subtree) is equally correct.</td></tr>
</table>
<pre class="code">DELETE_BST(root, key)
    IF root = NULL THEN RETURN NULL
    IF key &lt; root.data THEN root.left ← DELETE_BST(root.left, key)
    ELSE IF key &gt; root.data THEN root.right ← DELETE_BST(root.right, key)
    ELSE                                          // node found
        IF root.left = NULL THEN RETURN root.right      // case 1 / 2
        IF root.right = NULL THEN RETURN root.left       // case 2
        succ ← MIN(root.right)                            // case 3
        root.data ← succ.data
        root.right ← DELETE_BST(root.right, succ.data)
    RETURN root</pre>

<h3>5. Complexity</h3>
<table class="t">
<tr><th>Operation</th><th>Best / Average (balanced, h ≈ log n)</th><th>Worst (skewed, h = n − 1)</th></tr>
<tr><td>Search</td><td>O(log n)</td><td>O(n)</td></tr>
<tr><td>Insert</td><td>O(log n)</td><td>O(n)</td></tr>
<tr><td>Delete</td><td>O(log n)</td><td>O(n)</td></tr>
<tr><td>Min / Max / Successor</td><td>O(log n)</td><td>O(n)</td></tr>

<tr><td>Build from n keys</td><td>O(n log n)</td><td>O(n²) (sorted input)</td></tr>
</table>
<p>All of search/insert/delete are <b>O(h)</b> where h = height. Inserting already sorted keys (10, 20, 30, 40) gives a skewed tree:</p>

<h3>6. Advantages and Disadvantages</h3>
<ul><li><b>Advantages:</b> fast search/insert/delete O(log n) on average; sorted output by inorder; dynamic size; supports min, max, range queries.</li>
<li><b>Disadvantages:</b> can become skewed (O(n)); needs balancing; extra pointer memory.</li></ul>
<h4>BST vs Binary Search on array</h4>

<tr><td>Insert/Delete</td><td>O(n) (shifting)</td><td>O(h)</td></tr>
<tr><td>Memory</td><td>Contiguous</td><td>Nodes + pointers</td></tr></table>

 "id": "greedy",

 "title": "Greedy Method – General Method",
 "lectures": "L23",
 "weight": "High",
 "summary": "Build the solution step by step, always taking the locally best feasible choice and never undoing it.",
 "notes": "\n<h3>1. What is the Greedy Method?</h3>\n<div class=\"def\"><b>Definition:</b> The <b>Greedy method</b> is an algorithm design technique used for <b>optimization problems</b>. It builds a solution piece by piece; at every stage it makes the choice that looks <b>best at that moment (locally optimal)</b>, hoping that this sequence of local choices leads to a <b>globally optimal</b> solution. A choice once made is <b>never reconsidered</b> (no backtracking).</div>\n<p>Example from daily life: to pay ₹ 68 using notes/coins of 50, 10, 5, 2, 1 we always take the largest coin that does not exceed the remaining amount → 50 + 10 + 5 + 2 + 1 = 68 (5 coins).</p>\n\n<h3>2. Important terms</h3>\n<table class=\"t\">\n<tr><th>Term</th><th>Meaning</th><th>Example (fractional knapsack)</th></tr>\n<tr><td>Candidate set</td><td>Set of inputs from which the solution is built</td><td>The n items</td></tr>\n<tr><td>Constraints</td><td>Conditions every solution must satisfy</td><td>Σ wᵢxᵢ ≤ M</td></tr>\n<tr><td>Objective function</td><td>Function to be maximised or minimised</td><td>Maximise Σ pᵢxᵢ</td></tr>\n<tr><td>Feasible solution</td><td>Any subset/solution that satisfies the constraints</td><td>Any x with Σ wᵢxᵢ ≤ M</td></tr>\n<tr><td>Optimal solution</td><td>A feasible solution that gives the best value of the objective function</td><td>x giving maximum profit</td></tr>\n<tr><td>Selection function</td><td>Picks the next best candidate</td><td>Item with largest pᵢ/wᵢ</td></tr>\n<tr><td>Feasibility function</td><td>Checks whether the candidate can be added</td><td>Does the item fit?</td></tr>\n</table>\n<div class=\"def\"><b>Feasible solution:</b> a solution that satisfies all constraints of the problem. <b>Optimal solution:</b> the feasible solution that maximises (or minimises) the objective function. Every optimal solution is feasible, but every feasible solution is not optimal.</div>\n\n<h3>3. Control abstraction (Horowitz–Sahni)</h3>\n<pre class=\"code\">Algorithm Greedy(a, n)\n// a[1:n] contains the n inputs\n{\n    solution := ∅;              // initialise the solution\n    for i := 1 to n do\n    {\n        x := Select(a);         // choose the best remaining input\n        if Feasible(solution, x) then\n            solution := Union(solution, x);\n    }\n    return solution;\n}</pre>\n<ul>\n<li><b>Select(a)</b> – selects an input from a[ ], removes it, and returns it (based on the greedy criterion).</li>\n<li><b>Feasible(solution, x)</b> – Boolean function; checks whether x can be included without violating constraints.</li>\n<li><b>Union(solution, x)</b> – adds x to the solution and updates the objective value.</li>\n</ul>\n<p>Two variants: <b>subset paradigm</b> (choose a subset of inputs – knapsack, job sequencing, MST) and <b>ordering paradigm</b> (find an order – e.g. optimal storage on tapes, Huffman merging).</p>\n\n<h3>4. Properties needed for greedy to give an optimal answer</h3>\n<div class=\"def\"><b>Greedy-choice property:</b> a globally optimal solution can be reached by making a locally optimal (greedy) choice. After the choice, only one subproblem remains.</div>\n<div class=\"def\"><b>Optimal substructure:</b> an optimal solution to the problem contains within it optimal solutions to its subproblems.</div>\n<p>If either property is missing, greedy may give a feasible but <b>non-optimal</b> answer.</p>\n\n<h3>5. Characteristics</h3>\n<ul>\n<li>Makes decisions in stages, one input at a time.</li>\n<li>Decision is based only on current information (local optimum).</li>\n<li>No backtracking – once included/rejected, a decision is final.</li>\n<li>Usually a sorting step dominates: typical time O(n log n).</li>\n</ul>\n\n<h3>6. Advantages and disadvantages</h3>\n<table class=\"t\">\n<tr><th>Advantages</th><th>Disadvantages</th></tr>\n<tr><td>Simple, intuitive and easy to implement</td><td>Does not always give the optimal solution</td></tr>\n<tr><td>Fast – usually O(n log n) or O(n)</td><td>Correctness must be proved for every problem</td></tr>\n<tr><td>Low memory use – no table of sub-results</td><td>Cannot undo a wrong early decision (no backtracking)</td></tr>\n<tr><td>Optimal for problems with greedy-choice + optimal substructure</td><td>Problem specific; a small change in constraints can break it (fractional → 0/1 knapsack)</td></tr>\n</table>\n\n<h3>7. Where greedy fails (counter-examples)</h3>\n<p><b>(a) Coin change</b> with coins {1, 3, 4}, amount 6: Greedy picks 4 + 1 + 1 = <b>3 coins</b>, but optimal is 3 + 3 = <b>2 coins</b>.</p>\n<p><b>(b) 0/1 knapsack</b> M = 50, (w, p) = (10, 60), (20, 100), (30, 120). Greedy by p/w takes items 1 and 2 → profit 160, but the optimum is items 2 + 3 → profit <b>220</b>.</p>\n<p><b>(c) Shortest path with negative edge weights</b> – Dijkstra (greedy) can give wrong answers.</p>\n\n<h3>8. Greedy vs Dynamic Programming</h3>\n<table class=\"t\">\n<tr><th>Basis</th><th>Greedy method</th><th>Dynamic programming</th></tr>\n<tr><td>Decision</td><td>One choice at each step, never revised</td><td>Considers all choices, picks best using sub-results</td></tr>\n<tr><td>Optimality</td><td>Not always guaranteed</td><td>Always optimal (if principle of optimality holds)</td></tr>\n<tr><td>Subproblems</td><td>Only one subproblem remains after a choice</td><td>Overlapping subproblems solved once and stored</td></tr>\n<tr><td>Approach</td><td>Top-down choice</td><td>Usually bottom-up (tabulation) or memoisation</td></tr>\n<tr><td>Memory</td><td>Little</td><td>Table needed – more memory</td></tr>\n<tr><td>Speed</td><td>Faster</td><td>Slower</td></tr>\n<tr><td>Examples</td><td>Fractional knapsack, Huffman, Job sequencing, Prim, Kruskal, Dijkstra</td><td>0/1 knapsack, LCS, Matrix chain multiplication, TSP</td></tr>\n</table>\n\n<h3>9. Greedy vs Divide and Conquer</h3>\n<table class=\"t\">\n<tr><th>Greedy</th><th>Divide &amp; Conquer</th></tr>\n<tr><td>Builds one solution incrementally by best local choice</td><td>Divides problem into independent subproblems, solves recursively, combines</td></tr>\n<tr><td>Used for optimisation problems</td><td>Used for searching, sorting, multiplication etc.</td></tr>\n<tr><td>Usually iterative</td><td>Usually recursive</td></tr>\n<tr><td>Ex: Huffman, Knapsack</td><td>Ex: Merge sort, Binary search</td></tr>\n</table>\n\n<h3>10. Applications</h3>\n<ul>\n<li>Job sequencing with deadlines</li><li>Fractional knapsack</li><li>Huffman coding (data compression)</li>\n<li>Minimum spanning tree – Prim's and Kruskal's</li><li>Single-source shortest path – Dijkstra</li>\n<li>Activity selection, optimal storage on tapes, optimal merge pattern</li>\n<li>Real life: CPU scheduling, timetabling, network design, cargo loading</li>\n</ul>\n<div class=\"tip\"><b>Exam tip:</b> For a 5/10-mark \"Explain greedy method\" answer write: definition → terms (feasible/optimal/objective) → control abstraction algorithm → two properties → one example → advantages/disadvantages → applications. Always mention \"locally optimal choice\" and \"no backtracking\".</div>\n<div class=\"tip\"><b>Common mistake:</b> Saying greedy always gives the optimal solution. It gives an optimal answer only for problems having the greedy-choice property (e.g. fractional knapsack) – not for 0/1 knapsack.</div>\n",

 "title": "Job Sequencing with Deadlines",

 "weight": "High",
 "summary": "Sort jobs by profit (descending) and put each job in the latest free time slot on or before its deadline.",
 "notes": "\n<h3>1. Problem statement</h3>\n<div class=\"def\"><b>Definition:</b> The sequencing of jobs on a <b>single processor</b> with deadline constraints is called <b>Job Sequencing with Deadlines</b>. We are given n jobs; job i has a deadline dᵢ ≥ 1 and a profit pᵢ ≥ 0. The profit pᵢ is earned <b>only if job i is completed on or before its deadline</b>. Find a subset (and order) of jobs that maximises total profit.</div>\n<h4>Assumptions</h4>\n<ul>\n<li>Only one processor (machine) is available.</li>\n<li>Each job takes exactly <b>one unit of time</b>.</li>\n<li>Non-preemption: a job once started runs to completion.</li>\n<li>Processing starts at time 0; job in slot [t−1, t] finishes at time t.</li>\n</ul>\n<ul>\n<li><b>Feasible solution:</b> a subset J of jobs such that every job in J can be completed by its deadline.</li>\n<li><b>Value</b> of a feasible solution = Σ pᵢ over jobs in J.</li>\n<li><b>Optimal solution:</b> feasible solution with maximum profit.</li>\n</ul>\n\n<h3>2. Greedy strategy</h3>\n<p>The greedy criterion (objective) is <b>profit</b>: consider jobs in <b>non-increasing order of profit</b>; add a job if the set remains feasible. To keep it feasible, place the job in the <b>latest free slot ≤ its deadline</b> (keeps earlier slots free for jobs with smaller deadlines).</p>\n<h4>Steps to solve (Gantt chart method – as in lecture)</h4>\n<div class=\"step\"><b>Step 1:</b> Sort all jobs in decreasing order of profit.</div>\n<div class=\"step\"><b>Step 2:</b> Find the maximum deadline d<sub>max</sub>; draw a Gantt chart with slots 0–1, 1–2, …, (d<sub>max</sub>−1)–d<sub>max</sub>.</div>\n<div class=\"step\"><b>Step 3:</b> Pick jobs one by one; put each job in the latest empty slot not later than its deadline. If no slot is free, reject the job.</div>\n<div class=\"step\"><b>Step 4:</b> Read the sequence from the Gantt chart; add profits.</div>\n\n<h3>3. Algorithm (slot / Gantt version)</h3>\n<pre class=\"code\">Algorithm JobSequencing(J, d, p, n)\n// jobs sorted so that p[1] ≥ p[2] ≥ ... ≥ p[n]\n{\n    dmax := max(d[1..n]);\n    for t := 1 to dmax do slot[t] := 0;      // 0 means free\n    profit := 0;\n    for i := 1 to n do\n    {\n        for t := min(dmax, d[i]) down to 1 do\n        {\n            if slot[t] = 0 then\n            {\n                slot[t] := i;  profit := profit + p[i];\n                break;\n            }\n        }   // if no free slot found, job i is rejected\n    }\n    return slot, profit;\n}</pre>\n\n<h3>4. Horowitz–Sahni algorithm JS</h3>\n<pre class=\"code\">Algorithm JS(d, J, n)\n// d[i] ≥ 1 deadlines, jobs ordered so p[1] ≥ p[2] ≥ ... ≥ p[n]\n// J[i] is the i-th job in the optimal solution, 1 ≤ i ≤ k\n{\n    d[0] := J[0] := 0;          // sentinel\n    J[1] := 1; k := 1;          // include job 1\n    for i := 2 to n do\n    {\n        // find position for i and check feasibility of insertion\n        r := k;\n        while ((d[J[r]] &gt; d[i]) and (d[J[r]] ≠ r)) do r := r − 1;\n        if ((d[J[r]] ≤ d[i]) and (d[i] &gt; r)) then\n        {\n            // insert i into J[ ]\n            for q := k to (r+1) step −1 do J[q+1] := J[q];\n            J[r+1] := i; k := k + 1;\n        }\n    }\n    return k;\n}</pre>\n<p>JS keeps J in non-decreasing order of deadlines; a set is feasible iff, in this order, the job at position r has deadline ≥ r.</p>\n\n<h3>5. Time complexity</h3>\n<table class=\"t\">\n<tr><th>Step</th><th>Cost</th></tr>\n<tr><td>Sorting by profit</td><td>O(n log n)</td></tr>\n<tr><td>For each job, scan at most d<sub>max</sub> slots</td><td>O(n · d<sub>max</sub>)</td></tr>\n<tr><td>Worst case (d<sub>max</sub> ≈ n)</td><td><b>O(n²)</b></td></tr>\n<tr><td>Space</td><td>O(n) (slot array)</td></tr>\n</table>\n<p>With a disjoint-set (union–find) structure for \"latest free slot\", it becomes almost O(n log n).</p>\n\n<h3>6. Fully worked example (lecture slide)</h3>\n<table class=\"t\"><tr><th>Job</th><th>J1</th><th>J2</th><th>J3</th><th>J4</th><th>J5</th><th>J6</th></tr>\n<tr><td>Deadline</td><td>5</td><td>3</td><td>3</td><td>2</td><td>4</td><td>2</td></tr>\n<tr><td>Profit</td><td>200</td><td>180</td><td>190</td><td>300</td><td>120</td><td>100</td></tr></table>\n<div class=\"step\"><b>Step 1:</b> Decreasing profit: J4(300), J1(200), J3(190), J2(180), J5(120), J6(100).</div>\n<div class=\"step\"><b>Step 2:</b> d<sub>max</sub> = 5 → 5 slots.</div>\n<table class=\"t\"><tr><th>Job</th><th>Deadline</th><th>Slot tried</th><th>Action</th></tr>\n<tr><td>J4</td><td>2</td><td>[1–2]</td><td>Placed</td></tr>\n<tr><td>J1</td><td>5</td><td>[4–5]</td><td>Placed</td></tr>\n<tr><td>J3</td><td>3</td><td>[2–3]</td><td>Placed</td></tr>\n<tr><td>J2</td><td>3</td><td>[2–3] full, [1–2] full, [0–1]</td><td>Placed in [0–1]</td></tr>\n<tr><td>J5</td><td>4</td><td>[3–4]</td><td>Placed</td></tr>\n<tr><td>J6</td><td>2</td><td>[1–2], [0–1] full</td><td>Rejected</td></tr></table>\n<pre class=\"tree\">Time  0      1      2      3      4      5\n      |  J2  |  J4  |  J3  |  J5  |  J1  |</pre>\n<div class=\"ans\">Optimal sequence: J2 → J4 → J3 → J5 → J1; Maximum profit = 180 + 300 + 190 + 120 + 200 = 990</div>\n\n<div class=\"tip\"><b>Exam tip:</b> Always (1) write the sorted table, (2) draw the Gantt chart with time marks 0,1,2,…, (3) show which jobs are rejected and why, (4) box the sequence and profit. The <b>sequence is read from the chart left to right</b> – not in the profit order.</div>\n<div class=\"tip\"><b>Common mistakes:</b> placing a job in the earliest free slot instead of the latest free slot ≤ deadline; forgetting that a job with deadline d can only go in slots 1..d; making the chart longer than the max deadline (or longer than n when d<sub>max</sub> &gt; n).</div>\n",
